    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback, useRef } = React;
        
        // Supabase DB 연결 설정
        const supabaseUrl = 'https://zpzaiuqcoltshtsrllxx.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwemFpdXFjb2x0c2h0c3JsbHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNjA4MTcsImV4cCI6MjEwMTczNjgxN30.zWiMJ0RDpSZlWaSBKcO1X3HvF-NBLw2YTqH6sjfRbME';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const Icon = ({ name, className }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    while (iconRef.current.firstChild) iconRef.current.removeChild(iconRef.current.firstChild);
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    if (className) iconElement.setAttribute('class', className);
                    iconRef.current.appendChild(iconElement);
                    window.lucide.createIcons({ root: iconRef.current, nameAttr: 'data-lucide' });
                }
            }, [name, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const formatCurrency = (amount) => new Intl.NumberFormat('ko-KR').format(amount) + '원';
        const getDaysInMonth = (year, month) => new Date(year, month, 0).getDate();

        const HOLIDAYS = {
            '01-01': '신정', '02-16': '설날 연휴', '02-17': '설날', '02-18': '설날 연휴',
            '03-01': '삼일절', '03-02': '대체공휴일(삼일절)', '05-05': '어린이날',
            '05-24': '부처님오신날', '05-25': '대체공휴일(부처님오신날)', '06-06': '현충일',
            '08-15': '광복절', '08-17': '대체공휴일(광복절)', '09-24': '추석 연휴', 
            '09-25': '추석', '09-26': '추석 연휴', '10-03': '개천절', '10-09': '한글날', '12-25': '기독탄신일(성탄절)'
        };

        const getFixedEvents = (month, day) => {
          const events = [];
          if (day === 25) events.push({ type: 'salary', name: '급여 및 4대보험', color: 'bg-emerald-100 text-emerald-700 border-emerald-200' });
          if (day === 10) events.push({ type: 'tax', name: '원천세 신고납부', color: 'bg-red-100 text-red-700 border-red-200' });
          if (month === 1 && day === 25) events.push({ type: 'tax', name: '부가세 2기 확정', color: 'bg-orange-100 text-orange-700 border-orange-200' });
          if (month === 4 && day === 25) events.push({ type: 'tax', name: '부가세 1기 예정', color: 'bg-orange-100 text-orange-700 border-orange-200' });
          if (month === 7 && day === 25) events.push({ type: 'tax', name: '부가세 1기 확정', color: 'bg-orange-100 text-orange-700 border-orange-200' });
          if (month === 10 && day === 25) events.push({ type: 'tax', name: '부가세 2기 예정', color: 'bg-orange-100 text-orange-700 border-orange-200' });
          if (month === 3 && day === 31) events.push({ type: 'tax', name: '법인세 결산납부', color: 'bg-purple-100 text-purple-700 border-purple-200' });
          if (month === 8 && day === 31) events.push({ type: 'tax', name: '법인세 중간예납', color: 'bg-purple-100 text-purple-700 border-purple-200' });
          return events;
        };

        function AdvancedCalculator() {
            const [expr, setExpr] = useState('');
            const [result, setResult] = useState('');
            const inputRef = useRef(null);

            const calculateResult = (expression) => {
                try {
                    if (!expression) { setResult(''); return; }
                    // 사용자 친화적 기호를 자바스크립트 수식으로 변환 ( % 기호 처리 추가 )
                    let evalStr = expression
                        .replace(/×/g, '*')
                        .replace(/÷/g, '/')
                        .replace(/%/g, '/100');
                        
                    // 안전한 수식 평가를 위해 허용된 문자만 남김
                    const sanitizedExpr = evalStr.replace(/[^0-9+\-*/().]/g, '');
                    if (!sanitizedExpr) return;
                    
                    const res = new Function('return ' + sanitizedExpr)();
                    
                    if (Number.isFinite(res)) {
                        setResult(new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 4 }).format(res));
                    } else { setResult('오류'); }
                } catch (e) { setResult('오류'); }
            };

            const handleClick = (val) => {
                if (val === 'C') { setExpr(''); setResult(''); } 
                else if (val === 'DEL') { setExpr(prev => prev.slice(0, -1)); } 
                else if (val === '=') { calculateResult(expr); } 
                else { setExpr(prev => prev + val); }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); calculateResult(expr); }
                else if (e.key === 'Escape') { setExpr(''); setResult(''); }
                else if (e.key === 'Backspace') { setExpr(prev => prev.slice(0, -1)); }
            };

            const buttons = [ 
                ['C', '(', ')', 'DEL'], 
                ['7', '8', '9', '÷'], 
                ['4', '5', '6', '×'], 
                ['1', '2', '3', '-'], 
                ['0', '.', '%', '+'] 
            ];

            return (
                <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm w-[340px] shrink-0 flex flex-col h-full">
                    <div className="flex items-center gap-2 mb-3">
                        <Icon name="calculator" className="w-4 h-4 text-gray-500" />
                        <h4 className="text-xs font-bold text-gray-700">고급 수식 계산기</h4>
                    </div>
                    
                    <div className="bg-gray-100 p-3 rounded-lg mb-3 flex flex-col justify-center h-24 shadow-inner border border-gray-200 relative">
                        <input 
                            ref={inputRef} type="text" value={expr} onChange={(e) => setExpr(e.target.value)} onKeyDown={handleKeyDown}
                            placeholder="수식 입력" className="w-full bg-transparent border-none text-sm text-gray-600 text-right outline-none tracking-wider font-mono mb-1"
                        />
                        <div className="text-2xl font-black text-gray-900 truncate text-right border-t border-gray-200 pt-1 mt-1">
                            {result || '0'}
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-4 gap-2 flex-1">
                        {buttons.flat().map(btn => (
                            <button key={btn} onClick={() => handleClick(btn)}
                                className={`p-2.5 rounded-lg font-bold text-sm transition-colors shadow-sm
                                  ${['C', 'DEL'].includes(btn) ? 'bg-red-50 text-red-600 hover:bg-red-100' :
                                  ['+','-','×','÷', '(', ')', '%'].includes(btn) ? 'bg-gray-200 text-gray-800 hover:bg-gray-300' :
                                  'bg-gray-50 text-gray-700 hover:bg-gray-100 border border-gray-100'}`}>
                                {btn}
                            </button>
                        ))}
                        <button onClick={() => handleClick('=')} className="col-span-4 p-2.5 rounded-lg font-bold text-sm transition-colors shadow-sm bg-indigo-600 text-white hover:bg-indigo-700">
                            = 결과 계산
                        </button>
                    </div>
                </div>
            );
        }

        function CumulativeSummary({ transactions, currentYear, activeMonth }) {
            const [viewType, setViewType] = useState('YTD'); // YTD, QUARTER, MONTH, CATEGORY
            const [summaryYear, setSummaryYear] = useState(currentYear);
            const [expandedRows, setExpandedRows] = useState({});
            const [groupBy, setGroupBy] = useState('CATEGORY'); // CATEGORY, COUNTRY, CLIENT_TYPE1, CLIENT_TYPE2

            const toggleRow = (rowId) => {
                setExpandedRows(prev => ({ ...prev, [rowId]: !prev[rowId] }));
            };

            const availableYears = useMemo(() => {
                const years = new Set(transactions.map(t => new Date(t.date).getFullYear()));
                years.add(currentYear);
                return Array.from(years).sort((a, b) => b - a);
            }, [transactions, currentYear]);

            const yearlyTransactions = useMemo(() => {
                return transactions.filter(t => new Date(t.date).getFullYear() === summaryYear);
            }, [transactions, summaryYear]);

            // 그룹핑 기준을 동적으로 반환하는 함수
            const getGroupKey = useCallback((t) => {
                if (groupBy === 'COUNTRY') return t.country || '미분류(국가)';
                if (groupBy === 'CLIENT_TYPE1') return t.client_type1 || '미분류(유형1)';
                if (groupBy === 'CLIENT_TYPE2') return t.client_type2 || '미분류(유형2)';
                return t.category || '미분류(항목)';
            }, [groupBy]);

            // 1. 월별 데이터 집계 (동적 그룹핑 기준 적용)
            const monthlyData = useMemo(() => {
                const data = Array.from({length: 12}, () => ({ in: 0, out: 0, net: 0, catIn: {}, catOut: {} }));
                yearlyTransactions.forEach(t => {
                    const txDate = new Date(t.date);
                    const mIdx = txDate.getMonth();
                    const gKey = getGroupKey(t);
                    if (t.type === 'IN') { 
                        data[mIdx].in += t.amount; data[mIdx].net += t.amount; 
                        data[mIdx].catIn[gKey] = (data[mIdx].catIn[gKey] || 0) + t.amount;
                    } else { 
                        data[mIdx].out += t.amount; data[mIdx].net -= t.amount; 
                        data[mIdx].catOut[gKey] = (data[mIdx].catOut[gKey] || 0) + t.amount;
                    }
                });
                return data;
            }, [yearlyTransactions, getGroupKey]);

            // 2. YTD (누적 집계)
            const ytdData = useMemo(() => {
                const data = { in: 0, out: 0, net: 0, catIn: {}, catOut: {} };
                const endMonth = summaryYear === currentYear ? activeMonth : 12;
                for(let i=0; i<endMonth; i++) {
                    data.in += monthlyData[i].in;
                    data.out += monthlyData[i].out;
                    data.net += monthlyData[i].net;
                    Object.entries(monthlyData[i].catIn).forEach(([cat, val]) => { data.catIn[cat] = (data.catIn[cat] || 0) + val; });
                    Object.entries(monthlyData[i].catOut).forEach(([cat, val]) => { data.catOut[cat] = (data.catOut[cat] || 0) + val; });
                }
                return { data, endMonth };
            }, [monthlyData, activeMonth, summaryYear, currentYear]);

            // 3. 분기별 데이터 집계
            const qData = useMemo(() => {
                const data = Array.from({length: 4}, () => ({ in: 0, out: 0, net: 0, catIn: {}, catOut: {} }));
                monthlyData.forEach((d, i) => {
                    const qIdx = Math.floor(i / 3);
                    data[qIdx].in += d.in;
                    data[qIdx].out += d.out;
                    data[qIdx].net += d.net;
                    Object.entries(d.catIn).forEach(([cat, val]) => { data[qIdx].catIn[cat] = (data[qIdx].catIn[cat] || 0) + val; });
                    Object.entries(d.catOut).forEach(([cat, val]) => { data[qIdx].catOut[cat] = (data[qIdx].catOut[cat] || 0) + val; });
                });
                return data;
            }, [monthlyData]);

            // 4. 항목(카테고리/유형)별 전체 데이터 집계
            const categoryData = useMemo(() => {
                const map = {};
                yearlyTransactions.forEach(t => {
                    const gKey = getGroupKey(t);
                    if (!map[gKey]) map[gKey] = { name: gKey, in: 0, out: 0, net: 0 };
                    if (t.type === 'IN') { map[gKey].in += t.amount; map[gKey].net += t.amount; }
                    else { map[gKey].out += t.amount; map[gKey].net -= t.amount; }
                });
                return Object.values(map).sort((a, b) => (b.in + b.out) - (a.in + a.out));
            }, [yearlyTransactions, getGroupKey]);

            // 비율을 계산하고 시각화하는 내부 컴포넌트
            const RatioBar = ({ amount, total, bgClass, isIncome }) => {
                if (total === 0) return <div className="text-right text-gray-300">-</div>;
                const ratio = (amount / total) * 100;
                return (
                    <div className="flex flex-col items-end gap-1 mt-1 opacity-90 w-full max-w-[90px] ml-auto">
                        <div className="flex justify-end items-baseline gap-1.5 text-xs">
                            <span className={`font-semibold whitespace-nowrap ${isIncome ? 'text-blue-600' : 'text-red-600'}`}>{isIncome?'+':'-'}{formatCurrency(amount).replace('원','')}</span>
                            <span className="text-[10px] text-gray-400 font-bold tracking-tighter">{ratio.toFixed(1)}%</span>
                        </div>
                        <div className={`w-full h-1 rounded-full bg-gray-200 overflow-hidden`}>
                            <div className={`h-full rounded-full ${bgClass}`} style={{ width: `${ratio}%` }}></div>
                        </div>
                    </div>
                );
            };

            // 그룹 상세 목록 렌더링 헬퍼 함수
            const renderCategoryDetails = (catIn, catOut, totalIn, totalOut) => {
                const allCats = Array.from(new Set([...Object.keys(catIn), ...Object.keys(catOut)]));
                if (allCats.length === 0) return <tr><td colSpan="4" className="p-2 text-center text-xs text-gray-400 bg-gray-50/50">내역이 없습니다.</td></tr>;
                
                return allCats.sort((a, b) => ((catIn[b]||0)+(catOut[b]||0)) - ((catIn[a]||0)+(catOut[a]||0))).map(cat => (
                    <tr key={`cat-${cat}`} className="bg-gray-50/50 border-b border-gray-100 last:border-0 hover:bg-gray-100/50 transition-colors">
                        <td className="p-2 pl-6 text-xs text-gray-600 align-middle">
                            <div className="flex items-center gap-1.5 truncate max-w-[120px]" title={cat}>
                                <Icon name="corner-down-right" className="w-3 h-3 text-gray-400 shrink-0"/> <span className="truncate">{cat}</span>
                            </div>
                        </td>
                        <td className="p-2 align-middle pr-4">
                            {(catIn[cat] || 0) > 0 ? <RatioBar amount={catIn[cat]} total={totalIn} bgClass="bg-blue-400" isIncome={true} /> : <div className="text-right text-gray-300 pr-1">-</div>}
                        </td>
                        <td className="p-2 align-middle pr-4">
                            {(catOut[cat] || 0) > 0 ? <RatioBar amount={catOut[cat]} total={totalOut} bgClass="bg-red-400" isIncome={false} /> : <div className="text-right text-gray-300 pr-1">-</div>}
                        </td>
                        <td className="p-2 text-xs text-right font-medium text-gray-500 align-middle whitespace-nowrap">
                            {formatCurrency((catIn[cat] || 0) - (catOut[cat] || 0))}
                        </td>
                    </tr>
                ));
            };

            const renderTableRows = () => {
                if (viewType === 'YTD') {
                    const isExpanded = expandedRows['YTD'];
                    return (
                        <>
                            <tr onClick={() => toggleRow('YTD')} className="bg-indigo-50/50 cursor-pointer hover:bg-indigo-100/50 transition-colors group">
                                <td className="p-4 text-sm font-bold text-gray-800 border-b border-gray-200 flex items-center gap-1">
                                    <Icon name={isExpanded ? 'chevron-down' : 'chevron-right'} className="w-4 h-4 text-indigo-500 group-hover:text-indigo-700"/>
                                    1월 ~ {ytdData.endMonth}월 누적
                                </td>
                                <td className="p-4 text-sm font-bold text-blue-600 text-right border-b border-gray-200 whitespace-nowrap">+{formatCurrency(ytdData.data.in).replace('원','')}</td>
                                <td className="p-4 text-sm font-bold text-red-600 text-right border-b border-gray-200 whitespace-nowrap">-{formatCurrency(ytdData.data.out).replace('원','')}</td>
                                <td className={`p-4 text-base font-black text-right border-b border-gray-200 whitespace-nowrap ${ytdData.data.net >= 0 ? 'text-indigo-700' : 'text-red-600'}`}>{formatCurrency(ytdData.data.net)}</td>
                            </tr>
                            {isExpanded && renderCategoryDetails(ytdData.data.catIn, ytdData.data.catOut, ytdData.data.in, ytdData.data.out)}
                        </>
                    );
                } else if (viewType === 'QUARTER') {
                    return qData.map((q, idx) => {
                        const isExpanded = expandedRows[`q-${idx}`];
                        return (
                            <React.Fragment key={`q-${idx}`}>
                                <tr onClick={() => toggleRow(`q-${idx}`)} className="hover:bg-gray-50 border-b border-gray-100 last:border-0 cursor-pointer group transition-colors">
                                    <td className="p-3 text-sm font-bold text-gray-700 flex items-center gap-1">
                                        <Icon name={isExpanded ? 'chevron-down' : 'chevron-right'} className="w-4 h-4 text-gray-400 group-hover:text-gray-600"/>
                                        {idx + 1}분기
                                    </td>
                                    <td className="p-3 text-sm text-blue-600 font-medium text-right whitespace-nowrap">{q.in > 0 ? '+'+formatCurrency(q.in).replace('원','') : '-'}</td>
                                    <td className="p-3 text-sm text-red-600 font-medium text-right whitespace-nowrap">{q.out > 0 ? '-'+formatCurrency(q.out).replace('원','') : '-'}</td>
                                    <td className={`p-3 text-sm font-bold text-right whitespace-nowrap ${q.net >= 0 ? 'text-gray-800' : 'text-red-600'}`}>{formatCurrency(q.net)}</td>
                                </tr>
                                {isExpanded && renderCategoryDetails(q.catIn, q.catOut, q.in, q.out)}
                            </React.Fragment>
                        );
                    });
                } else if (viewType === 'CATEGORY') {
                    if (categoryData.length === 0) return <tr><td colSpan="4" className="p-4 text-center text-sm text-gray-400">해당 연도의 데이터가 없습니다.</td></tr>;
                    const totalYearIn = categoryData.reduce((acc, c) => acc + c.in, 0);
                    const totalYearOut = categoryData.reduce((acc, c) => acc + c.out, 0);
                    
                    return categoryData.map((c, idx) => (
                        <tr key={`cat-${idx}`} className="hover:bg-gray-50 border-b border-gray-100 last:border-0">
                            <td className="p-3 text-sm font-bold text-gray-700 align-middle">
                                <div className="truncate w-full max-w-[130px]" title={c.name}>{c.name}</div>
                            </td>
                            <td className="p-3 align-middle text-right">
                                {(c.in > 0) ? (
                                    <div className="flex flex-col items-end">
                                        <span className="text-sm font-semibold text-blue-600 whitespace-nowrap">+{formatCurrency(c.in).replace('원','')}</span>
                                        <span className="text-[10px] text-gray-500 font-medium mt-0.5">{((c.in / totalYearIn) * 100).toFixed(1)}%</span>
                                    </div>
                                ) : <span className="text-gray-300">-</span>}
                            </td>
                            <td className="p-3 align-middle text-right">
                                {(c.out > 0) ? (
                                    <div className="flex flex-col items-end">
                                        <span className="text-sm font-semibold text-red-600 whitespace-nowrap">-{formatCurrency(c.out).replace('원','')}</span>
                                        <span className="text-[10px] text-gray-500 font-medium mt-0.5">{((c.out / totalYearOut) * 100).toFixed(1)}%</span>
                                    </div>
                                ) : <span className="text-gray-300">-</span>}
                            </td>
                            <td className={`p-3 text-sm font-bold text-right align-middle whitespace-nowrap ${c.net >= 0 ? 'text-gray-800' : 'text-red-600'}`}>{formatCurrency(c.net)}</td>
                        </tr>
                    ));
                } else {
                    return monthlyData.map((m, idx) => {
                        if (summaryYear === currentYear && idx + 1 > activeMonth && m.in === 0 && m.out === 0) return null; 
                        const isExpanded = expandedRows[`m-${idx}`];
                        return (
                            <React.Fragment key={`m-${idx}`}>
                                <tr onClick={() => toggleRow(`m-${idx}`)} className={`hover:bg-gray-50 border-b border-gray-100 last:border-0 cursor-pointer group transition-colors ${summaryYear === currentYear && idx + 1 === activeMonth ? 'bg-blue-50/30' : ''}`}>
                                    <td className="p-3 text-sm font-bold text-gray-700 flex items-center gap-1">
                                        <Icon name={isExpanded ? 'chevron-down' : 'chevron-right'} className="w-4 h-4 text-gray-400 group-hover:text-gray-600"/>
                                        {idx + 1}월
                                    </td>
                                    <td className="p-3 text-sm text-blue-600 font-medium text-right whitespace-nowrap">{m.in > 0 ? '+'+formatCurrency(m.in).replace('원','') : '-'}</td>
                                    <td className="p-3 text-sm text-red-600 font-medium text-right whitespace-nowrap">{m.out > 0 ? '-'+formatCurrency(m.out).replace('원','') : '-'}</td>
                                    <td className={`p-3 text-sm font-bold text-right whitespace-nowrap ${m.net >= 0 ? 'text-gray-800' : 'text-red-600'}`}>{formatCurrency(m.net)}</td>
                                </tr>
                                {isExpanded && renderCategoryDetails(m.catIn, m.catOut, m.in, m.out)}
                            </React.Fragment>
                        );
                    });
                }
            };

            return (
                <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex-1 flex flex-col min-w-[350px]">
                    <div className="flex justify-between items-start mb-4">
                        <div className="flex flex-col gap-2">
                            <div className="flex items-center gap-1.5">
                                <Icon name="pie-chart" className="w-5 h-5 text-indigo-600" />
                                <select 
                                    value={summaryYear} 
                                    onChange={(e) => {setSummaryYear(Number(e.target.value)); setExpandedRows({});}}
                                    className="text-base font-bold text-indigo-700 bg-indigo-50 border-none outline-none cursor-pointer hover:bg-indigo-100 rounded px-1.5 py-0.5 transition-colors focus:ring-2 focus:ring-indigo-300"
                                >
                                    {availableYears.map(y => <option key={y} value={y}>{y}년</option>)}
                                </select>
                                <h4 className="text-base font-bold text-gray-800">결산 분석</h4>
                            </div>
                            <div className="flex items-center gap-1.5 text-xs bg-gray-50 px-2 py-1 rounded">
                                <span className="text-gray-500 font-bold">분석 기준:</span>
                                <select value={groupBy} onChange={e => {setGroupBy(e.target.value); setExpandedRows({});}} className="bg-white border border-gray-200 text-indigo-700 rounded px-1 py-0.5 outline-none font-bold focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 cursor-pointer">
                                    <option value="CATEGORY">항목(카테고리)</option>
                                    <option value="COUNTRY">국가별</option>
                                    <option value="CLIENT_TYPE1">거래처 유형 (1)</option>
                                    <option value="CLIENT_TYPE2">거래처 유형 (2)</option>
                                </select>

                        </div>
                        <div className="flex bg-gray-100 p-1 rounded-lg">
                            <button onClick={() => setViewType('YTD')} className={`px-2 py-1.5 text-[11px] font-bold rounded-md transition-all ${viewType === 'YTD' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>누적</button>
                            <button onClick={() => setViewType('QUARTER')} className={`px-2 py-1.5 text-[11px] font-bold rounded-md transition-all ${viewType === 'QUARTER' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>분기</button>
                            <button onClick={() => setViewType('MONTH')} className={`px-2 py-1.5 text-[11px] font-bold rounded-md transition-all ${viewType === 'MONTH' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>월별</button>
                            <button onClick={() => setViewType('CATEGORY')} className={`px-2 py-1.5 text-[11px] font-bold rounded-md transition-all ${viewType === 'CATEGORY' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>비중</button>
                        </div>
                    </div>
                    
                    <div className="flex-1 overflow-auto rounded-lg border border-gray-200 custom-scrollbar relative">
                        <table className="w-full text-left border-collapse min-w-[400px]">
                            <thead className="bg-gray-50 sticky top-0 shadow-[0_1px_0_rgba(0,0,0,0.1)] z-10">
                                <tr>
                                    <th className="p-3 text-xs font-bold text-gray-500 whitespace-nowrap bg-gray-50 w-[30%]">{viewType === 'CATEGORY' ? '분석 항목' : '기간 (항목 클릭)'}</th>
                                    <th className="p-3 text-xs font-bold text-gray-500 text-right whitespace-nowrap bg-gray-50 w-[24%]">{viewType === 'CATEGORY' ? '수입' : '수입 집계'}</th>
                                    <th className="p-3 text-xs font-bold text-gray-500 text-right whitespace-nowrap bg-gray-50 w-[24%]">{viewType === 'CATEGORY' ? '지출' : '지출 집계'}</th>
                                    <th className="p-3 text-xs font-bold text-gray-500 text-right whitespace-nowrap bg-gray-50 w-[22%]">순수익(잔액)</th>
                                </tr>
                            </thead>
                            <tbody>
                                {renderTableRows()}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // 보안 인증 모달
        function AuthLock({ onAuthenticated }) {
            const [password, setPassword] = useState('');
            const [error, setError] = useState(false);
            const handleSubmit = (e) => {
                e.preventDefault();
                if (password === '245024') { setError(false); onAuthenticated(); } 
                else { setError(true); setPassword(''); }
            };
            return (
                <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
                        <div className="flex justify-center mb-6"><div className="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center"><Icon name="lock" className="w-8 h-8 text-indigo-600" /></div></div>
                        <h2 className="text-2xl font-bold text-center text-gray-800 mb-2">보안 인증</h2>
                        <p className="text-sm text-center text-gray-500 mb-8">자금 수지 현황표에 접근하려면<br/>비밀번호를 입력하세요.</p>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="비밀번호 입력" className={`w-full px-4 py-3 rounded-lg border text-center tracking-widest text-lg font-mono outline-none transition-colors ${error ? 'border-red-500 focus:ring-1 focus:ring-red-500' : 'border-gray-300 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500'}`} autoFocus />
                                {error && <p className="text-xs text-red-500 mt-2 text-center font-semibold animate-pulse">비밀번호가 일치하지 않습니다.</p>}
                            </div>
                            <button type="submit" className="w-full py-3 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition-colors shadow-md">확인</button>
                        </form>
                    </div>
                </div>
            );
        }

        function CashFlowTracker() {
          const currentYear = new Date().getFullYear();
          const todayStr = `${currentYear}-${String(new Date().getMonth() + 1).padStart(2, '0')}-${String(new Date().getDate()).padStart(2, '0')}`;
          const companyId = 'b0722421-a3f5-4f40-b615-ce1bb80145c2'; // 공통 회사 ID

          const [isAuthenticated, setIsAuthenticated] = useState(false);
          const [isLoadingData, setIsLoadingData] = useState(true); 
          const [role, setRole] = useState('ADMIN');
          const [activeTab, setActiveTab] = useState('CALENDAR');
          const [activeMonth, setActiveMonth] = useState(new Date().getMonth() + 1);
          const [selectedDate, setSelectedDate] = useState(todayStr);
          const [selectedAccount, setSelectedAccount] = useState('ALL');
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [isDetailOpen, setIsDetailOpen] = useState(true);

          const [accounts, setAccounts] = useState([]);
          const [inCategories, setInCategories] = useState([]);
          const [outCategories, setOutCategories] = useState([]);
          const [clients, setClients] = useState([]);
          const [transactions, setTransactions] = useState([]);
          const [fundingPlans, setFundingPlans] = useState([]);

          // 폼 상태 - 분류 필드 3개 추가
          const [txForm, setTxForm] = useState({ type: 'IN', accountId: '', category: '', client: '', amount: '', note: '', isRecurring: false, recurType: 'month', recurUntil: `${currentYear}-12-31`, country: '', client_type1: '', client_type2: '' });
          
          // 내역 수정을 위한 상태 관리 추가
          const [editingTxId, setEditingTxId] = useState(null);
          const [editTxForm, setEditTxForm] = useState({ date: '', accountId: '', category: '', client: '', amount: '', note: '', country: '', client_type1: '', client_type2: '' });

          const [fundingForm, setFundingForm] = useState({ date: '', source: '', type: '', amount: '', status: '계획' });
          const [editingFundingId, setEditingFundingId] = useState(null);
          const [editFundingForm, setEditFundingForm] = useState({ date: '', source: '', type: '', amount: '', status: '' });
          
          const [draggedTx, setDraggedTx] = useState(null); // 추가된 드래그 앤 드롭 상태
          
          const [openDailyTx, setOpenDailyTx] = useState({});
          const [expandedMonths, setExpandedMonths] = useState({});
          
          const [toast, setToast] = useState(null);
          const showToast = (msg, isError = false) => { setToast({ msg, isError }); setTimeout(() => setToast(null), 3000); };

          const fetchInitialData = useCallback(async () => {
              setIsLoadingData(true);
              try {
                  const { data: accData } = await supabase.from('cashflow_accounts').select('*').eq('company_id', companyId);
                  setAccounts(accData?.map(a => ({ id: a.id, name: a.name, initialCapital: a.initial_capital, startDate: new Date(a.created_at).toISOString().split('T')[0] })) || []);
                  
                  const { data: catData } = await supabase.from('cashflow_categories').select('*').eq('company_id', companyId);
                  if (catData) {
                      setInCategories(catData.filter(c => c.type === 'IN').map(c => ({ id: c.id, name: c.name })));
                      setOutCategories(catData.filter(c => c.type === 'OUT').map(c => ({ id: c.id, name: c.name })));
                  }
                  
                  const { data: cliData } = await supabase.from('cashflow_clients').select('*').eq('company_id', companyId);
                  setClients(cliData?.map(c => ({ id: c.id, name: c.name })) || []);
                  
                  const { data: txData } = await supabase.from('cashflow_transactions').select('*').eq('company_id', companyId);
                  setTransactions(txData?.map(t => ({ id: t.id, date: t.transaction_date, type: t.type, accountId: t.account_id, category: t.category_name, client: t.client_name, amount: t.amount, note: t.note, country: t.country, client_type1: t.client_type1, client_type2: t.client_type2 })) || []);
                  
                  const { data: fdData } = await supabase.from('cashflow_funding_plans').select('*').eq('company_id', companyId);
                  setFundingPlans(fdData?.map(f => ({ id: f.id, date: f.planned_date, source: f.source, type: f.funding_type, amount: f.amount, status: f.status })) || []);
              } catch (error) { showToast("데이터 불러오기 실패", true); } 
              finally { setIsLoadingData(false); }
          }, []);

          useEffect(() => { if (isAuthenticated) fetchInitialData(); }, [isAuthenticated, fetchInitialData]);
          useEffect(() => { if (accounts.length > 0 && inCategories.length > 0) setTxForm(prev => ({ ...prev, accountId: prev.accountId || accounts[0].id, category: prev.category || inCategories[0].name })); }, [accounts, inCategories]);

          // 자동완성을 위한 고유 목록 추출
          const uniqueCountries = useMemo(() => Array.from(new Set(transactions.map(t => t.country).filter(Boolean))), [transactions]);
          const uniqueType1 = useMemo(() => Array.from(new Set(transactions.map(t => t.client_type1).filter(Boolean))), [transactions]);
          const uniqueType2 = useMemo(() => Array.from(new Set(transactions.map(t => t.client_type2).filter(Boolean))), [transactions]);

          const filteredTransactions = useMemo(() => { if (selectedAccount === 'ALL') return transactions; return transactions.filter(t => t.accountId === selectedAccount); }, [transactions, selectedAccount]);

          const txByDate = useMemo(() => {
            const map = {};
            filteredTransactions.forEach(t => {
              if (!map[t.date]) map[t.date] = { in: 0, out: 0, list: [] };
              if (t.type === 'IN') map[t.date].in += t.amount;
              else map[t.date].out += t.amount;
              map[t.date].list.push(t);
            });
            return map;
          }, [filteredTransactions]);

          const dailyBalances = useMemo(() => {
            const balances = {};
            let currentBalance = 0;
            
            for (let m = 1; m <= 12; m++) {
              let days = getDaysInMonth(currentYear, m);
              for (let d = 1; d <= days; d++) {
                const dateStr = `${currentYear}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                let dailyNewCapital = 0;
                accounts.forEach(acc => { if ((selectedAccount === 'ALL' || selectedAccount === acc.id) && acc.startDate === dateStr) dailyNewCapital += acc.initialCapital; });
                if (dateStr === `${currentYear}-01-01` && dailyNewCapital === 0) {
                    accounts.forEach(acc => { if ((selectedAccount === 'ALL' || selectedAccount === acc.id) && new Date(acc.startDate) < new Date(`${currentYear}-01-01`)) dailyNewCapital += acc.initialCapital; });
                }
                
                const dayFundings = fundingPlans.filter(f => f.date === dateStr);
                const dailyFundingTotal = dayFundings.reduce((sum, f) => sum + f.amount, 0);

                currentBalance += dailyNewCapital;
                const start = currentBalance;
                
                const dayData = txByDate[dateStr] || { in: 0, out: 0 };
                const net = dayData.in - dayData.out;
                
                currentBalance += net;
                currentBalance += dailyFundingTotal; 
                const end = currentBalance;
                balances[dateStr] = { start, in: dayData.in, out: dayData.out, net, dailyFundingTotal, end, newCapital: dailyNewCapital };
              }
            }
            return balances;
          }, [accounts, selectedAccount, txByDate, fundingPlans, currentYear]);

          const handleAddTransaction = async (e) => {
            e.preventDefault();
            if (role !== 'ADMIN') return;
            
            // 유효성 검사 강화
            if (!txForm.accountId) { showToast("계좌를 선택하거나 등록해주세요.", true); return; }
            if (!txForm.category) { showToast("카테고리를 선택하거나 설정에서 등록해주세요.", true); return; }
            if (!txForm.client) { showToast("거래처를 선택해주세요.", true); return; }
            if (!txForm.amount) { showToast("금액을 입력해주세요.", true); return; }
            
            const amountNum = Number(txForm.amount.replace(/[^0-9]/g, ''));
            const dbInsertData = [];
            
            if (txForm.isRecurring && txForm.recurUntil) {
                let currDate = new Date(selectedDate);
                const endDate = new Date(txForm.recurUntil);
                while(currDate <= endDate) {
                    const dateStr = `${currDate.getFullYear()}-${String(currDate.getMonth()+1).padStart(2,'0')}-${String(currDate.getDate()).padStart(2,'0')}`;
                    dbInsertData.push({ company_id: companyId, transaction_date: dateStr, type: txForm.type, account_id: txForm.accountId, category_name: txForm.category, client_name: txForm.client, amount: amountNum, note: txForm.note, country: txForm.country, client_type1: txForm.client_type1, client_type2: txForm.client_type2 });
                    if (txForm.recurType === 'week') currDate.setDate(currDate.getDate() + 7);
                    else if (txForm.recurType === 'month') currDate.setMonth(currDate.getMonth() + 1);
                    else if (txForm.recurType === 'year') currDate.setFullYear(currDate.getFullYear() + 1);
                }
            } else {
                dbInsertData.push({ company_id: companyId, transaction_date: selectedDate, type: txForm.type, account_id: txForm.accountId, category_name: txForm.category, client_name: txForm.client, amount: amountNum, note: txForm.note, country: txForm.country, client_type1: txForm.client_type1, client_type2: txForm.client_type2 });
            }

            try {
                const { data, error } = await supabase.from('cashflow_transactions').insert(dbInsertData).select();
                if (error) throw error;
                const newTxs = data.map(t => ({ id: t.id, date: t.transaction_date, type: t.type, accountId: t.account_id, category: t.category_name, client: t.client_name, amount: t.amount, note: t.note, country: t.country, client_type1: t.client_type1, client_type2: t.client_type2 }));
                setTransactions([...transactions, ...newTxs]);
                setTxForm({ ...txForm, client: '', amount: '', note: '', country: '', client_type1: '', client_type2: '' });
                showToast("내역이 등록되었습니다.");
            } catch(e) { showToast("내역 등록 실패", true); }
          };

          const handleUpdateTransaction = async (id, txType) => {
            if (role !== 'ADMIN') return;
            const amountNum = Number(editTxForm.amount.replace(/[^0-9]/g, ''));
            if (!editTxForm.accountId || !editTxForm.category || !editTxForm.client || !amountNum) {
                showToast("수정할 항목을 모두 올바르게 입력해주세요.", true); return;
            }

            try {
                const { error } = await supabase.from('cashflow_transactions').update({
                    transaction_date: editTxForm.date,
                    account_id: editTxForm.accountId,
                    category_name: editTxForm.category,
                    client_name: editTxForm.client,
                    amount: amountNum,
                    note: editTxForm.note,
                    country: editTxForm.country,
                    client_type1: editTxForm.client_type1,
                    client_type2: editTxForm.client_type2
                }).eq('id', id);

                if (error) throw error;

                setTransactions(transactions.map(t => t.id === id ? {
                    ...t,
                    date: editTxForm.date,
                    accountId: editTxForm.accountId,
                    category: editTxForm.category,
                    client: editTxForm.client,
                    amount: amountNum,
                    note: editTxForm.note,
                    country: editTxForm.country,
                    client_type1: editTxForm.client_type1,
                    client_type2: editTxForm.client_type2
                } : t));

                setEditingTxId(null);
                
                if (editTxForm.date !== selectedDate) {
                    showToast(`내역 수정 완료. (${editTxForm.date} 로 이동되었습니다.)`);
                } else {
                    showToast("내역이 성공적으로 수정되었습니다.");
                }
            } catch (e) { showToast("내역 수정 실패", true); }
          };

          const handleAddFunding = async (e) => {
            e.preventDefault();
            if (role !== 'ADMIN') return;
            const amountNum = Number(fundingForm.amount.replace(/[^0-9]/g, ''));
            try {
                const { data, error } = await supabase.from('cashflow_funding_plans').insert([{ company_id: companyId, planned_date: fundingForm.date, source: fundingForm.source, funding_type: fundingForm.type, amount: amountNum, status: fundingForm.status }]).select();
                if (error) throw error;
                const newPlan = { id: data[0].id, date: data[0].planned_date, source: data[0].source, type: data[0].funding_type, amount: data[0].amount, status: data[0].status };
                setFundingPlans([...fundingPlans, newPlan]);
                setFundingForm({ date: '', source: '', type: '', amount: '', status: '계획' });
                showToast("조달 계획 등록 완료");
            } catch(e) { showToast("등록 실패", true); }
          };

          const handleDelete = async (id, type = 'TX') => {
            if (role !== 'ADMIN' || !window.confirm("정말로 삭제하시겠습니까?")) return;
            try {
                if (type === 'TX') {
                    const { error } = await supabase.from('cashflow_transactions').delete().eq('id', id);
                    if (error) throw error;
                    setTransactions(transactions.filter(t => t.id !== id));
                } else if (type === 'FUNDING') {
                    const { error } = await supabase.from('cashflow_funding_plans').delete().eq('id', id);
                    if (error) throw error;
                    setFundingPlans(fundingPlans.filter(t => t.id !== id));
                }
                showToast("삭제되었습니다.");
            } catch(e) { showToast("삭제 실패", true); }
          };

          const saveEditFunding = async (id) => {
            const amountNum = Number(editFundingForm.amount.replace(/[^0-9]/g, ''));
            try {
                const { error } = await supabase.from('cashflow_funding_plans').update({ planned_date: editFundingForm.date, source: editFundingForm.source, funding_type: editFundingForm.type, amount: amountNum, status: editFundingForm.status }).eq('id', id);
                if (error) throw error;
                setFundingPlans(fundingPlans.map(f => f.id === id ? { ...f, date: editFundingForm.date, source: editFundingForm.source, type: editFundingForm.type, amount: amountNum, status: editFundingForm.status } : f));
                setEditingFundingId(null); showToast("수정 완료");
            } catch(e) { showToast("수정 실패", true); }
          };

          const handleUpdateTxDate = async (tx, newDate) => {
              if (role !== 'ADMIN') return;
              try {
                  const { error } = await supabase.from('cashflow_transactions').update({ transaction_date: newDate }).eq('id', tx.id);
                  if (error) throw error;
                  setTransactions(prev => prev.map(t => t.id === tx.id ? { ...t, date: newDate } : t));
                  showToast(`[${tx.client}] 내역이 ${newDate}로 이동되었습니다.`);
                  setSelectedDate(newDate);
              } catch (e) { showToast("날짜 변경 실패", true); }
          };

          const renderCalendar = () => {
            const daysInMonth = getDaysInMonth(currentYear, activeMonth);
            const firstDay = new Date(currentYear, activeMonth - 1, 1).getDay();
            const days = [];
            for (let i = 0; i < firstDay; i++) days.push(<div key={`empty-${i}`} className="h-28 bg-gray-50/50 border-r border-b border-gray-200"></div>);
            
            for (let d = 1; d <= daysInMonth; d++) {
              const dateStr = `${currentYear}-${String(activeMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
              const isSelected = selectedDate === dateStr;
              const data = dailyBalances[dateStr];
              const events = getFixedEvents(activeMonth, d);
              const isToday = dateStr === todayStr;
              const holidayName = HOLIDAYS[`${String(activeMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`];
              const dayOfWeek = new Date(dateStr).getDay();
              
              let dayColorClass = 'text-gray-700';
              if (dayOfWeek === 0 || holidayName) dayColorClass = 'text-red-500';
              else if (dayOfWeek === 6) dayColorClass = 'text-blue-500';

              const dayFundings = fundingPlans.filter(p => p.date === dateStr);
              const txList = txByDate[dateStr]?.list || [];

              days.push(
                <div key={dateStr} 
                     onClick={() => setSelectedDate(dateStr)} 
                     onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }}
                     onDrop={(e) => {
                         e.preventDefault();
                         if (draggedTx && draggedTx.date !== dateStr) {
                             handleUpdateTxDate(draggedTx, dateStr);
                             setDraggedTx(null);
                         }
                     }}
                     className={`h-36 border-r border-b border-gray-200 p-1.5 cursor-pointer transition-all flex flex-col hover:bg-indigo-50/50 relative overflow-hidden ${isSelected ? 'bg-indigo-50 ring-2 ring-indigo-500 ring-inset z-10' : (holidayName ? 'bg-red-50/30' : 'bg-white')}`}
                >
                  <div className="flex justify-between items-start mb-1 shrink-0">
                    <div className="flex flex-col">
                        <span className={`text-sm font-bold w-6 h-6 flex items-center justify-center rounded-full ${isToday ? 'bg-indigo-600 text-white' : dayColorClass}`}>{d}</span>
                        {holidayName && <span className="text-[9px] font-bold text-red-500 ml-1 leading-tight tracking-tighter w-14 truncate">{holidayName}</span>}
                    </div>
                    <div className="flex flex-col gap-0.5 items-end">
                      {events.map((ev, idx) => (<span key={`ev-${idx}`} className={`text-[9px] px-1 py-0.5 rounded border leading-tight truncate max-w-[55px] ${ev.color}`}>{ev.name.split(' ')[0]}</span>))}
                      {dayFundings.map((f, idx) => (<span key={`f-${idx}`} className="text-[9px] px-1 py-0.5 rounded border leading-tight truncate max-w-[55px] bg-indigo-100 text-indigo-700 border-indigo-200" title={f.source}>[조달] {f.source}</span>))}
                    </div>
                  </div>
                  
                  <div className="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-1 mt-1 mb-1 pr-0.5">
                    {txList.map(tx => (
                        <div

            const [newCatIn, setNewCatIn] = useState('');
            const [newCatOut, setNewCatOut] = useState('');
            const [newAccName, setNewAccName] = useState('');
            const [newAccDate, setNewAccDate] = useState(`${currentYear}-01-01`);
            const [newAccCap, setNewAccCap] = useState('');
            const [newClient, setNewClient] = useState('');
            
            const [editingAccId, setEditingAccId] = useState(null);
            const [editAccForm, setEditAccForm] = useState({ name: '', startDate: '', initialCapital: '' });
            const [editingClientIndex, setEditingClientIndex] = useState(null);
            const [editClientValue, setEditClientValue] = useState('');
            const [editingCatInIndex, setEditingCatInIndex] = useState(null);
            const [editCatInValue, setEditCatInValue] = useState('');
            const [editingCatOutIndex, setEditingCatOutIndex] = useState(null);
            const [editCatOutValue, setEditCatOutValue] = useState('');

            if (!isSettingsOpen) return null;

            const handleAddAccount = async () => {
              if (!newAccName || !newAccCap || !newAccDate) return;
              const capNum = Number(newAccCap.replace(/[^0-9]/g, ''));
              try {
                  const { data, error } = await supabase.from('cashflow_accounts').insert([{ company_id: companyId, name: newAccName, initial_capital: capNum, created_at: newAccDate }]).select();
                  if (error) throw error;
                  setAccounts([...accounts, { id: data[0].id, name: data[0].name, initialCapital: data[0].initial_capital, startDate: newAccDate }]);
                  setNewAccName(''); setNewAccCap(''); showToast("등록 완료");
              } catch(e) { showToast("등록 실패", true); }
            };

            const saveEditAccount = async (id) => {
                const capNum = Number(editAccForm.initialCapital.replace(/[^0-9]/g, ''));
                try {
                    const { error } = await supabase.from('cashflow_accounts').update({ name: editAccForm.name, initial_capital: capNum }).eq('id', id);
                    if (error) throw error;
                    setAccounts(accounts.map(acc => acc.id === id ? { ...acc, name: editAccForm.name, initialCapital: capNum } : acc));
                    setEditingAccId(null); showToast("수정 완료");
                } catch(e) { showToast("수정 실패", true); }
            };
            
            const deleteAccount = async (id) => {
                if(!window.confirm("삭제하시겠습니까?")) return;
                try {
                    await supabase.from('cashflow_accounts').delete().eq('id', id);
                    setAccounts(accounts.filter(a => a.id !== id)); showToast("삭제 완료");
                } catch(e) { showToast("삭제 실패", true); }
            };

            const handleAddClient = async () => {
                if(!newClient) return;
                try {
                    const { data, error } = await supabase.from('cashflow_clients').insert([{ company_id: companyId, name: newClient }]).select();
                    if (error) throw error;
                    setClients([...clients, {id: data[0].id, name: data[0].name}]);
                    setNewClient(''); showToast("등록 완료");
                } catch(e) { showToast("등록 실패", true); }
            };
            
            const saveEditClient = async (c, idx) => {
                try {
                    await supabase.from('cashflow_clients').update({ name: editClientValue }).eq('id', c.id);
                    const updated = [...clients]; updated[idx].name = editClientValue; setClients(updated);
                    await supabase.from('cashflow_transactions').update({ client_name: editClientValue }).eq('client_name', c.name).eq('company_id', companyId);
                    setTransactions(transactions.map(t => t.client === c.name ? { ...t, client: editClientValue } : t));
                    setEditingClientIndex(null); showToast("수정 완료");
                } catch(e) { showToast("수정 실패", true); }
            };
            
            const deleteClient = async (id) => {
                if(!window.confirm("삭제하시겠습니까?")) return;
                try { await supabase.from('cashflow_clients').delete().eq('id', id); setClients(clients.filter(c => c.id !== id)); showToast("삭제 완료"); } 
                catch(e) { showToast("삭제 실패", true); }
            };

            const handleAddCategory = async (type) => {
                const val = type === 'IN' ? newCatIn : newCatOut;
                if(!val) return;
                try {
                    const { data, error } = await supabase.from('cashflow_categories').insert([{ company_id: companyId, type: type, name: val }]).select();
                    if (error) throw error;
                    if(type === 'IN') { setInCategories([...inCategories, {id: data[0].id, name: data[0].name}]); setNewCatIn(''); }
                    else { setOutCategories([...outCategories, {id: data[0].id, name: data[0].name}]); setNewCatOut(''); }
                    showToast("등록 완료");
                } catch(e) { showToast("등록 실패", true); }
            };
            
            const saveEditCategory = async (c, idx, type) => {
                const val = type === 'IN' ? editCatInValue : editCatOutValue;
                try {
                    await supabase.from('cashflow_categories').update({ name: val }).eq('id', c.id);
                    if(type === 'IN') {
                        const updated = [...inCategories]; updated[idx].name = val; setInCategories(updated);
                        await supabase.from('cashflow_transactions').update({ category_name: val }).eq('category_name', c.name).eq('type', 'IN').eq('company_id', companyId);
                        setTransactions(transactions.map(t => (t.type === 'IN' && t.category === c.name) ? { ...t, category: val } : t));
                        setEditingCatInIndex(null);
                    } else {
                        const updated = [...outCategories]; updated[idx].name = val; setOutCategories(updated);
                        await supabase.from('cashflow_transactions').update({ category_name: val }).eq('category_name', c.name).eq('type', 'OUT').eq('company_id', companyId);
                        setTransactions(transactions.map(t => (t.type === 'OUT' && t.category === c.name) ? { ...t, category: val } : t));
                        setEditingCatOutIndex(null);

                    showToast("수정 완료");
                } catch(e) { showToast("수정 실패", true); }

            const deleteCategory = async (id, type) => {
                if(!window.confirm("삭제하시겠습니까?")) return;
                try {
                    await supabase.from('cashflow_categories').delete().eq('id', id);
                    if (type === 'IN') setInCategories(inCategories.filter(c => c.id !== id));
                    else setOutCategories(outCategories.filter(c => c.id !== id));
                    showToast("삭제 완료");
                } catch(e) { showToast("삭제 실패", true); }
            };
            
            return (
              <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">

                                                                }} className="text-gray-400 hover:text-blue-600 transition-colors bg-blue-50 p-1 rounded"><Icon name="pen-line" className="w-3.5 h-3.5" /></button>
                                                                <button onClick={() => handleDelete(tx.id, 'TX')} className="text-gray-400 hover:text-red-500 transition-colors bg-red-50 p-1 rounded"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>
                                                            </div>
                                                        )}
                                                      </div>
                                                      <div className="text-sm font-bold text-gray-800 mb-1 mt-2 flex items-center gap-2">
                                                        {tx.client}

                                                            <div className="flex gap-1">
                                                                {tx.country && <span className="text-[9px] bg-gray-100 text-gray-500 px-1 py-0.5 rounded">{tx.country}</span>}
                                                                {tx.client_type1 && <span className="text-[9px] bg-gray-100 text-gray-500 px-1 py-0.5 rounded">{tx.client_type1}</span>}

                                                      <div className="flex justify-between items-end mt-2">

                                                        <span className="text-base font-extrabold tracking-tight text-red-600">-{formatCurrency(tx.amount)}</span>
                                                      </div>
                                                    </div>
                                                  </div>

                                        </div>
                                    </div>
                                )}
                              </div>
                            )}
                          </div>
                      </>
                      ) : (

                    </section>

                  </>
                )}
              </main>
              <SettingsModal />
            </div>

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CashFlowTracker />);
    </script>
