<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise 스마트 자금 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ name, className }) => {
            const iconRef = React.useRef(null);
            React.useEffect(() => {
                if (iconRef.current && window.lucide) {
                    window.lucide.createIcons({
                        icons: { [name]: window.lucide.icons[name] },
                        nameAttr: 'data-lucide',
                        attrs: { class: className }
                    });
                }
            }, [name, className]);
            return <i ref={iconRef} data-lucide={name}></i>;
        };

        const DEFAULT_ACCOUNTS = [
          { id: 'acc_1', name: '국민은행 (주거래)', initialCapital: 30000000, startDate: '2026-01-01' },
          { id: 'acc_2', name: '기업은행 (보조/세금)', initialCapital: 15000000, startDate: '2026-01-01' },
          { id: 'acc_3', name: '카카오뱅크 (비상금)', initialCapital: 5000000, startDate: '2026-01-01' }
        ];

        const DEFAULT_IN_CATEGORIES = [
          '스마트스토어 정산', '오픈마켓(쿠팡/11번가)', '자사몰(간편결제/PG)', 
          '신용카드 매출', 'B2B 현금/계좌이체', '대출/정부지원금', '기타 수입'
        ];

        const DEFAULT_OUT_CATEGORIES = [
          '원부자재/상품 매입', '고정비 (임대료/관리비)', '인건비 (급여/퇴직금)', 
          '4대보험료 납부', '원천세 납부', '부가세 납부', '법인세/종합소득세 납부', 
          '마케팅/광고비', '물류/택배비', '대출이자/원금 상환'
        ];

        const DEFAULT_CLIENTS = [
          '네이버파이낸셜', '(주)도매상사', '국세청', '토스페이먼츠', 
          '소상공인시장진흥공단', '국민건강보험공단', '신용보증기금', '쿠팡(주)'
        ];

        const formatCurrency = (amount) => new Intl.NumberFormat('ko-KR').format(amount) + '원';
        const getDaysInMonth = (year, month) => new Date(year, month, 0).getDate();

        const HOLIDAYS = {
            '01-01': '신정',
            '02-16': '설날 연휴', '02-17': '설날', '02-18': '설날 연휴',
            '03-01': '삼일절', '03-02': '대체공휴일(삼일절)',
            '05-05': '어린이날',
            '05-24': '부처님오신날', '05-25': '대체공휴일(부처님오신날)',
            '06-06': '현충일',
            '08-15': '광복절', '08-17': '대체공휴일(광복절)',
            '09-24': '추석 연휴', '09-25': '추석', '09-26': '추석 연휴',
            '10-03': '개천절',
            '10-09': '한글날',
            '12-25': '기독탄신일(성탄절)'
        };

        const getFixedEvents = (month, day) => {
          const events = [];
          if (day === 25) events.push({ type: 'salary', name: '급여 및 4대보험', color: 'bg-emerald-100 text-emerald-700 border-emerald-200' });
          if (day === 10) events.push({ type: 'tax', name: '원천세 신고납부', color: 'bg-red-100 text-red-700 border-red-200' });
          
          if (month === 1 && day === 25) events.push({ type: 'tax', name: '부가세 2기 확정', color: 'bg-orange-100 text-orange-700 border-orange-200' });
          if (month === 4 && day === 25) events.push({ type: 'tax', name: '부가세 1기 예정', color: 'bg-orange-100 text-orange-700 border-orange-200' });
          if (month === 7 && day === 25) events.push({ type: 'tax', name: '부가세 1기 확정', color: 'bg-orange-100 text-orange-700 border-orange-200' });
          if (month === 10 && day === 25) events.push({ type: 'tax', name: '부가세 2기 예정', color: 'bg-orange-100 text-orange-700 border-orange-200' });
          
          if (month === 3 && day === 31) events.push({ type: 'tax', name: '법인세 결산납부', color: 'bg-purple-100 text-purple-700 border-purple-200' });
          if (month === 8 && day === 31) events.push({ type: 'tax', name: '법인세 중간예납', color: 'bg-purple-100 text-purple-700 border-purple-200' });
          return events;
        };

        const generateInitialTransactions = (year) => [
          { id: 1, date: `${year}-01-05`, type: 'IN', accountId: 'acc_1', category: '스마트스토어 정산', client: '네이버파이낸셜', amount: 1500000, note: '1주차 정산' },
          { id: 2, date: `${year}-01-05`, type: 'OUT', accountId: 'acc_1', category: '원부자재/상품 매입', client: '(주)도매상사', amount: 500000, note: '박스/포장재' },
          { id: 3, date: `${year}-01-10`, type: 'OUT', accountId: 'acc_2', category: '원천세 납부', client: '국세청', amount: 120000, note: '12월 귀속' },
          { id: 4, date: `${year}-01-15`, type: 'IN', accountId: 'acc_1', category: '자사몰(간편결제/PG)', client: '토스페이먼츠', amount: 2300000, note: '정산금' },
          { id: 5, date: `${year}-01-25`, type: 'OUT', accountId: 'acc_2', category: '부가세 납부', client: '국세청', amount: 1800000, note: '2기 확정' },
          { id: 6, date: `${year}-02-10`, type: 'IN', accountId: 'acc_1', category: '대출/정부지원금', client: '소상공인시장진흥공단', amount: 10000000, note: '성장지원금' },
        ];

        function CashFlowTracker() {
          const currentYear = new Date().getFullYear();
          const todayStr = `${currentYear}-${String(new Date().getMonth() + 1).padStart(2, '0')}-${String(new Date().getDate()).padStart(2, '0')}`;

          const [role, setRole] = useState('ADMIN');
          const [activeTab, setActiveTab] = useState('CALENDAR');
          const [activeMonth, setActiveMonth] = useState(new Date().getMonth() + 1);
          const [selectedDate, setSelectedDate] = useState(todayStr);
          const [selectedAccount, setSelectedAccount] = useState('ALL');
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);

          const [accounts, setAccounts] = useState(DEFAULT_ACCOUNTS);
          const [inCategories, setInCategories] = useState(DEFAULT_IN_CATEGORIES);
          const [outCategories, setOutCategories] = useState(DEFAULT_OUT_CATEGORIES);
          const [clients, setClients] = useState(DEFAULT_CLIENTS);
          const [transactions, setTransactions] = useState(generateInitialTransactions(currentYear));
          const [fundingPlans, setFundingPlans] = useState([
            { id: 1, date: `${currentYear}-05-20`, source: '신용보증기금', type: '보증서 대출', amount: 50000000, status: '심사중' }
          ]);

          const [txForm, setTxForm] = useState({
            type: 'IN', accountId: accounts[0]?.id || '', category: inCategories[0] || '', client: '', amount: '', note: '',
            isRecurring: false, recurType: 'month', recurUntil: `${currentYear}-12-31`
          });
          const [fundingForm, setFundingForm] = useState({ date: '', source: '', type: '', amount: '', status: '계획' });
          
          // Using objects to track edit state to allow canceling
          const [editingAccId, setEditingAccId] = useState(null);
          const [editAccForm, setEditAccForm] = useState({ name: '', startDate: '', initialCapital: '' });
          
          const [editingClientIndex, setEditingClientIndex] = useState(null);
          const [editClientValue, setEditClientValue] = useState('');

          const [editingCatInIndex, setEditingCatInIndex] = useState(null);
          const [editCatInValue, setEditCatInValue] = useState('');
          
          const [editingCatOutIndex, setEditingCatOutIndex] = useState(null);
          const [editCatOutValue, setEditCatOutValue] = useState('');

          const [expandedMonths, setExpandedMonths] = useState({});

          useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, [activeTab, activeMonth, selectedDate, role]);

          const toggleMonth = (month) => setExpandedMonths(prev => ({ ...prev, [month]: !prev[month] }));

          const filteredTransactions = useMemo(() => {
            if (selectedAccount === 'ALL') return transactions;
            return transactions.filter(t => t.accountId === selectedAccount);
          }, [transactions, selectedAccount]);

          const txByDate = useMemo(() => {
            const map = {};
            filteredTransactions.forEach(t => {
              if (!map[t.date]) map[t.date] = { in: 0, out: 0, list: [] };
              if (t.type === 'IN') map[t.date].in += t.amount;
              else map[t.date].out += t.amount;
              map[t.date].list.push(t);
            });
            return map;
          }, [filteredTransactions]);

          const dailyBalances = useMemo(() => {
            const balances = {};
            let currentBalance = 0;
            
            for (let m = 1; m <= 12; m++) {
              let days = getDaysInMonth(currentYear, m);
              for (let d = 1; d <= days; d++) {
                const dateStr = `${currentYear}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                
                let dailyNewCapital = 0;
                accounts.forEach(acc => {
                    if ((selectedAccount === 'ALL' || selectedAccount === acc.id) && acc.startDate === dateStr) {
                        dailyNewCapital += acc.initialCapital;
                    }
                });
                
                if (dateStr === `${currentYear}-01-01` && dailyNewCapital === 0) {
                    accounts.forEach(acc => {
                        if ((selectedAccount === 'ALL' || selectedAccount === acc.id) && new Date(acc.startDate) < new Date(`${currentYear}-01-01`)) {
                            dailyNewCapital += acc.initialCapital;
                        }
                    });
                }

                currentBalance += dailyNewCapital;
                const start = currentBalance;
                
                const dayData = txByDate[dateStr] || { in: 0, out: 0 };
                const net = dayData.in - dayData.out;
                currentBalance += net;
                const end = currentBalance;
                
                balances[dateStr] = { start, in: dayData.in, out: dayData.out, net, end, newCapital: dailyNewCapital };
              }
            }
            return balances;
          }, [accounts, selectedAccount, txByDate, currentYear]);

          const handleAddTransaction = (e) => {
            e.preventDefault();
            if (role !== 'ADMIN' || !txForm.client || !txForm.amount) return;
            
            const amountNum = Number(txForm.amount.replace(/[^0-9]/g, ''));
            let newTxs = [];
            
            if (txForm.isRecurring && txForm.recurUntil) {
                let currDate = new Date(selectedDate);
                const endDate = new Date(txForm.recurUntil);
                
                while(currDate <= endDate) {
                    const dateStr = `${currDate.getFullYear()}-${String(currDate.getMonth()+1).padStart(2,'0')}-${String(currDate.getDate()).padStart(2,'0')}`;
                    newTxs.push({ id: Date.now() + Math.random(), date: dateStr, type: txForm.type, accountId: txForm.accountId, category: txForm.category, client: txForm.client, amount: amountNum, note: txForm.note });
                    
                    if (txForm.recurType === 'week') currDate.setDate(currDate.getDate() + 7);
                    else if (txForm.recurType === 'month') currDate.setMonth(currDate.getMonth() + 1);
                    else if (txForm.recurType === 'year') currDate.setFullYear(currDate.getFullYear() + 1);
                }
            } else {
                newTxs.push({ id: Date.now(), date: selectedDate, type: txForm.type, accountId: txForm.accountId, category: txForm.category, client: txForm.client, amount: amountNum, note: txForm.note });
            }

            setTransactions([...transactions, ...newTxs]);
            setTxForm({ ...txForm, client: '', amount: '', note: '' });
          };

          const handleAddFunding = (e) => {
            e.preventDefault();
            if (role !== 'ADMIN') return;
            const newPlan = { id: Date.now(), ...fundingForm, amount: Number(fundingForm.amount.replace(/[^0-9]/g, '')) };
            setFundingPlans([...fundingPlans, newPlan]);
            setFundingForm({ date: '', source: '', type: '', amount: '', status: '계획' });
          };

          const handleDelete = (id, type = 'TX') => {
            if (role !== 'ADMIN') return;
            if (type === 'TX') setTransactions(transactions.filter(t => t.id !== id));
            if (type === 'FUNDING') setFundingPlans(fundingPlans.filter(t => t.id !== id));
          };

          const renderCalendar = () => {
            const daysInMonth = getDaysInMonth(currentYear, activeMonth);
            const firstDay = new Date(currentYear, activeMonth - 1, 1).getDay();
            const days = [];

            for (let i = 0; i < firstDay; i++) { days.push(<div key={`empty-${i}`} className="h-28 bg-gray-50/50 border-r border-b border-gray-200"></div>); }

            for (let d = 1; d <= daysInMonth; d++) {
              const dateStr = `${currentYear}-${String(activeMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
              const isSelected = selectedDate === dateStr;
              const data = dailyBalances[dateStr];
              const events = getFixedEvents(activeMonth, d);
              const isToday = dateStr === todayStr;
              const monthDayStr = `${String(activeMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
              const holidayName = HOLIDAYS[monthDayStr];
              const dayOfWeek = new Date(dateStr).getDay();
              
              let dayColorClass = 'text-gray-700';
              if (dayOfWeek === 0 || holidayName) dayColorClass = 'text-red-500';
              else if (dayOfWeek === 6) dayColorClass = 'text-blue-500';

              const dayFundings = fundingPlans.filter(p => p.date === dateStr);
              const dayGrantTxs = txByDate[dateStr]?.list.filter(t => t.type === 'IN' && (t.category.includes('지원금') || t.category.includes('대출'))) || [];

              days.push(
                <div key={dateStr} onClick={() => setSelectedDate(dateStr)} className={`h-28 border-r border-b border-gray-200 p-1.5 cursor-pointer transition-all flex flex-col hover:bg-indigo-50/50 relative overflow-hidden ${isSelected ? 'bg-indigo-50 ring-2 ring-indigo-500 ring-inset z-10' : (holidayName ? 'bg-red-50/30' : 'bg-white')}`}>
                  <div className="flex justify-between items-start mb-1">
                    <div className="flex flex-col">
                        <span className={`text-sm font-bold w-6 h-6 flex items-center justify-center rounded-full ${isToday ? 'bg-indigo-600 text-white' : dayColorClass}`}>{d}</span>
                        {holidayName && <span className="text-[9px] font-bold text-red-500 ml-1 leading-tight tracking-tighter w-14 truncate">{holidayName}</span>}
                    </div>
                    
                    <div className="flex flex-col gap-0.5 items-end">
                      {events.map((ev, idx) => (<span key={`ev-${idx}`} className={`text-[9px] px-1 py-0.5 rounded border leading-tight truncate max-w-[55px] ${ev.color}`}>{ev.name.split(' ')[0]}</span>))}
                      {dayFundings.map((f, idx) => (<span key={`f-${idx}`} className="text-[9px] px-1 py-0.5 rounded border leading-tight truncate max-w-[55px] bg-indigo-100 text-indigo-700 border-indigo-200" title={f.source}>[조달] {f.source}</span>))}
                      {dayGrantTxs.map((t, idx) => (<span key={`g-${idx}`} className="text-[9px] px-1 py-0.5 rounded border leading-tight truncate max-w-[55px] bg-blue-100 text-blue-700 border-blue-200" title={t.client}>[입금] {t.client}</span>))}
                    </div>
                  </div>
                  
                  <div className="flex-1 text-[11px] font-medium flex flex-col justify-center gap-0.5">
                    {data.in > 0 && <div className="text-blue-600 flex justify-between"><span>수입</span><span>+{formatCurrency(data.in).replace('원','')}</span></div>}
                    {data.out > 0 && <div className="text-red-600 flex justify-between"><span>지출</span><span>-{formatCurrency(data.out).replace('원','')}</span></div>}
                  </div>

                  <div className="mt-auto pt-1 border-t border-gray-100 flex justify-between text-[10px]">
                     <span className="text-gray-400">잔액</span>
                     <span className="text-gray-800 font-semibold truncate ml-1">{formatCurrency(data.end).replace('원','')}</span>
                  </div>
                </div>
              );
            }
            return days;
          };

          const renderYearlyView = () => (
            <div className="p-6 bg-gray-50 flex-1 overflow-y-auto">
              <h2 className="text-2xl font-bold text-gray-800 mb-6">{currentYear}년 전체 자금 흐름 요약</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 items-start">
                {Array.from({ length: 12 }, (_, i) => i + 1).map(month => {
                  const firstDay = `${currentYear}-${String(month).padStart(2, '0')}-01`;
                  const lastDayStr = `${currentYear}-${String(month).padStart(2, '0')}-${String(getDaysInMonth(currentYear, month)).padStart(2, '0')}`;
                  
                  let monthIn = 0;
                  let monthOut = 0;
                  const days = Object.keys(dailyBalances).filter(k => k.startsWith(`${currentYear}-${String(month).padStart(2,'0')}`)).sort();
                  days.forEach(d => { monthIn += dailyBalances[d].in; monthOut += dailyBalances[d].out; });
                  
                  const startBal = dailyBalances[firstDay]?.start || 0;
                  const endBal = dailyBalances[lastDayStr]?.end || 0;
                  const isExpanded = expandedMonths[month];

                  return (
                    <div key={month} className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition-shadow">
                        <div className="flex justify-between items-center border-b border-gray-100 pb-2 mb-3">
                            <h3 className="text-lg font-bold text-indigo-900">{month}월</h3>
                            <button onClick={() => toggleMonth(month)} className="flex items-center gap-1 text-xs font-semibold text-gray-500 hover:text-indigo-600 bg-gray-50 px-2 py-1 rounded transition-colors">
                                {isExpanded ? <><Icon name="chevron-up" className="w-3.5 h-3.5"/> 접기</> : <><Icon name="chevron-down" className="w-3.5 h-3.5"/> 펼치기</>}
                            </button>
                        </div>
                        <div className="space-y-2 text-sm">
                            <div className="flex justify-between text-gray-500"><span>월초 자금</span><span className="font-medium text-gray-800">{formatCurrency(startBal)}</span></div>
                            <div className="flex justify-between text-blue-600"><span>월 총수입</span><span className="font-semibold">+{formatCurrency(monthIn)}</span></div>
                            <div className="flex justify-between text-red-600"><span>월 총지출</span><span className="font-semibold">-{formatCurrency(monthOut)}</span></div>
                            <div className="pt-2 border-t mt-2 flex justify-between items-center"><span className="font-medium text-gray-600">월말 자금</span><span className="text-base font-bold text-indigo-700">{formatCurrency(endBal)}</span></div>
                        </div>
                        
                        {isExpanded && (
                            <div className="mt-4 pt-3 border-t border-gray-100 overflow-visible">
                                <table className="w-full text-left text-[11px] border-collapse">
                                    <thead>
                                        <tr className="text-gray-500 border-b border-gray-100">
                                            <th className="py-1.5 font-medium">일자</th>
                                            <th className="py-1.5 font-medium text-right">수입</th>
                                            <th className="py-1.5 font-medium text-right">지출</th>
                                            <th className="py-1.5 font-medium text-right">잔액</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {days.map(dStr => {
                                            const dData = dailyBalances[dStr];
                                            const dayNum = parseInt(dStr.split('-')[2], 10);
                                            const txList = txByDate[dStr]?.list || [];
                                            const [isTxOpen, setIsTxOpen] = useState(false);
                                            
                                            // 요일 및 공휴일 확인
                                            const monthDayStr = dStr.substring(5);
                                            const holidayName = HOLIDAYS[monthDayStr];
                                            const dayOfWeek = new Date(dStr).getDay();
                                            let dayColorClass = 'text-gray-700';
                                            if (dayOfWeek === 0 || holidayName) dayColorClass = 'text-red-500 font-bold';
                                            else if (dayOfWeek === 6) dayColorClass = 'text-blue-500 font-bold';

                                            return (
                                                <React.Fragment key={dStr}>
                                                    <tr className="border-b border-gray-50 hover:bg-indigo-50/30 cursor-pointer" onClick={() => setIsTxOpen(!isTxOpen)}>
                                                        <td className={`py-2 font-medium flex flex-col ${dayColorClass}`}>
                                                            <span>{dayNum}일</span>
                                                            {holidayName && <span className="text-[8px] leading-tight text-red-400 font-normal">{holidayName}</span>}
                                                        </td>
                                                        <td className="py-2 text-right text-blue-600 font-medium">{dData.in > 0 ? formatCurrency(dData.in).replace('원','') : '-'}</td>
                                                        <td className="py-2 text-right text-red-600 font-medium">{dData.out > 0 ? formatCurrency(dData.out).replace('원','') : '-'}</td>
                                                        <td className="py-2 text-right font-bold text-gray-800">{formatCurrency(dData.end).replace('원','')}</td>
                                                    </tr>
                                                    {isTxOpen && txList.length > 0 && (
                                                        <tr>
                                                            <td colSpan="4" className="p-0 border-b border-gray-100">
                                                                <div className="bg-gray-50 p-2 text-[10px] space-y-1 rounded-sm shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)]">
                                                                    {txList.map(tx => (

                                            <input type="text" value={editCatOutValue} onChange={e => setEditCatOutValue(e.target.value)} className="flex-1 text-sm p-1.5 border border-red-300 rounded outline-none focus:ring-1 focus:ring-red-500" autoFocus />
                                            <button onClick={() => saveEditCategory(c, i, 'OUT')} className="px-2 py-1.5 bg-emerald-500 text-white font-bold rounded hover:bg-emerald-600 text-xs shadow-sm">저장</button>
                                            <button onClick={() => setEditingCatOutIndex(null)} className="px-2 py-1.5 bg-gray-200 text-gray-700 font-bold rounded hover:bg-gray-300 text-xs shadow-sm">취소</button>
                                        </div>
                                    ) : (
                                        <>
                                            <span className="text-gray-700 font-bold text-sm truncate flex-1 mr-2">{c}</span>
                                            <div className="flex gap-1 shrink-0">
                                                <button onClick={() => {setEditingCatOutIndex(i); setEditCatOutValue(c);}} className="px-2 py-1 bg-white border border-gray-200 text-blue-600 font-bold rounded text-[11px] hover:bg-blue-50 shadow-sm">수정</button>
                                                <button onClick={() => setOutCategories(outCategories.filter((_, idx) => idx !== i))} className="px-2 py-1 bg-white border border-gray-200 text-red-600 font-bold rounded text-[11px] hover:bg-red-50 shadow-sm">삭제</button>
                                            </div>
                                        </>
                                    )}
                                </li>
                            ))}
                        </ul>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            );
          };

          const selectedDayData = dailyBalances[selectedDate] || { start: 0, in: 0, out: 0, net: 0, end: 0, newCapital: 0 };
          const selectedDayTx = txByDate[selectedDate]?.list || [];
          const selectedEvents = selectedDate ? getFixedEvents(parseInt(selectedDate.split('-')[1]), parseInt(selectedDate.split('-')[2])) : [];

          return (
            <div className="min-h-screen bg-gray-100 text-gray-800 font-sans flex flex-col h-screen overflow-hidden">
              <header className="bg-indigo-900 text-white px-6 py-3 flex justify-between items-center shrink-0">
                <div className="flex items-center gap-3">
                  <a href="index.html" title="사내 업무 포털로 돌아가기" className="flex items-center gap-1.5 p-2 bg-indigo-800 hover:bg-indigo-700 text-indigo-100 hover:text-white rounded-lg transition-colors mr-2 border border-indigo-700 shadow-sm">
                    <Icon name="home" className="w-5 h-5" />
                  </a>
                  
                  <Icon name="wallet" className="w-6 h-6 text-indigo-300" />
                  <h1 className="text-xl font-bold tracking-tight">Enterprise 스마트 자금 관리</h1>
                  <div className="ml-8 flex gap-1 bg-indigo-800/50 p-1 rounded-lg hidden lg:flex">
                    {[
                      { id: 'CALENDAR', icon: 'calendar', label: '월별상세' },
                      { id: 'YEARLY', icon: 'line-chart', label: '전체보기(연간)' },
                      { id: 'GRANTS', icon: 'landmark', label: '정부지원금' },
                      { id: 'FUNDING', icon: 'piggy-bank', label: '조달계획' }
                    ].map(tab => (
                      <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${activeTab === tab.id ? 'bg-white text-indigo-900 shadow-sm' : 'text-indigo-200 hover:text-white hover:bg-indigo-700/50'}`}>
                        <Icon name={tab.icon} className="w-4 h-4" />{tab.label}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2">
                     <span className="text-indigo-200 text-sm">통장 필터:</span>
                     <select value={selectedAccount} onChange={(e) => setSelectedAccount(e.target.value)} className="bg-indigo-800 text-white border-none rounded py-1 pl-2 pr-8 text-sm focus:ring-2 focus:ring-indigo-400 cursor-pointer outline-none"><option value="ALL">전체 통장 합산</option>{accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}</select>
                  </div>
                  <div className="w-px h-6 bg-indigo-700 mx-2"></div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setRole(role === 'ADMIN' ? 'MEMBER' : 'ADMIN')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-colors border ${role === 'ADMIN' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50' : 'bg-gray-700 border-gray-600 text-gray-300'}`}>
                      <Icon name={role === 'ADMIN' ? 'shield' : 'users'} className="w-3.5 h-3.5" />{role === 'ADMIN' ? '관리자 모드' : '일반 회원 뷰'}
                    </button>
                    {role === 'ADMIN' && (<button onClick={() => setIsSettingsOpen(true)} className="p-1.5 text-indigo-200 hover:text-white hover:bg-indigo-700 rounded-full transition-colors"><Icon name="settings" className="w-5 h-5" /></button>)}
                  </div>
                </div>
              </header>

              <main className="flex-1 flex overflow-hidden">
                {activeTab === 'YEARLY' && renderYearlyView()}
                {activeTab === 'GRANTS' && renderGrantsView()}
                {activeTab === 'FUNDING' && renderFundingView()}
                
                {activeTab === 'CALENDAR' && (
                  <>
                    <section className="flex-1 flex flex-col min-w-0 bg-white">
                      <div className="px-6 py-4 flex justify-between items-center border-b border-gray-200 bg-gray-50/50">
                        <div className="flex items-center gap-4">
                          <button onClick={() => setActiveMonth(prev => Math.max(1, prev - 1))} className="p-1.5 hover:bg-white hover:shadow-sm rounded-full border border-transparent hover:border-gray-200" disabled={activeMonth === 1}><Icon name="chevron-left" className="w-5 h-5 text-gray-600" /></button>
                          <h2 className="text-2xl font-black text-gray-800 w-32 text-center tracking-tight">{activeMonth}월</h2>
                          <button onClick={() => setActiveMonth(prev => Math.min(12, prev + 1))} className="p-1.5 hover:bg-white hover:shadow-sm rounded-full border border-transparent hover:border-gray-200" disabled={activeMonth === 12}><Icon name="chevron-right" className="w-5 h-5 text-gray-600" /></button>
                        </div>
                        <div className="flex gap-6 text-sm font-medium">
                          <div className="flex flex-col items-end"><span className="text-gray-500 text-[11px] uppercase tracking-wider">월 총 수입</span><span className="text-blue-600 text-lg">{formatCurrency(Object.keys(dailyBalances).filter(k => k.startsWith(`${currentYear}-${String(activeMonth).padStart(2,'0')}`)).reduce((acc, k) => acc + dailyBalances[k].in, 0))}</span></div>
                          <div className="flex flex-col items-end"><span className="text-gray-500 text-[11px] uppercase tracking-wider">월 총 지출</span><span className="text-red-600 text-lg">{formatCurrency(Object.keys(dailyBalances).filter(k => k.startsWith(`${currentYear}-${String(activeMonth).padStart(2,'0')}`)).reduce((acc, k) => acc + dailyBalances[k].out, 0))}</span></div>
                        </div>
                      </div>
                      <div className="flex-1 overflow-y-auto p-4 bg-gray-100">
                        <div className="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm">
                          <div className="grid grid-cols-7 bg-gray-50 border-b border-gray-200">
                            {['일', '월', '화', '수', '목', '금', '토'].map((day, i) => (<div key={day} className={`py-2.5 text-center text-xs font-bold ${i === 0 ? 'text-red-500' : i === 6 ? 'text-blue-500' : 'text-gray-600'}`}>{day}</div>))}
                          </div>
                          <div className="grid grid-cols-7">{renderCalendar()}</div>
                        </div>
                      </div>
                    </section>

                    <section className="w-[420px] xl:w-[480px] bg-white border-l border-gray-200 flex flex-col shrink-0 z-10 shadow-[-10px_0_20px_rgba(0,0,0,0.03)] relative">
                      {role === 'MEMBER' && (<div className="absolute top-0 right-0 m-4 bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded font-semibold flex items-center gap-1 border border-gray-200 z-20"><Icon name="search" className="w-3 h-3"/> 열람 모드</div>)}
                      
                      {selectedDate ? (
                      <>
                          <div className="px-6 py-5 border-b border-gray-200 bg-gray-50">
                            <div className="flex items-center gap-2 mb-4">
                              <div className="bg-indigo-100 p-1.5 rounded-lg"><Icon name="calendar" className="w-5 h-5 text-indigo-700" /></div>
                              <h3 className="text-lg font-extrabold text-gray-900 tracking-tight">{selectedDate.split('-')[1]}월 {selectedDate.split('-')[2]}일 <span className="font-medium text-gray-500 text-base">상세현황</span></h3>
                            </div>
                            <div className="grid grid-cols-2 gap-3 mb-3">
                              <div className="bg-white p-3 rounded-xl border border-gray-200 shadow-sm relative">
                                <p className="text-[11px] text-gray-500 mb-1 font-bold">전일 이월 자금</p>
                                <p className="text-sm font-bold text-gray-800">{formatCurrency(selectedDayData.start - selectedDayData.newCapital)}</p>
                                {selectedDayData.newCapital > 0 && (
                                    <div className="absolute top-2 right-2 text-[10px] font-bold text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded">
                                        신규유입 +{formatCurrency(selectedDayData.newCapital).replace('원','')}
                                    </div>
                                )}
                              </div>
                              <div className="bg-white p-3 rounded-xl border border-indigo-100 shadow-sm bg-indigo-50/50">
                                <p className="text-[11px] text-indigo-600 mb-1 font-bold">기말 자금 (당일 최종)</p>
                                <p className="text-base font-bold text-indigo-700">{formatCurrency(selectedDayData.end)}</p>
                              </div>
                            </div>
                            <div className="flex bg-white rounded-xl border border-gray-200 shadow-sm divide-x divide-gray-100">
                               <div className="flex-1 p-3"><p className="text-[10px] text-gray-500 font-bold mb-0.5">당일 수입</p><p className="text-sm font-bold text-blue-600">+{formatCurrency(selectedDayData.in)}</p></div>
                               <div className="flex-1 p-3"><p className="text-[10px] text-gray-500 font-bold mb-0.5">당일 지출</p><p className="text-sm font-bold text-red-600">-{formatCurrency(selectedDayData.out)}</p></div>
                               <div className="flex-1 p-3 bg-gray-50/50 rounded-r-xl"><p className="text-[10px] text-gray-500 font-bold mb-0.5">일일 소계</p><p className={`text-sm font-bold ${selectedDayData.net >= 0 ? 'text-gray-800' : 'text-red-600'}`}>{selectedDayData.net >= 0 ? '+' : ''}{formatCurrency(selectedDayData.net)}</p></div>
                            </div>
                            {selectedEvents.length > 0 && (
                              <div className="mt-3 flex flex-col gap-2">
                                {selectedEvents.map((ev, idx) => (<div key={idx} className={`flex items-center gap-2 p-2.5 rounded-lg border text-xs font-bold ${ev.color} bg-opacity-50`}><Icon name="alert-circle" className="w-4 h-4 shrink-0" />{ev.name} 일정이 있습니다. 자금을 확인하세요.</div>))}
                              </div>
                            )}
                          </div>

                          {role === 'ADMIN' && (
                            <div className="p-5 border-b border-gray-200 bg-white">
                              <form onSubmit={handleAddTransaction} className="flex flex-col gap-3">
                                <div className="flex bg-gray-100 p-1 rounded-lg">
                                  <button type="button" onClick={() => setTxForm({...txForm, type: 'IN', category: inCategories[0]})} className={`flex-1 py-1.5 text-xs font-bold rounded-md transition-all ${txForm.type === 'IN' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>수입 등록</button>
                                  <button type="button" onClick={() => setTxForm({...txForm, type: 'OUT', category: outCategories[0]})} className={`flex-1 py-1.5 text-xs font-bold rounded-md transition-all ${txForm.type === 'OUT' ? 'bg-white text-red-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>지출 등록</button>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                  <select value={txForm.accountId} onChange={(e) => setTxForm({...txForm, accountId: e.target.value})} className="px-3 py-2 border border-gray-300 rounded-md text-xs font-medium focus:ring-2 focus:ring-indigo-500 outline-none bg-white">{accounts.length === 0 && <option value="">계좌 없음</option>}{accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}</select>
                                  <select value={txForm.category} onChange={(e) => setTxForm({...txForm, category: e.target.value})} className="px-3 py-2 border border-gray-300 rounded-md text-xs font-medium focus:ring-2 focus:ring-indigo-500 outline-none bg-white">{(txForm.type === 'IN' ? inCategories : outCategories).map(cat => (<option key={cat} value={cat}>{cat}</option>))}</select>
                                </div>
                                <div className="relative">
                                  <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none"><Icon name="building-2" className="h-4 w-4 text-gray-400" /></div>
                                  <select required value={txForm.client} onChange={(e) => setTxForm({...txForm, client: e.target.value})} className="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none appearance-none bg-white"><option value="" disabled>거래처 선택 (설정에서 관리)</option>{clients.map(c => <option key={c} value={c}>{c}</option>)}</select>
                                </div>
                                <div className="relative">
                                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><span className="text-gray-400 sm:text-sm font-bold">₩</span></div>
                                  <input type="text" placeholder="금액 입력" required value={txForm.amount} onChange={(e) => { const val = e.target.value.replace(/[^0-9]/g, ''); setTxForm({...txForm, amount: val ? new Intl.NumberFormat('ko-KR').format(val) : ''}); }} className="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md text-base font-bold focus:ring-2 focus:ring-indigo-500 outline-none text-right" />
                                </div>
                                <div className="relative">
                                   <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none"><Icon name="file-text" className="h-4 w-4 text-gray-400" /></div>
                                  <input type="text" placeholder="적요 / 메모 (선택)" value={txForm.note} onChange={(e) => setTxForm({...txForm, note: e.target.value})} className="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
                                </div>
                                
                                <div className="bg-gray-50 border border-gray-200 rounded-md p-2">
                                    <label className="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer mb-2">
                                        <input type="checkbox" checked={txForm.isRecurring} onChange={e => setTxForm({...txForm, isRecurring: e.target.checked})} className="rounded text-indigo-600 focus:ring-indigo-500" />
                                        정기 반복 등록
                                    </label>
                                    {txForm.isRecurring && (
                                        <div className="flex gap-2 items-center mt-2">
                                            <select value={txForm.recurType} onChange={e => setTxForm({...txForm, recurType: e.target.value})} className="flex-1 px-2 py-1 border border-gray-300 rounded text-xs outline-none">
                                                <option value="week">매주 동일 요일</option>
                                                <option value="month">매월 동일 일자</option>
                                                <option value="year">매년 동일 일자</option>
                                            </select>
                                            <span className="text-xs text-gray-500">종료일:</span>
                                            <input type="date" value={txForm.recurUntil} onChange={e => setTxForm({...txForm, recurUntil: e.target.value})} className="flex-1 px-2 py-1 border border-gray-300 rounded text-xs outline-none" />
                                        </div>
                                    )}
                                </div>

                                <button type="submit" className={`w-full py-2.5 rounded-lg text-white font-bold text-sm shadow-sm transition-colors mt-1 ${txForm.type === 'IN' ? 'bg-blue-600 hover:bg-blue-700' : 'bg-red-600 hover:bg-red-700'}`}>내역 저장</button>
                              </form>
                            </div>
                          )}

                          <div className="flex-1 overflow-y-auto p-5 bg-gray-50/50">
                            {selectedDayTx.length === 0 ? (
                              <div className="text-center py-12 text-gray-400 flex flex-col items-center">
                                <Icon name="file-text" className="w-12 h-12 mb-3 opacity-20" />
                                <p className="text-sm font-medium">거래 내역이 없습니다.</p>
                              </div>
                            ) : (
                              <div className="flex flex-col gap-5">
                                {/* 수입 내역 그룹 */}
                                {selectedDayTx.filter(t => t.type === 'IN').length > 0 && (
                                    <div>
                                        <h4 className="text-xs font-bold text-blue-600 mb-2 border-b border-blue-200 pb-1">수입 내역</h4>
                                        <div className="flex flex-col gap-2">
                                            {selectedDayTx.filter(t => t.type === 'IN').map(tx => (
                                              <div key={tx.id} className="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm group hover:border-gray-300 transition-all relative overflow-hidden">
                                                <div className="absolute left-0 top-0 bottom-0 w-1 bg-blue-500"></div>
                                                <div className="pl-2">
                                                  <div className="flex justify-between items-start mb-1.5">
                                                    <div className="flex items-center gap-2 flex-wrap">
                                                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-50 text-blue-700 border border-blue-100">{tx.category}</span>
                                                      <span className="text-[10px] text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded border border-gray-200">{accounts.find(a => a.id === tx.accountId)?.name || '삭제된 계좌'}</span>
                                                    </div>
                                                    {role === 'ADMIN' && (<button onClick={() => handleDelete(tx.id, 'TX')} className="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity bg-red-50 p-1 rounded"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>)}
                                                  </div>
                                                  <div className="text-sm font-bold text-gray-800 mb-1 mt-2">{tx.client}</div>
                                                  <div className="flex justify-between items-end mt-2">
                                                    <span className="text-xs text-gray-500 truncate max-w-[150px]">{tx.note || ''}</span>
                                                    <span className="text-base font-extrabold tracking-tight text-blue-600">+{formatCurrency(tx.amount)}</span>
                                                  </div>
                                                </div>
                                              </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                
                                {/* 지출 내역 그룹 */}
                                {selectedDayTx.filter(t => t.type === 'OUT').length > 0 && (
                                    <div>
                                        <h4 className="text-xs font-bold text-red-600 mb-2 border-b border-red-200 pb-1">지출 내역</h4>
                                        <div className="flex flex-col gap-2">
                                            {selectedDayTx.filter(t => t.type === 'OUT').map(tx => (
                                              <div key={tx.id} className="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm group hover:border-gray-300 transition-all relative overflow-hidden">
                                                <div className="absolute left-0 top-0 bottom-0 w-1 bg-red-500"></div>
                                                <div className="pl-2">
                                                  <div className="flex justify-between items-start mb-1.5">
                                                    <div className="flex items-center gap-2 flex-wrap">
                                                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-red-50 text-red-700 border border-red-100">{tx.category}</span>
                                                      <span className="text-[10px] text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded border border-gray-200">{accounts.find(a => a.id === tx.accountId)?.name || '삭제된 계좌'}</span>
                                                    </div>
                                                    {role === 'ADMIN' && (<button onClick={() => handleDelete(tx.id, 'TX')} className="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity bg-red-50 p-1 rounded"><Icon name="trash-2" className="w-3.5 h-3.5" /></button>)}
                                                  </div>
                                                  <div className="text-sm font-bold text-gray-800 mb-1 mt-2">{tx.client}</div>
                                                  <div className="flex justify-between items-end mt-2">
                                                    <span className="text-xs text-gray-500 truncate max-w-[150px]">{tx.note || ''}</span>
                                                    <span className="text-base font-extrabold tracking-tight text-red-600">-{formatCurrency(tx.amount)}</span>
                                                  </div>
                                                </div>
                                              </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                              </div>
                            )}
                          </div>
                      </>
                      ) : (
                          <div className="flex-1 flex items-center justify-center bg-gray-50">
                              <div className="text-center text-gray-400">
                                  <Icon name="calendar-days" className="w-16 h-16 mx-auto mb-4 opacity-20" />
                                  <p>좌측 달력에서 날짜를 선택해주세요.</p>
                              </div>
                          </div>
                      )}
                    </section>
                  </>
                )}
              </main>
              <SettingsModal />
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CashFlowTracker />);
    </script>
</body>
</html>
