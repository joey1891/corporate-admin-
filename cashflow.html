<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 자금 수지 현황표 (Cloud DB)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', 'Pretendard', sans-serif; }
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans overflow-hidden">
    <div id="root" class="h-screen w-screen"></div>
    
    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          ChevronLeft, ChevronRight, Plus, Trash2, Calendar as CalendarIcon, 
          AlertCircle, Wallet, Building2, FileText, Settings, Users, Shield, 
          Landmark, LineChart, PiggyBank, Search, X, ChevronDown, ChevronUp, Cloud
        } from 'lucide-react';
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, addDoc, deleteDoc, onSnapshot, collection, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (Platform Injected)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cashflow-dev-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { projectId: "dummy" };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Helper paths for strict DB rules
        const getColRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
        const getDocRef = (colName, id) => doc(db, 'artifacts', appId, 'public', 'data', colName, id);

        // Utility: Calendar Events (Fixed, Holidays, Funding, Grants)
        const getEventsForDate = (year, month, day, fundingPlans = [], dayTxs = []) => {
          const events = [];
          const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          
          if (day === 25) events.push({ type: 'salary', name: '급여 및 4대보험', color: 'bg-emerald-100 text-emerald-700 border-emerald-200' });
          if (day === 10) events.push({ type: 'tax', name: '원천세 신고납부', color: 'bg-red-100 text-red-700 border-red-200' });
          if (month === 1 && day === 25) events.push({ type: 'tax', name: '부가세 2기 확정', color: 'bg-orange-100 text-orange-700 border-orange-200' });
          if (month === 4 && day === 25) events.push({ type: 'tax', name: '부가세 1기 예정', color: 'bg-orange-100 text-orange-700 border-orange-200' });
          if (month === 7 && day === 25) events.push({ type: 'tax', name: '부가세 1기 확정', color: 'bg-orange-100 text-orange-700 border-orange-200' });
          if (month === 10 && day === 25) events.push({ type: 'tax', name: '부가세 2기 예정', color: 'bg-orange-100 text-orange-700 border-orange-200' });
          if (month === 3 && day === 31) events.push({ type: 'tax', name: '법인세 결산납부', color: 'bg-purple-100 text-purple-700 border-purple-200' });
          if (month === 8 && day === 31) events.push({ type: 'tax', name: '법인세 중간예납', color: 'bg-purple-100 text-purple-700 border-purple-200' });

          const holidays = { "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일", "08-15": "광복절", "10-03": "개천절", "10-09": "한글날", "12-25": "성탄절" };
          const holidayName = holidays[`${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`];
          if (holidayName) events.push({ type: 'holiday', name: holidayName, color: 'bg-pink-100 text-pink-700 border-pink-200' });

          const plans = fundingPlans.filter(p => p.plannedDate === dateStr);
          plans.forEach(p => {
              events.push({ type: 'funding', name: `[조달] ${p.source}`, color: 'bg-indigo-100 text-indigo-700 border-indigo-200' });
          });
          
          dayTxs.forEach(tx => {
              if (tx.categoryName && (tx.categoryName.includes('지원금') || tx.categoryName.includes('대출'))) {
                  events.push({ type: 'grant', name: `[입금] ${tx.categoryName.split('/')[0]}`, color: 'bg-blue-100 text-blue-700 border-blue-200' });
              }
          });

          return events;
        };

        const formatCurrency = (amount) => new Intl.NumberFormat('ko-KR').format(amount) + '원';
        const getDaysInMonth = (year, month) => new Date(year, month, 0).getDate();

        function CashFlowTracker() {
          const currentYear = new Date().getFullYear();
          const todayStr = `${currentYear}-${String(new Date().getMonth() + 1).padStart(2, '0')}-${String(new Date().getDate()).padStart(2, '0')}`;

          // Auth & Load States
          const [user, setUser] = useState(null);
          const [isLoaded, setIsLoaded] = useState(false);

          // View States
          const [role, setRole] = useState('ADMIN'); 
          const [activeTab, setActiveTab] = useState('CALENDAR'); 
          const [activeMonth, setActiveMonth] = useState(new Date().getMonth() + 1);
          const [selectedDate, setSelectedDate] = useState(todayStr);
          const [selectedAccount, setSelectedAccount] = useState('ALL');
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);

          // DB States
          const [accounts, setAccounts] = useState([]);
          const [categories, setCategories] = useState([]);
          const [clients, setClients] = useState([]);
          const [transactions, setTransactions] = useState([]);
          const [fundingPlans, setFundingPlans] = useState([]);

          // Form States
          const [txForm, setTxForm] = useState({ type: 'IN', accountId: '', category: '', client: '', amount: '', note: '', isRecurring: false, frequency: 'MONTHLY', endDate: '' });
          const [fundingForm, setFundingForm] = useState({ date: '', source: '', fundingType: '', amount: '', status: '계획' });

          // Expand States for Yearly View
          const [expandedMonths, setExpandedMonths] = useState({});
          const [expandedYearlyDays, setExpandedYearlyDays] = useState({});

          const toggleMonth = (month) => setExpandedMonths(prev => ({ ...prev, [month]: !prev[month] }));
          const toggleYearlyDay = (dateStr) => setExpandedYearlyDays(prev => ({ ...prev, [dateStr]: !prev[dateStr] }));

          useEffect(() => {
            const initAuth = async () => {
              try {
                if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                else await signInAnonymously(auth);
              } catch (e) {
                console.error("Firebase Auth Error", e);
              }
            };
            initAuth();

            const unsubAuth = onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
            });
            return () => unsubAuth();
          }, []);

          useEffect(() => {
            if (!user) return;

            // Subscribe to all collections
            const unsubAcc = onSnapshot(query(getColRef('accounts')), (snap) => {
              setAccounts(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            }, console.error);

            const unsubCat = onSnapshot(query(getColRef('categories')), (snap) => {
              setCategories(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            }, console.error);

            const unsubCli = onSnapshot(query(getColRef('clients')), (snap) => {
              setClients(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            }, console.error);

            const unsubTx = onSnapshot(query(getColRef('transactions')), (snap) => {
              setTransactions(snap.docs.map(d => ({ id: d.id, ...d.data() })));
              setIsLoaded(true); // Consider data loaded when transactions are in
            }, console.error);

            const unsubFund = onSnapshot(query(getColRef('fundingPlans')), (snap) => {
              setFundingPlans(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            }, console.error);

            return () => { unsubAcc(); unsubCat(); unsubCli(); unsubTx(); unsubFund(); };
          }, [user]);

          const inCategories = useMemo(() => categories.filter(c => c.type === 'IN'), [categories]);
          const outCategories = useMemo(() => categories.filter(c => c.type === 'OUT'), [categories]);

          // Keep forms synced with available data if empty
          useEffect(() => {
            if (accounts.length > 0 && !txForm.accountId) setTxForm(prev => ({...prev, accountId: accounts[0].id}));
            if (inCategories.length > 0 && txForm.type === 'IN' && !txForm.category) setTxForm(prev => ({...prev, category: inCategories[0].name}));
            if (outCategories.length > 0 && txForm.type === 'OUT' && !txForm.category) setTxForm(prev => ({...prev, category: outCategories[0].name}));
          }, [accounts, inCategories, outCategories, txForm.type]);

          const filteredTransactions = useMemo(() => {
            if (selectedAccount === 'ALL') return transactions;
            return transactions.filter(t => t.accountId === selectedAccount);
          }, [transactions, selectedAccount]);

          const txByDate = useMemo(() => {
            const map = {};
            filteredTransactions.forEach(t => {
              if (!map[t.transactionDate]) map[t.transactionDate] = { in: 0, out: 0, list: [] };
              if (t.type === 'IN') map[t.transactionDate].in += t.amount;
              else map[t.transactionDate].out += t.amount;
              map[t.transactionDate].list.push(t);
            });
            return map;
          }, [filteredTransactions]);

          const dailyBalances = useMemo(() => {
            const activeAccounts = selectedAccount === 'ALL' ? accounts : accounts.filter(a => a.id === selectedAccount);
            
            // 1월 1일 이전의 기초자금을 미리 합산
            let currentBalance = activeAccounts
              .filter(a => !a.initialDate || a.initialDate < `${currentYear}-01-01`)
              .reduce((acc, curr) => acc + (curr.initialCapital || 0), 0);

            const balances = {};
            for (let m = 1; m <= 12; m++) {
              let days = getDaysInMonth(currentYear, m);
              for (let d = 1; d <= days; d++) {
                const dateStr = `${currentYear}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                
                // 해당 일자에 시작되는 신규 통장 자금이 있는지 확인
                const dayInitialCapitals = activeAccounts
                  .filter(a => a.initialDate === dateStr)
                  .reduce((acc, curr) => acc + (curr.initialCapital || 0), 0);

                const dayData = txByDate[dateStr] || { in: 0, out: 0 };
                const start = currentBalance + dayInitialCapitals;
                const net = dayData.in - dayData.out;
                currentBalance = start + net;
                const end = currentBalance;
                
                balances[dateStr] = { start, in: dayData.in, out: dayData.out, net, end, dayInitialCapitals };
              }
            }
            return balances;
          }, [accounts, selectedAccount, txByDate, currentYear]);

          const handleAddTransaction = async (e) => {
            e.preventDefault();
            if (role !== 'ADMIN' || !txForm.client || !txForm.amount || !user) return;
            try {
              const amountNum = Number(txForm.amount.replace(/[^0-9]/g, ''));
              const baseTx = {
                type: txForm.type,
                accountId: txForm.accountId,
                categoryName: txForm.category,
                clientName: txForm.client,
                amount: amountNum,
                note: txForm.note,
                createdAt: new Date().toISOString()
              };

              if (txForm.isRecurring && txForm.endDate) {
                  let currentDate = new Date(selectedDate);
                  const end = new Date(txForm.endDate);
                  const promises = [];

                  while (currentDate <= end) {
                      const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}-${String(currentDate.getDate()).padStart(2,'0')}`;
                      promises.push(addDoc(getColRef('transactions'), { ...baseTx, transactionDate: dateStr, note: txForm.note ? `${txForm.note} (정기)` : '(정기)' }));
                      
                      if (txForm.frequency === 'WEEKLY') {
                          currentDate.setDate(currentDate.getDate() + 7);
                      } else if (txForm.frequency === 'MONTHLY') {
                          currentDate.setMonth(currentDate.getMonth() + 1);
                      } else if (txForm.frequency === 'YEARLY') {
                          currentDate.setFullYear(currentDate.getFullYear() + 1);
                      }
                  }
                  await Promise.all(promises);
              } else {
                  await addDoc(getColRef('transactions'), { ...baseTx, transactionDate: selectedDate });
              }

              setTxForm({ ...txForm, client: '', amount: '', note: '', isRecurring: false, endDate: '' });
            } catch (err) { console.error("Error adding transaction", err); }
          };

          const handleAddFunding = async (e) => {
            e.preventDefault();
            if (role !== 'ADMIN' || !user) return;
            try {
              await addDoc(getColRef('fundingPlans'), {
                plannedDate: fundingForm.date,
                source: fundingForm.source,
                fundingType: fundingForm.fundingType,
                amount: Number(fundingForm.amount.replace(/[^0-9]/g, '')),
                status: '계획',
                createdAt: new Date().toISOString()
              });
              setFundingForm({ date: '', source: '', fundingType: '', amount: '', status: '계획' });
            } catch (err) { console.error("Error adding funding plan", err); }
          };

          const handleDelete = async (id, type) => {
            if (role !== 'ADMIN' || !user) return;
            try {
              if (type === 'TX') await deleteDoc(getDocRef('transactions', id));
              if (type === 'FUNDING') await deleteDoc(getDocRef('fundingPlans', id));
            } catch (err) { console.error("Error deleting", err); }
          };

          const handleInitializeDefaults = async () => {
             if(role !== 'ADMIN' || !user) return;
             setIsLoaded(false); // Show loading state briefly
             
             // Setup initial accounts
             const accs = [
               { name: '국민은행 (주거래)', initialCapital: 30000000, initialDate: `${currentYear}-01-01` },
               { name: '기업은행 (세금/보조)', initialCapital: 15000000, initialDate: `${currentYear}-01-01` },
             ];
             for(let a of accs) await addDoc(getColRef('accounts'), {...a, createdAt: new Date().toISOString()});
             
             // Setup Categories
             const inCats = ['스마트스토어 정산', '자사몰/간편결제', '정부지원금/대출'];
             const outCats = ['원부자재 매입', '인건비/퇴직금', '원천세 납부', '부가세 납부'];
             for(let c of inCats) await addDoc(getColRef('categories'), { name: c, type: 'IN', createdAt: new Date().toISOString() });
             for(let c of outCats) await addDoc(getColRef('categories'), { name: c, type: 'OUT', createdAt: new Date().toISOString() });
             
             // Setup Clients
             const cls = ['네이버파이낸셜', '국세청', '(주)도매상사', '소상공인공단'];
             for(let c of cls) await addDoc(getColRef('clients'), { name: c, createdAt: new Date().toISOString() });
             
             setIsLoaded(true);
          };

          const renderCalendar = () => {
            const daysInMonth = getDaysInMonth(currentYear, activeMonth);
            const firstDay = new Date(currentYear, activeMonth - 1, 1).getDay();
            const days = [];

            for (let i = 0; i < firstDay; i++) {
              days.push(<div key={`empty-${i}`} className="h-28 bg-gray-50/50 border-r border-b border-gray-200"></div>);
            }

            for (let d = 1; d <= daysInMonth; d++) {
              const dateStr = `${currentYear}-${String(activeMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
              const isSelected = selectedDate === dateStr;
              const data = dailyBalances[dateStr];
              const events = getEventsForDate(currentYear, activeMonth, d, fundingPlans, txByDate[dateStr]?.list || []);
              const isToday = dateStr === todayStr;
              const dayOfWeek = new Date(dateStr).getDay();
              const isHoliday = events.some(e => e.type === 'holiday');
              
              let dateColor = 'text-gray-700';
              if (dayOfWeek === 0 || isHoliday) dateColor = 'text-red-500';
              else if (dayOfWeek === 6) dateColor = 'text-blue-500';

              days.push(
                <div 
                  key={dateStr}
                  onClick={() => setSelectedDate(dateStr)}
                  className={`h-28 border-r border-b border-gray-200 p-1.5 cursor-pointer transition-all flex flex-col hover:bg-indigo-50/50
                    ${isSelected ? 'bg-indigo-50 ring-2 ring-indigo-500 ring-inset z-10' : 'bg-white'}
                  `}
                >
                  <div className="flex justify-between items-start mb-1">
                    <span className={`text-sm font-bold w-6 h-6 flex items-center justify-center rounded-full
                      ${isToday ? 'bg-indigo-600 text-white' : dateColor}`}>
                      {d}
                    </span>
                    {events.length > 0 && (
                      <div className="flex flex-col gap-0.5 items-end">
                        {events.map((ev, idx) => (
                           <span key={idx} className={`text-[9px] px-1 py-0.5 rounded border leading-tight truncate max-w-[60px] ${ev.color}`}>
                             {ev.name.split(' ')[0]}
                           </span>
                        ))}
                      </div>
                    )}
                  </div>
                  
                  <div className="flex-1 text-[11px] font-medium flex flex-col justify-center gap-0.5">
                    {data.in > 0 && <div className="text-blue-600 flex justify-between"><span>수입</span><span>+{formatCurrency(data.in).replace('원','')}</span></div>}
                    {data.out > 0 && <div className="text-red-600 flex justify-between"><span>지출</span><span>-{formatCurrency(data.out).replace('원','')}</span></div>}
                  </div>

                  <div className="mt-auto pt-1 border-t border-gray-100 flex justify-between text-[10px]">
                     <span className="text-gray-400">잔액</span>
                     <span className="text-gray-800 font-semibold truncate ml-1">{formatCurrency(data.end).replace('원','')}</span>
                  </div>
                </div>
              );
            }
            return days;
          };

          const renderYearlyView = () => (
            <div className="p-6 bg-gray-50 flex-1 overflow-y-auto">
              <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                <Cloud className="w-5 h-5 text-indigo-500" />
                {currentYear}년 전체 자금 흐름 요약
              </h2>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 items-start">
                {Array.from({ length: 12 }, (_, i) => i + 1).map(month => {
                  const firstDay = `${currentYear}-${String(month).padStart(2, '0')}-01`;
                  const lastDayStr = `${currentYear}-${String(month).padStart(2, '0')}-${String(getDaysInMonth(currentYear, month)).padStart(2, '0')}`;
                  
                  let monthIn = 0;
                  let monthOut = 0;
                  const days = Object.keys(dailyBalances).filter(k => k.startsWith(`${currentYear}-${String(month).padStart(2,'0')}`)).sort();
                  days.forEach(d => {
                    monthIn += dailyBalances[d].in;
                    monthOut += dailyBalances[d].out;
                  });
                  
                  const startBal = dailyBalances[firstDay]?.start || 0;
                  const endBal = dailyBalances[lastDayStr]?.end || 0;
                  const isExpanded = expandedMonths[month];

                  return (
                    <div key={month} className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm transition-shadow">
                      <div className="flex justify-between items-center border-b pb-2 mb-3">
                        <h3 className="text-lg font-bold text-indigo-900">{month}월</h3>
                        <button 
                          onClick={() => toggleMonth(month)} 
                          className="flex items-center gap-1 text-xs font-semibold text-gray-500 hover:text-indigo-600 bg-gray-50 px-2 py-1 rounded transition-colors"
                        >
                          {isExpanded ? <><ChevronUp className="w-3.5 h-3.5"/> 접기</> : <><ChevronDown className="w-3.5 h-3.5"/> 펼치기</>}
                        </button>
                      </div>
                      <div className="space-y-2 text-sm">
                        <div className="flex justify-between text-gray-500">
                          <span>월초 자금</span><span className="font-medium text-gray-800">{formatCurrency(startBal)}</span>
                        </div>
                        <div className="flex justify-between text-blue-600">
                          <span>월 총수입</span><span className="font-semibold">+{formatCurrency(monthIn)}</span>
                        </div>
                        <div className="flex justify-between text-red-600">
                          <span>월 총지출</span><span className="font-semibold">-{formatCurrency(monthOut)}</span>
                        </div>
                        <div className="pt-2 border-t mt-2 flex justify-between items-center">
                          <span className="font-medium text-gray-600">월말 자금</span>
                          <span className="text-base font-bold text-indigo-700">{formatCurrency(endBal)}</span>
                        </div>
                      </div>
                      
                      {isExpanded && (
                        <div className="mt-4 pt-3 border-t border-gray-100">
                          <table className="w-full text-left text-[11px] border-collapse">
                            <thead className="bg-gray-50">
                              <tr className="text-gray-500">
                                <th className="py-1.5 px-1 font-medium rounded-l">일자</th>
                                <th className="py-1.5 px-1 font-medium text-right">수입</th>
                                <th className="py-1.5 px-1 font-medium text-right">지출</th>
                                <th className="py-1.5 px-1 font-medium text-right rounded-r">잔액</th>
                              </tr>
                            </thead>
                            <tbody>
                              {days.map(dStr => {
                                const dData = dailyBalances[dStr];
                                const dayNum = parseInt(dStr.split('-')[2], 10);
                                const hasTransactions = dData.in > 0 || dData.out > 0;
                                const isDayExpanded = expandedYearlyDays[dStr];
                                const dayTxs = txByDate[dStr]?.list || [];
                                
                                const dayOfWeek = new Date(dStr).getDay();
                                const evs = getEventsForDate(currentYear, month, dayNum, fundingPlans, dayTxs);
                                const isHoliday = evs.some(e => e.type === 'holiday');
                                let dateColor = 'text-gray-700';
                                if (dayOfWeek === 0 || isHoliday) dateColor = 'text-red-500';
                                else if (dayOfWeek === 6) dateColor = 'text-blue-500';

                                return (
                                  <React.Fragment key={dStr}>
                                    <tr 
                                      onClick={() => { if(hasTransactions) toggleYearlyDay(dStr) }}
                                      className={`border-b border-gray-50 transition-colors
                                        ${hasTransactions ? 'cursor-pointer hover:bg-indigo-50/50' : 'opacity-70'}
                                        ${isDayExpanded ? 'bg-indigo-50/50' : ''}
                                      `}
                                    >
                                      <td className={`py-1.5 px-1 font-medium ${dateColor}`}>
                                        <div className="flex items-center gap-0.5">
                                          {dayNum}일
                                          {hasTransactions && (

                        <div className="flex items-center gap-4">
                          <button onClick={() => setActiveMonth(prev => Math.max(1, prev - 1))} className="p-1.5 hover:bg-white hover:shadow-sm rounded-full border border-transparent hover:border-gray-200" disabled={activeMonth === 1}>
                            <ChevronLeft className="w-5 h-5 text-gray-600" />
                          </button>
                          <h2 className="text-2xl font-black text-gray-800 w-32 text-center tracking-tight">
                            {activeMonth}월
                          </h2>
                          <button onClick={() => setActiveMonth(prev => Math.min(12, prev + 1))} className="p-1.5 hover:bg-white hover:shadow-sm rounded-full border border-transparent hover:border-gray-200" disabled={activeMonth === 12}>
                            <ChevronRight className="w-5 h-5 text-gray-600" />
                          </button>
                        </div>
                        
                        <div className="flex gap-6 text-sm font-medium">
                          <div className="flex flex-col items-end">
                            <span className="text-gray-500 text-[11px] uppercase tracking-wider">월 총 수입</span>
                            <span className="text-blue-600 text-lg">{formatCurrency(Object.keys(dailyBalances).filter(k => k.startsWith(`${currentYear}-${String(activeMonth).padStart(2,'0')}`)).reduce((acc, k) => acc + dailyBalances[k].in, 0))}</span>
                          </div>
                          <div className="flex flex-col items-end">
                            <span className="text-gray-500 text-[11px] uppercase tracking-wider">월 총 지출</span>
                            <span className="text-red-600 text-lg">{formatCurrency(Object.keys(dailyBalances).filter(k => k.startsWith(`${currentYear}-${String(activeMonth).padStart(2,'0')}`)).reduce((acc, k) => acc + dailyBalances[k].out, 0))}</span>
                          </div>
                        </div>
                      </div>

                      <div className="flex-1 overflow-y-auto p-4 bg-gray-100">
                        <div className="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm">
                          <div className="grid grid-cols-7 bg-gray-50 border-b border-gray-200">
                            {['일', '월', '화', '수', '목', '금', '토'].map((day, i) => (
                              <div key={day} className={`py-2.5 text-center text-xs font-bold 
                                ${i === 0 ? 'text-red-500' : i === 6 ? 'text-blue-500' : 'text-gray-600'}`}>
                                {day}
                              </div>
                            ))}
                          </div>
                          <div className="grid grid-cols-7">
                            {renderCalendar()}
                          </div>
                        </div>
                      </div>
                    </section>

                    <section className="w-[420px] xl:w-[480px] bg-white border-l border-gray-200 flex flex-col shrink-0 z-10 shadow-[-10px_0_20px_rgba(0,0,0,0.03)] relative">
                      {role === 'MEMBER' && (
                        <div className="absolute top-0 right-0 m-4 bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded font-semibold flex items-center gap-1 border border-gray-200 z-20">
                          <Search className="w-3 h-3"/> 열람 모드
                        </div>
                      )}

                      <div className="px-6 py-5 border-b border-gray-200 bg-gray-50">
                        <div className="flex items-center gap-2 mb-4">
                          <div className="bg-indigo-100 p-1.5 rounded-lg">
                            <CalendarIcon className="w-5 h-5 text-indigo-700" />
                          </div>
                          <h3 className="text-lg font-extrabold text-gray-900 tracking-tight">
                            {selectedDate.split('-')[1]}월 {selectedDate.split('-')[2]}일 <span className="font-medium text-gray-500 text-base">상세현황</span>
                          </h3>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3 mb-3">
                          <div className="bg-white p-3 rounded-xl border border-gray-200 shadow-sm">
                            <p className="text-[11px] text-gray-500 mb-1 font-bold">기초 자금 (전일 이월)</p>
                            <p className="text-sm font-bold text-gray-800">{formatCurrency(selectedDayData.start)}</p>
                            {selectedDayData.dayInitialCapitals > 0 && <p className="text-[10px] text-blue-500 mt-0.5">신규 계좌 등록 +{formatCurrency(selectedDayData.dayInitialCapitals)}</p>}
                          </div>
                          <div className="bg-white p-3 rounded-xl border border-indigo-100 shadow-sm bg-indigo-50/50">
                            <p className="text-[11px] text-indigo-600 mb-1 font-bold">기말 자금 (당일 최종)</p>
                            <p className="text-base font-bold text-indigo-700">{formatCurrency(selectedDayData.end)}</p>
                          </div>
                        </div>
                        
                        <div className="flex bg-white rounded-xl border border-gray-200 shadow-sm divide-x divide-gray-100">
                           <div className="flex-1 p-3">
                              <p className="text-[10px] text-gray-500 font-bold mb-0.5">당일 수입</p>
                              <p className="text-sm font-bold text-blue-600">+{formatCurrency(selectedDayData.in)}</p>
                           </div>
                           <div className="flex-1 p-3">
                              <p className="text-[10px] text-gray-500 font-bold mb-0.5">당일 지출</p>
                              <p className="text-sm font-bold text-red-600">-{formatCurrency(selectedDayData.out)}</p>
                           </div>
                           <div className="flex-1 p-3 bg-gray-50/50 rounded-r-xl">
                              <p className="text-[10px] text-gray-500 font-bold mb-0.5">일일 소계</p>
                              <p className={`text-sm font-bold ${selectedDayData.net >= 0 ? 'text-gray-800' : 'text-red-600'}`}>
                                {selectedDayData.net >= 0 ? '+' : ''}{formatCurrency(selectedDayData.net)}
                              </p>
                           </div>
                        </div>

                        {selectedEvents.length > 0 && (
                          <div className="mt-3 flex flex-col gap-2">
                            {selectedEvents.map((ev, idx) => (
                              <div key={idx} className={`flex items-center gap-2 p-2.5 rounded-lg border text-xs font-bold ${ev.color} bg-opacity-50`}>
                                <AlertCircle className="w-4 h-4 shrink-0" />
                                {ev.name} 일정이 있습니다. 자금을 확인하세요.
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {role === 'ADMIN' && (
                        <div className="p-5 border-b border-gray-200 bg-white">
                          <form onSubmit={handleAddTransaction} className="flex flex-col gap-3">
                            <div className="flex bg-gray-100 p-1 rounded-lg">
                              <button type="button" onClick={() => setTxForm({...txForm, type: 'IN', category: inCategories[0]?.name})} className={`flex-1 py-1.5 text-xs font-bold rounded-md transition-all ${txForm.type === 'IN' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>수입 등록</button>
                              <button type="button" onClick={() => setTxForm({...txForm, type: 'OUT', category: outCategories[0]?.name})} className={`flex-1 py-1.5 text-xs font-bold rounded-md transition-all ${txForm.type === 'OUT' ? 'bg-white text-red-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>지출 등록</button>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                              <select value={txForm.accountId} onChange={(e) => setTxForm({...txForm, accountId: e.target.value})} className="px-3 py-2 border border-gray-300 rounded-md text-xs font-medium focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                                {accounts.length === 0 && <option value="">계좌 추가 필요</option>}
                                {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                              </select>
                              
                              <select value={txForm.category} onChange={(e) => setTxForm({...txForm, category: e.target.value})} className="px-3 py-2 border border-gray-300 rounded-md text-xs font-medium focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                                {(txForm.type === 'IN' ? inCategories : outCategories).map(cat => (
                                  <option key={cat.id} value={cat.name}>{cat.name}</option>
                                ))}
                              </select>
                            </div>

                            <div className="relative">
                              <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none"><Building2 className="h-4 w-4 text-gray-400" /></div>
                              <select required value={txForm.client} onChange={(e) => setTxForm({...txForm, client: e.target.value})} className="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none appearance-none bg-white">
                                <option value="" disabled>거래처 선택 (설정에서 관리)</option>
                                {clients.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                              </select>
                            </div>

                            <div className="relative">
                              <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><span className="text-gray-400 sm:text-sm font-bold">₩</span></div>
                              <input type="text" placeholder="금액 입력" required value={txForm.amount} 
                                onChange={(e) => {
                                  const val = e.target.value.replace(/[^0-9]/g, '');
                                  setTxForm({...txForm, amount: val ? new Intl.NumberFormat('ko-KR').format(val) : ''});
                                }}
                                className="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md text-base font-bold focus:ring-2 focus:ring-indigo-500 outline-none text-right"
                              />
                            </div>

                            <div className="relative">
                               <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none"><FileText className="h-4 w-4 text-gray-400" /></div>
                              <input type="text" placeholder="적요 / 메모 (선택)" value={txForm.note} onChange={(e) => setTxForm({...txForm, note: e.target.value})} className="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
                            </div>

                            <div className="flex flex-col gap-2 bg-gray-50 p-2.5 rounded-lg border border-gray-200">
                               <label className="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer">
                                  <input type="checkbox" checked={txForm.isRecurring} onChange={(e) => setTxForm({...txForm, isRecurring: e.target.checked})} className="rounded text-indigo-600 focus:ring-indigo-500 w-3.5 h-3.5"/>
                                  정기 반복 등록 (매주/매월/매년)
                               </label>
                               {txForm.isRecurring && (
                                  <div className="flex gap-2 mt-1">
                                     <select value={txForm.frequency} onChange={(e) => setTxForm({...txForm, frequency: e.target.value})} className="flex-1 px-2 py-1.5 border border-gray-300 rounded-md text-xs outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                                        <option value="MONTHLY">매월</option>
                                        <option value="WEEKLY">매주</option>
                                        <option value="YEARLY">매년</option>
                                     </select>
                                     <div className="flex items-center gap-1.5 flex-[1.5]">
                                        <span className="text-[10px] text-gray-500">종료일</span>
                                        <input type="date" required={txForm.isRecurring} value={txForm.endDate} min={selectedDate} onChange={(e) => setTxForm({...txForm, endDate: e.target.value})} className="w-full px-2 py-1.5 border border-gray-300 rounded-md text-xs outline-none focus:ring-2 focus:ring-indigo-500 bg-white" />
                                     </div>
                                  </div>
                               )}
                            </div>

                            <button type="submit" className={`w-full py-2.5 rounded-lg text-white font-bold text-sm shadow-sm transition-colors mt-1
                                ${txForm.type === 'IN' ? 'bg-blue-600 hover:bg-blue-700' : 'bg-red-600 hover:bg-red-700'}
                              `}>
                              DB에 내역 저장
                            </button>
                          </form>
                        </div>
                      )}

                      <div className="flex-1 overflow-y-auto p-5 bg-gray-50/50">
                        <h4 className="text-xs font-extrabold text-gray-500 mb-3 flex items-center gap-2 uppercase tracking-wide">
                          거래 내역 <span className="bg-gray-200 text-gray-600 py-0.5 px-2 rounded-full text-[10px]">{selectedDayTx.length}건</span>
                        </h4>
                        
                        {selectedDayTx.length === 0 ? (
                          <div className="text-center py-12 text-gray-400 flex flex-col items-center">
                            <FileText className="w-12 h-12 mb-3 opacity-20" />
                            <p className="text-sm font-medium">거래 내역이 없습니다.</p>
                          </div>
                        ) : (
                          <div className="flex flex-col gap-4">
                            {(() => {
                              const inTxs = selectedDayTx.filter(t => t.type === 'IN');
                              const outTxs = selectedDayTx.filter(t => t.type === 'OUT');
                              return (
                                <>
                                  {inTxs.length > 0 && (
                                    <div className="flex flex-col gap-2">
                                      <h5 className="text-xs font-bold text-blue-600 border-b border-blue-100 pb-1 mb-1">수입 내역 ({inTxs.length}건)</h5>
                                      {inTxs.map(tx => (
                                        <div key={tx.id} className="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm group hover:border-blue-300 hover:shadow-md transition-all relative overflow-hidden">
                                          <div className="absolute left-0 top-0 bottom-0 w-1 bg-blue-500"></div>
                                          <div className="pl-2">
                                            <div className="flex justify-between items-start mb-1.5">
                                              <div className="flex items-center gap-2 flex-wrap">
                                                <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-50 text-blue-700 border border-blue-100">
                                                  {tx.categoryName}
                                                </span>
                                                <span className="text-[10px] text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded border border-gray-200">
                                                  {accounts.find(a => a.id === tx.accountId)?.name || '삭제된 계좌'}
                                                </span>
                                              </div>
                                              {role === 'ADMIN' && (
                                                <button onClick={() => handleDelete(tx.id, 'TX')} className="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity bg-red-50 p-1 rounded">
                                                  <Trash2 className="w-3.5 h-3.5" />
                                                </button>
                                              )}
                                            </div>
                                            <div className="text-sm font-bold text-gray-800 mb-1 mt-2">{tx.clientName}</div>
                                            <div className="flex justify-between items-end mt-2">
                                              <span className="text-xs text-gray-500 truncate max-w-[150px]">{tx.note || ''}</span>
                                              <span className="text-base font-extrabold tracking-tight text-blue-600">
                                                +{formatCurrency(tx.amount)}
                                              </span>
                                            </div>
                                          </div>
                                        </div>
                                      ))}
                                    </div>
                                  )}

                                  {outTxs.length > 0 && (
                                    <div className="flex flex-col gap-2">
                                      <h5 className="text-xs font-bold text-red-600 border-b border-red-100 pb-1 mb-1 mt-2">지출 내역 ({outTxs.length}건)</h5>
                                      {outTxs.map(tx => (
                                        <div key={tx.id} className="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm group hover:border-red-300 hover:shadow-md transition-all relative overflow-hidden">
                                          <div className="absolute left-0 top-0 bottom-0 w-1 bg-red-500"></div>
                                          <div className="pl-2">
                                            <div className="flex justify-between items-start mb-1.5">
                                              <div className="flex items-center gap-2 flex-wrap">
                                                <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-red-50 text-red-700 border border-red-100">
                                                  {tx.categoryName}
                                                </span>
                                                <span className="text-[10px] text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded border border-gray-200">
                                                  {accounts.find(a => a.id === tx.accountId)?.name || '삭제된 계좌'}
                                                </span>
                                              </div>
                                              {role === 'ADMIN' && (
                                                <button onClick={() => handleDelete(tx.id, 'TX')} className="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity bg-red-50 p-1 rounded">
                                                  <Trash2 className="w-3.5 h-3.5" />
                                                </button>
                                              )}
                                            </div>
                                            <div className="text-sm font-bold text-gray-800 mb-1 mt-2">{tx.clientName}</div>
                                            <div className="flex justify-between items-end mt-2">
                                              <span className="text-xs text-gray-500 truncate max-w-[150px]">{tx.note || ''}</span>
                                              <span className="text-base font-extrabold tracking-tight text-red-600">
                                                -{formatCurrency(tx.amount)}
                                              </span>
                                            </div>
                                          </div>
                                        </div>
                                      ))}
                                    </div>
                                  )}
                                </>
                              );
                            })()}
                          </div>
                        )}
                      </div>
                    </section>
                  </>
                )}
              </main>
              
              <SettingsModal />
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<CashFlowTracker />);
    </script>
</body>
</html>
