    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const supabaseUrl = 'https://zpzaiuqcoltshtsrllxx.supabase.co';
                const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwemFpdXFjb2x0c2h0c3JsbHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNjA4MTcsImV4cCI6MjEwMTczNjgxN30.zWiMJ0RDpSZlWaSBKcO1X3HvF-NBLw2YTqH6sjfRbME';
                const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

                const authState = ref('loading');
                const authForm = ref({ email: '', password: '', name: '' });
                const userProfile = ref(null);
                const isAuthLoading = ref(false);
                
                const rememberEmail = ref(false);
                const keepLoggedIn = ref(true);

                const companies = ref([]);
                const currentCompanyId = ref('');
                
                const isAdminMode = ref(false);
                const isSidebarOpen = ref(false);
                const viewMode = ref('list');
                const menuGroups = ref([]);
                const activeCategoryId = ref('');
                
                const toast = ref({ show: false, message: '', subMessage: '', type: 'success' });
                const showToast = (msg, type = 'success', sub = '') => {
                    toast.value = { show: true, message: msg, subMessage: sub, type };
                    setTimeout(() => { toast.value.show = false; }, 4000);
                };

                const checkSession = async () => {
                    const { data: { session } } = await supabase.auth.getSession();
                    const savedEmail = localStorage.getItem('savedEmail');
                    if (savedEmail) { authForm.value.email = savedEmail; rememberEmail.value = true; }

                    const isKeepLoggedIn = localStorage.getItem('keepLoggedIn') !== 'false';
                    const hasTempSession = sessionStorage.getItem('tempSession') === 'true';

                    if (session) {
                        if (!isKeepLoggedIn && !hasTempSession) {
                            await supabase.auth.signOut();
                            authState.value = 'login';
                        } else {
                            sessionStorage.setItem('tempSession', 'true');
                            await fetchUserProfile(session.user.id);
                        }
                    } else {
                        authState.value = 'login';
                    }
                };

                const fetchUserProfile = async (userId) => {
                    try {
                        const { data, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
                        if (error) throw error;
                        userProfile.value = data;
                        if (data.status === 'pending') { authState.value = 'pending'; } 
                        else if (data.status === 'approved') { authState.value = 'authenticated'; await loadCompanies(); }
                    } catch (e) {
                        userProfile.value = { id: userId, full_name: '관리자', role: 'admin', status: 'approved' };
                        authState.value = 'authenticated'; await loadCompanies();
                    }
                };

                const handleLogin = async () => {
                    isAuthLoading.value = true;
                    try {
                        const { data, error } = await supabase.auth.signInWithPassword({ email: authForm.value.email, password: authForm.value.password });
                        if (error) throw error;
                        if (rememberEmail.value) localStorage.setItem('savedEmail', authForm.value.email);
                        else localStorage.removeItem('savedEmail');
                        localStorage.setItem('keepLoggedIn', keepLoggedIn.value);
                        sessionStorage.setItem('tempSession', 'true');
                        await fetchUserProfile(data.user.id);
                    } catch(e) { showToast('로그인 실패', 'error', e.message); }
                    finally { isAuthLoading.value = false; }
                };

                const handleRegister = async () => {
                    isAuthLoading.value = true;
                    try {
                        const { data, error } = await supabase.auth.signUp({ email: authForm.value.email, password: authForm.value.password });
                        if (error) throw error;
                        if (data.user) {
                            await supabase.from('profiles').upsert({ id: data.user.id, email: authForm.value.email, full_name: authForm.value.name, role: 'user', status: 'pending' });
                            authState.value = 'pending';
                        }
                    } catch(e) { showToast('회원가입 실패', 'error', e.message); }
                    finally { isAuthLoading.value = false; }
                };

                const loadCompanies = async () => {
                    const { data } = await supabase.from('companies').select('*').order('created_at');
                    companies.value = data || [];
                    if (companies.value.length > 0) {
                        if (userProfile.value.role !== 'admin' && userProfile.value.company_id) currentCompanyId.value = userProfile.value.company_id;
                        else if (!currentCompanyId.value) currentCompanyId.value = companies.value[0].id;
                        await loadData();
                    }
                };
                const currentCompanyName = computed(() => { const c = companies.value.find(x => x.id === currentCompanyId.value); return c ? c.name : ''; });

                const showCompanyModal = ref(false);
                const newCompanyName = ref('');
                const isCloning = ref(false);
                const openAddCompanyModal = () => { newCompanyName.value = ''; showCompanyModal.value = true; };
                const executeAddCompany = async () => {
                    if(!newCompanyName.value) return;
                    isCloning.value = true;
                    try {
                        const { data: newComp, error } = await supabase.from('companies').insert({name: newCompanyName.value}).select().single();
                        if (error) throw error;
                        const templateId = companies.value[0].id; 
                        const { data: oldCats } = await supabase.from('categories').select('*').eq('company_id', templateId);
                        const { data: oldItems } = await supabase.from('items').select('*');
                        let idMap = {};
                        const sectors = oldCats.filter(c => !c.parent_id);
                        for (let sec of sectors) {
                            const { data: nSec } = await supabase.from('categories').insert({name: sec.name, icon: sec.icon, sort_order: sec.sort_order, company_id: newComp.id}).select().single();
                            idMap[sec.id] = nSec.id;
                            const subs = oldCats.filter(c => c.parent_id === sec.id);
                            for (let sub of subs) {
                                const { data: nSub } = await supabase.from('categories').insert({name: sub.name, icon: sub.icon, sort_order: sub.sort_order, company_id: newComp.id, parent_id: nSec.id}).select().single();
                                idMap[sub.id] = nSub.id;
                            }
                        }
                        const itemsToClone = oldItems.filter(i => idMap[i.category_id]).map(i => ({ category_id: idMap[i.category_id], name: i.name, type: i.type, description: i.description, file_path: null, sort_order: i.sort_order }));
                        if (itemsToClone.length > 0) await supabase.from('items').insert(itemsToClone);
                        showToast(`자회사 생성 완료!`); showCompanyModal.value = false; await loadCompanies();
                    } catch(e) { showToast('생성 실패', 'error', e.message); }
                    finally { isCloning.value = false; }
                };

                const showDeleteCompanyModal = ref(false);
                const isDeletingCompany = ref(false);
                const confirmDeleteCompany = () => { showDeleteCompanyModal.value = true; };
                const executeDeleteCompany = async () => {
                    isDeletingCompany.value = true;
                    try {
                        await supabase.from('profiles').update({ company_id: null }).eq('company_id', currentCompanyId.value);
                        await supabase.from('companies').delete().eq('id', currentCompanyId.value);
                        showToast('삭제 완료'); showDeleteCompanyModal.value = false;
                        currentCompanyId.value = companies.value[0].id; await loadCompanies();
                    } catch(e) { showToast('삭제 실패', 'error', e.message); }
                    finally { isDeletingCompany.value = false; }
                };

                const loadData = async () => {
                    try {
                        const { data: cats } = await supabase.from('categories').select('*').eq('company_id', currentCompanyId.value).order('sort_order', {ascending: true});
                        const { data: itms } = await supabase.from('items').select('*').order('sort_order', {ascending: true});
                        const built = [];
                        const sectors = (cats||[]).filter(c => !c.parent_id).sort((a,b) => a.sort_order - b.sort_order);
                        
                        for (const sector of sectors) {
                            const existingGroup = menuGroups.value.find(g => g.sectorId === sector.id);
                            const isOpen = existingGroup !== undefined ? existingGroup.isOpen : false; 
                            const group = { sectorName: sector.name, sectorId: sector.id, isOpen, categories: [] };
                            const subCats = cats.filter(c => c.parent_id === sector.id).sort((a,b) => a.sort_order - b.sort_order);
                            for (const cat of subCats) {
                                group.categories.push({ id: cat.id, name: cat.name, icon: cat.icon, items: itms.filter(i => i.category_id === cat.id).sort((a,b) => a.sort_order - b.sort_order) });
                            }
                            built.push(group);
                        }
                        menuGroups.value = built;
                        let stillExists = false;
                        for (const group of built) {
                            if (group.categories.some(c => c.id === activeCategoryId.value)) { stillExists = true; break; }
                        }
                        if (!stillExists && built.length > 0 && built[0].categories.length > 0) activeCategoryId.value = built[0].categories[0].id;
                    } catch(e) { console.error(e); }
                };

                const visibleMenuGroups = computed(() => {
                    if (userProfile.value?.role === 'admin') return menuGroups.value;
                    const allowed = userProfile.value?.allowed_menus || [];
                    if (allowed.length === 0) return menuGroups.value;
                    return menuGroups.value.map(group => {
                        const isSectorChecked = allowed.includes(group.sectorId);
                        const checkedSubCats = group.categories.filter(cat => allowed.includes(cat.id));
                        if (isSectorChecked) return group;
                        if (checkedSubCats.length > 0) return { ...group, categories: checkedSubCats };
                        return null;
                    }).filter(g => g !== null && g.categories.length > 0);
                });

                const activeCategoryName = computed(() => {
                    for (const group of menuGroups.value) {
                        for (const cat of group.categories) {
                            if (cat.id === activeCategoryId.value) return `${group.sectorName} > ${cat.name}`;
                        }
                    } return '';
                });

                const showCatModal = ref(false);
                const catModalData = ref({});
                const openCatModal = (id, mode, name = '', icon = '', parent_id = null) => {
                    catModalData.value = { id, name, parent_id, mode, title: mode === 'add_sector' ? '새 부문 만들기' : (mode === 'add' ? '하위 메뉴 추가' : '이름 수정') };
                    showCatModal.value = true;
                };
                const saveCategory = async () => {
                    if (!catModalData.value.name) return;
                    try {
                        if (catModalData.value.mode === 'edit') {
                            await supabase.from('categories').update({name: catModalData.value.name}).eq('id', catModalData.value.id);
                        } else {
                            const { data: cats } = await supabase.from('categories').select('sort_order').eq('company_id', currentCompanyId.value);
                            const maxSort = cats.length > 0 ? Math.max(...cats.map(c => c.sort_order || 0)) : 0;
                            await supabase.from('categories').insert({ name: catModalData.value.name, company_id: currentCompanyId.value, parent_id: catModalData.value.mode === 'add' ? catModalData.value.parent_id : null, sort_order: maxSort + 1 });
                        }
                        showCatModal.value = false; await loadData();
                    } catch (e) { showToast('저장 실패', 'error', e.message); }
                };

                const moveCategory = async (id, direction) => {
                    try {
                        const { data: cats } = await supabase.from('categories').select('*').eq('company_id', currentCompanyId.value).order('sort_order');
                        const target = cats.find(c => c.id === id);
                        if(!target) return;
                        const siblings = cats.filter(c => c.parent_id === target.parent_id).sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
                        const idx = siblings.findIndex(c => c.id === id);
                        if (idx < 0 || (direction === -1 && idx === 0) || (direction === 1 && idx === siblings.length - 1)) return;
                        const temp = siblings[idx];
                        siblings[idx] = siblings[idx + direction];
                        siblings[idx + direction] = temp;
                        const updates = siblings.map((c, index) => supabase.from('categories').update({sort_order: index + 1}).eq('id', c.id));
                        await Promise.all(updates); await loadData();
                    } catch(e) { showToast('순서 변경 실패', 'error'); }
                };

                const showDeleteModal = ref(false);
                const deleteTarget = ref(null);
                const confirmDeleteCategory = (id, name) => { deleteTarget.value = { type: 'category', id, name }; showDeleteModal.value = true; };
                const confirmDelete = (item) => { deleteTarget.value = { type: 'item', id: item.id, name: item.name }; showDeleteModal.value = true; };
                const executeDelete = async () => {
                    try {
                        if (deleteTarget.value.type === 'category') await supabase.from('categories').delete().eq('id', deleteTarget.value.id);
                        else await supabase.from('items').delete().eq('id', deleteTarget.value.id);
                        showDeleteModal.value = false; await loadData(); showToast('삭제 완료');
                    } catch(e) { showToast('삭제 실패', 'error'); }
                };

                const filteredItems = computed(() => {
                    for (const group of menuGroups.value) {
                        for (const cat of group.categories) {
                            if (cat.id === activeCategoryId.value) return cat.items;
                        }
                    } return [];
                });
                const selectedItems = ref([]);

                const showItemModal = ref(false);
                const isEditing = ref(false);
                const isUploading = ref(false);
                const dragActive = ref(false);
                const modalForm = ref({ id: '', name: '', type: 'download', description: '', files: [], links: [{name: '', url: ''}] });

                const openAddModal = () => { isEditing.value=false; modalForm.value={type:'download', files:[], links: [{name: '', url: ''}]}; showItemModal.value=true; };
                const openEditModal = (i) => {
                    isEditing.value=true; 
                    let parsedLinks = [{name: '', url: ''}];
                    if (['system', 'link'].includes(i.type)) {
                        if (hasFiles(i)) parsedLinks = JSON.parse(i.file_path);
                        else if (i.file_path) parsedLinks = [{name: i.name || '기본 링크', url: i.file_path}];
                    }
                    modalForm.value={...i, files: hasFiles(i) && !['system', 'link'].includes(i.type) ? JSON.parse(i.file_path) : [], links: parsedLinks}; 
                    showItemModal.value=true; 
                };

                const addLinkField = () => modalForm.value.links.push({name: '', url: ''});
                const removeLinkField = (idx) => { if (modalForm.value.links.length > 1) modalForm.value.links.splice(idx, 1); };

                const handleFileSelect = (e) => { const files = e.target.files; if(!files) return; for(let i=0; i<files.length; i++) modalForm.value.files.push({ fileObj: files[i], name: files[i].name, isNew: true }); };
                const handleDrop = (e) => { dragActive.value = false; const files = e.dataTransfer.files; if(!files) return; for(let i=0; i<files.length; i++) modalForm.value.files.push({ fileObj: files[i], name: files[i].name, isNew: true }); };
                const removeFile = (idx) => { modalForm.value.files.splice(idx, 1); };
                const moveFile = (idx, direction) => {
                    if (idx + direction < 0 || idx + direction >= modalForm.value.files.length) return;
                    const temp = modalForm.value.files[idx]; modalForm.value.files[idx] = modalForm.value.files[idx + direction]; modalForm.value.files[idx + direction] = temp;
                };

                const saveItem = async () => {
                    isUploading.value = true;
                    try {
                        let finalFilePath = null;
                        if (['download', 'document', 'notice', 'proxy_form'].includes(modalForm.value.type)) {
                            let finalFiles = [];
                            for (let fData of modalForm.value.files) {
                                if (fData.isNew) {
                                    const ext = fData.fileObj.name.match(/\.[^.]+$/)?.[0] || '';
                                    const safeName = `file_${Date.now()}_${Math.random().toString(36).substr(2, 9)}${ext}`;
                                    const { error } = await supabase.storage.from('documents').upload(safeName, fData.fileObj);
                                    if (error) throw error;
                                    const { data: urlData } = supabase.storage.from('documents').getPublicUrl(safeName);
                                    finalFiles.push({ name: fData.name, url: urlData.publicUrl });
                                } else { finalFiles.push(fData); }
                            }
                            finalFilePath = finalFiles.length > 0 ? JSON.stringify(finalFiles) : null;
                        } else if (['system', 'link'].includes(modalForm.value.type)) {
                            const validLinks = modalForm.value.links.filter(l => l.url.trim() !== '');
                            finalFilePath = validLinks.length > 0 ? JSON.stringify(validLinks) : null;
                        }

                        const payload = { name: modalForm.value.name, type: modalForm.value.type, description: modalForm.value.description, file_path: modalForm.value.type === 'my_business_card' ? null : finalFilePath };
                        if (isEditing.value) await supabase.from('items').update(payload).eq('id', modalForm.value.id);
                        else {
                            payload.category_id = activeCategoryId.value;
                            const maxSort = filteredItems.value.length > 0 ? Math.max(...filteredItems.value.map(i => i.sort_order || 0)) : 0;
                            payload.sort_order = maxSort + 1;
                            await supabase.from('items').insert(payload);
                        }
                        await loadData(); showItemModal.value = false; showToast('저장 완료');
                    } catch(e) { showToast('저장 실패', 'error', e.message); }
                    finally { isUploading.value = false; }
                };

                const draggedItemIndex = ref(null);
                const onDragStart = (index) => { draggedItemIndex.value = index; };
                const onDrop = async (targetIndex) => {
                    if (draggedItemIndex.value === null || draggedItemIndex.value === targetIndex) return;
                    try {
                        const items = [...filteredItems.value];
                        const [moved] = items.splice(draggedItemIndex.value, 1);
                        items.splice(targetIndex, 0, moved);
                        draggedItemIndex.value = null;
                        const updates = items.map((itm, index) => supabase.from('items').update({ sort_order: index + 1 }).eq('id', itm.id));
                        await Promise.all(updates); await loadData();
                    } catch(e) { showToast('순서 변경 실패', 'error'); }
                };
                const moveItem = async (item, direction) => {
                    try {
                        const items = [...filteredItems.value];
                        const idx = items.findIndex(i => i.id === item.id);
                        if (idx < 0 || (direction === -1 && idx === 0) || (direction === 1 && idx === items.length - 1)) return;
                        const temp = items[idx]; items[idx] = items[idx + direction]; items[idx + direction] = temp;
                        const updates = items.map((itm, index) => supabase.from('items').update({sort_order: index + 1}).eq('id', itm.id));
                        await Promise.all(updates); await loadData();
                    } catch(e) { showToast('순서 변경 실패', 'error'); }
                };

                const showPreviewModal = ref(false);
                const previewItem = ref(null);
                const previewFiles = ref([]);
                const hasFiles = (item) => item.file_path && item.file_path.startsWith('[');

                const handleAction = async (item) => {
                    if (item.type === 'my_business_card') {
                        if (isAdminMode.value) { openAdminCardManager(); } 
                        else {
                            try {
                                const { data, error } = await supabase.from('profiles').select('business_card_data').eq('id', userProfile.value.id).single();
                                if (!error && data) { userProfile.value.business_card_data = data.business_card_data; }
                            } catch(e) { console.error('명함 갱신 실패', e); }
                            businessCardData.value = userProfile.value?.business_card_data || { front: null, back: null };
                            showBusinessCardModal.value = true;
                        }
                    } else if (['download', 'document', 'notice', 'proxy_form'].includes(item.type)) { 
                        previewItem.value = item;
                        previewFiles.value = hasFiles(item) ? JSON.parse(item.file_path) : [];
                        showPreviewModal.value = true;
                    } else if (['system', 'link'].includes(item.type)) {
                        let links = [];
                        if (hasFiles(item)) links = JSON.parse(item.file_path);
                        else if (item.file_path) links = [{name: item.name, url: item.file_path}];
                        
                        if (links.length === 1) window.open(links[0].url, '_blank');
                        else if (links.length > 1) {
                            previewItem.value = item;
                            previewFiles.value = links;
                            showPreviewModal.value = true;
                        } else showToast('등록된 링크가 없습니다.', 'error');
                    }
                };

                const handleIDCopy = (item) => {
                    showToast('신분증 사본 요청 처리', 'success', '해당 기능은 뷰어나 폼 내부에서 제공됩니다.');
                };

                const openLink = (url) => window.open(url, '_blank');
                const downloadActualFile = async (url, fileName) => saveAs(url, fileName);
                const copyDownloadLink = (url, fileName) => {
                    const downloadUrl = `${url}?download=${encodeURIComponent(fileName)}`;
                    const tempInput = document.createElement('input');
                    tempInput.value = downloadUrl; document.body.appendChild(tempInput); tempInput.select();
                    try { document.execCommand('copy'); showToast('링크가 복사되었습니다.'); } catch(e) { showToast('복사 실패', 'error'); }
                    document.body.removeChild(tempInput);
                };
                
                const downloadSelectedZip = async () => {
                    if (selectedItems.value.length === 0) return;
                    showToast('압축 시작...');
                    const zip = new JSZip();
                    for (const itemId of selectedItems.value) {
                        const item = filteredItems.value.find(i => i.id === itemId);
                        if (item && hasFiles(item)) {
                            const files = JSON.parse(item.file_path);
                            const folder = zip.folder(item.name);
                            for (const file of files) {
                                const res = await fetch(file.url);
                                folder.file(file.name, await res.blob());
                            }
                        }
                    }
                    zip.generateAsync({type:"blob"}).then(content => saveAs(content, `다운로드_${Date.now()}.zip`));
                    selectedItems.value = [];
                };

                const showBusinessCardModal = ref(false);
                const businessCardData = ref({ front: null, back: null });
                const businessCardFiles = ref({ front: null, back: null });
                const isMgrCardUploading = ref(false);
                
                const cardManagerUsers = ref([]);
                const selectedCardUserId = ref('');

                const openAdminCardManager = async () => {
                    const { data } = await supabase.from('profiles').select('*').eq('status', 'approved');
                    cardManagerUsers.value = data || [];
                    if (cardManagerUsers.value.length > 0) { selectedCardUserId.value = cardManagerUsers.value[0].id; loadAdminSelectedUserCard(); }
                    showBusinessCardModal.value = true;
                };
                const loadAdminSelectedUserCard = () => {
                    const user = cardManagerUsers.value.find(u => u.id === selectedCardUserId.value);
                    businessCardData.value = user?.business_card_data || { front: null, back: null };
                    businessCardFiles.value = { front: null, back: null };
                };

                const processCardFile = (file, side) => { if (!file || !file.type.startsWith('image/')) return; businessCardFiles.value[side] = file; businessCardData.value[side] = URL.createObjectURL(file); };
                const handleCardFileSelect = (e, side) => processCardFile(e.target.files[0], side);
                const handleCardDrop = (e, side) => { e.currentTarget.classList.remove('bg-blue-50'); processCardFile(e.dataTransfer.files[0], side); };
                const handleCardPaste = (e, side) => {
                    const items = e.clipboardData.items;
                    for (let i = 0; i < items.length; i++) {
                        if (items[i].type.indexOf('image') !== -1) { processCardFile(items[i].getAsFile(), side); break; }
                    }
                };

                const saveAdminBusinessCard = async () => {
                    if (!selectedCardUserId.value) return;
                    isMgrCardUploading.value = true;
                    try {
                        const finalData = { ...businessCardData.value };
                        for (const side of ['front', 'back']) {
                            if (businessCardFiles.value[side]) {
                                const file = businessCardFiles.value[side];
                                const safeName = `card_${selectedCardUserId.value}_${side}_${Date.now()}.png`;
                                const { error } = await supabase.storage.from('documents').upload(safeName, file);
                                if (error) throw error;
                                const { data: urlData } = supabase.storage.from('documents').getPublicUrl(safeName);
                                finalData[side] = urlData.publicUrl;
                            }
                        }
                        await supabase.from('profiles').update({ business_card_data: finalData }).eq('id', selectedCardUserId.value);
                        const user = cardManagerUsers.value.find(u => u.id === selectedCardUserId.value);
                        if(user) user.business_card_data = finalData;
                        if (userProfile.value && userProfile.value.id === selectedCardUserId.value) userProfile.value.business_card_data = finalData;
                        showToast('명함이 등록되었습니다.');
                    } catch(err) { showToast('저장 실패', 'error'); }
                    finally { isMgrCardUploading.value = false; }
                };

                const shareBusinessCard = async (url, side) => {
                    if (!url) return;
                    try {
                        const response = await fetch(url); const blob = await response.blob();
                        try {
                            const item = new ClipboardItem({ [blob.type]: blob }); await navigator.clipboard.write([item]);
                            showToast('명함이 클립보드에 복사되었습니다! 채팅창에 붙여넣기(Ctrl+V) 하세요.');
                        } catch (clipErr) { copyDownloadLink(url, `business_card_${side}.png`); }
                    } catch (err) { copyDownloadLink(url, `business_card_${side}.png`); }
                };

                const showUserModal = ref(false);
                const usersList = ref([]);
                const editingUser = ref(null);
                const menuGroupsForEditingUser = ref([]);

                const openUserManagement = async () => {
                    const { data } = await supabase.from('profiles').select('*').order('created_at', {ascending: false});
                    usersList.value = data || []; showUserModal.value = true;
                };

                const loadMenuGroupsForEditingUser = async () => {
                    let targetCompId = editingUser.value.company_id || companies.value[0].id;
                    const { data: cats } = await supabase.from('categories').select('id, name, parent_id, sort_order').eq('company_id', targetCompId).order('sort_order');
                    const sectors = cats.filter(c => !c.parent_id);
                    menuGroupsForEditingUser.value = sectors.map(sec => ({ sectorId: sec.id, sectorName: sec.name, categories: cats.filter(c => c.parent_id === sec.id) }));
                };

                const selectUserForEdit = async (user) => {
                    editingUser.value = JSON.parse(JSON.stringify(user));
                    if (!editingUser.value.allowed_menus) editingUser.value.allowed_menus = [];
                    await loadMenuGroupsForEditingUser();
                };

                const updateUserStatus = async (status) => {
                    try {
                        await supabase.from('profiles').update({ status }).eq('id', editingUser.value.id);
                        showToast(`상태 변경 완료`); openUserManagement(); editingUser.value.status = status;
                    } catch(e) { showToast('상태 변경 실패', 'error'); }
                };

                const saveUserPermissions = async () => {
                    try {
                        const payload = { role: editingUser.value.role, company_id: editingUser.value.company_id, allowed_menus: editingUser.value.allowed_menus };
                        await supabase.from('profiles').update(payload).eq('id', editingUser.value.id);
                        showToast('저장 완료'); openUserManagement();
                    } catch(e) { showToast('저장 실패', 'error'); }
                };

                const getCompanyName = (id) => { const c = companies.value.find(x => x.id === id); return c ? c.name : ''; };

                onMounted(() => { checkSession(); });

                return {
                    authState, authForm, userProfile, isAuthLoading, rememberEmail, keepLoggedIn, handleLogin, handleRegister, handleLogout: async () => { await supabase.auth.signOut(); sessionStorage.removeItem('tempSession'); location.reload(); },
                    companies, currentCompanyId, currentCompanyName, loadData,
                    showCompanyModal, newCompanyName, isCloning, openAddCompanyModal, executeAddCompany, confirmDeleteCompany, executeDeleteCompany, showDeleteCompanyModal,
                    isAdminMode, toggleAdminMode: () => isAdminMode.value = !isAdminMode.value, isSidebarOpen, toggleSidebar: () => isSidebarOpen.value = !isSidebarOpen.value,
                    viewMode, menuGroups, visibleMenuGroups, activeCategoryId, activeCategoryName, filteredItems, selectCategory: (c) => { activeCategoryId.value = c.id; selectedItems.value = []; },
                    showCatModal, catModalData, openCatModal, saveCategory, moveCategory, showDeleteModal, deleteTarget, confirmDeleteCategory, confirmDelete, executeDelete,
                    showItemModal, isEditing, isUploading, dragActive, modalForm, openAddModal, openEditModal, closeModal: () => showItemModal.value=false, saveItem, moveItem, onDragStart, onDrop, handleFileSelect, handleDrop, removeFile, moveFile, addLinkField, removeLinkField,
                    showPreviewModal, previewItem, previewFiles, handleAction, handleIDCopy, copyDownloadLink, downloadActualFile, openLink, hasFiles, selectedItems, downloadSelectedZip,
                    showBusinessCardModal, businessCardData, selectedCardUserId, cardManagerUsers, isMgrCardUploading, openAdminCardManager, loadAdminSelectedUserCard, handleCardFileSelect, handleCardDrop, handleCardPaste, saveAdminBusinessCard, shareBusinessCard,
                    showUserModal, usersList, editingUser, menuGroupsForEditingUser, openUserManagement, selectUserForEdit, updateUserStatus, loadMenuGroupsForEditingUser, saveUserPermissions, getCompanyName,
                    toast, getIcon: (t) => ({notice:'fa-solid fa-bullhorn', download:'fa-solid fa-file-arrow-down', document:'fa-solid fa-file-signature', system:'fa-solid fa-laptop-code', link:'fa-solid fa-link', proxy_form:'fa-solid fa-id-card', my_business_card:'fa-solid fa-address-card'}[t]||'fa-solid fa-file'),
                    getIconClass: (t) => ({notice:'bg-red-50 text-red-600', download:'bg-blue-50 text-blue-600', my_business_card:'bg-indigo-50 text-indigo-600', proxy_form:'bg-emerald-50 text-emerald-600'}[t]||'bg-gray-50 text-gray-600'),
                    getTypeBorderClass: (t) => ({notice:'border-red-100', download:'border-blue-100', my_business_card:'border-indigo-100', proxy_form:'border-emerald-100'}[t]||'border-gray-200'),
                    getTypeName: (t) => ({notice:'공지사항', download:'일반파일', document:'사내기안', system:'시스템', link:'외부링크', proxy_form:'스마트폼', my_business_card:'개인명함'}[t]||'기타'),
                    getActionText: (t,i) => hasFiles(i) && !['system','link'].includes(t) ? '열람/다운로드' : ({notice:'내용확인', download:'다운로드', link:'바로가기', system:'바로가기', proxy_form:'스마트폼 작성'}[t]||'실행'),
                    getActionIcon: (t) => ({notice:'fa-solid fa-book-open', link:'fa-solid fa-arrow-up-right-from-square', system:'fa-solid fa-arrow-up-right-from-square', my_business_card:'fa-solid fa-image-portrait', proxy_form:'fa-solid fa-file-pen'}[t]||'fa-solid fa-download')
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
