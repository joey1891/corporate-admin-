<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사내 업무 지원 포털</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- JSZip (다중 파일 압축 다운로드용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1e40af', secondary: '#3b82f6', background: '#f3f4f6', surface: '#ffffff', },
                    fontFamily: { sans: ['Inter', 'Pretendard', 'sans-serif'], }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .a4-preview { width: 210mm; height: 297mm; background: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin: 0 auto; padding: 12mm; position: relative; transform-origin: top center; overflow: hidden; box-sizing: border-box; }
        @media print { 
            body * { visibility: hidden; } 
            .print-target, .print-target * { visibility: visible; } 
            .print-target { position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; padding: 12mm; box-shadow: none !important; margin: 0 !important; transform: none !important; overflow: hidden; box-sizing: border-box; } 
        }
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        /* 드래그 앤 드롭 영역 스타일 */
        .drop-zone { border: 2px dashed #cbd5e1; border-radius: 0.5rem; padding: 1.5rem; text-align: center; transition: all 0.2s ease; background-color: #f8fafc; cursor: pointer; }
        .drop-zone.dragover { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="text-gray-800 h-screen overflow-hidden">
    <div id="app" class="flex h-full w-full relative">
        
        <!-- ================= 인증 (로그인/회원가입) 오버레이 ================= -->
        <transition name="fade">
            <div v-if="authState !== 'authenticated'" class="fixed inset-0 z-[100] bg-gray-100 flex items-center justify-center p-4">
                
                <div v-if="authState === 'loading'" class="flex flex-col items-center">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-primary mb-4"></i>
                    <p class="text-gray-500 font-medium">시스템 접속 중...</p>
                </div>

                <div v-else-if="['login', 'register'].includes(authState)" class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                    <div class="p-8 text-center bg-gray-50 border-b border-gray-100">
                        <div class="w-16 h-16 bg-primary text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-lg">
                            <i class="fa-solid fa-building"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-900 tracking-tight mb-1">주식회사 힘</h2>
                        <p class="text-sm text-gray-500">사내 업무 지원 포털</p>
                    </div>
                    
                    <div class="p-8">
                        <div class="flex bg-gray-100 p-1 rounded-lg mb-6">
                            <button @click="authState = 'login'" :class="['flex-1 py-2 text-sm font-bold rounded-md transition-colors', authState === 'login' ? 'bg-white shadow text-primary' : 'text-gray-500']">로그인</button>
                            <button @click="authState = 'register'" :class="['flex-1 py-2 text-sm font-bold rounded-md transition-colors', authState === 'register' ? 'bg-white shadow text-primary' : 'text-gray-500']">회원가입</button>
                        </div>

                        <form @submit.prevent="authState === 'login' ? handleLogin() : handleRegister()" class="space-y-4">
                            <div v-if="authState === 'register'">
                                <label class="block text-xs font-semibold text-gray-600 mb-1">이름 (실명)</label>
                                <input type="text" v-model="authForm.name" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">이메일 (사내 계정)</label>
                                <input type="email" v-model="authForm.email" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">비밀번호</label>
                                <input type="password" v-model="authForm.password" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
                            </div>
                            
                            <div v-if="authState === 'login'" class="flex items-center gap-4 mt-3 mb-2 px-1 text-sm">
                                <label class="flex items-center text-gray-600 cursor-pointer hover:text-primary transition-colors">
                                    <input type="checkbox" v-model="rememberId" class="mr-2 rounded border-gray-300 text-primary focus:ring-primary h-4 w-4">
                                    <span>ID 기억하기</span>
                                </label>
                                <label class="flex items-center text-gray-600 cursor-pointer hover:text-primary transition-colors">
                                    <input type="checkbox" v-model="keepLoggedIn" class="mr-2 rounded border-gray-300 text-primary focus:ring-primary h-4 w-4">
                                    <span>로그인 유지</span>
                                </label>
                            </div>
                            
                            <button type="submit" :disabled="isAuthLoading" class="w-full py-3 px-4 bg-primary text-white rounded-lg font-bold shadow-md hover:bg-blue-800 focus:ring-4 focus:ring-blue-500/50 transition-all disabled:opacity-50 mt-2 flex justify-center items-center">
                                <i v-if="isAuthLoading" class="fa-solid fa-spinner fa-spin mr-2"></i>
                                {{ authState === 'login' ? '로그인' : '가입 신청하기' }}
                            </button>
                        </form>
                    </div>
                </div>

                <div v-else-if="authState === 'pending'" class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 text-center border-t-4 border-amber-500">
                    <div class="w-20 h-20 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6">
                        <i class="fa-solid fa-hourglass-half"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-900 mb-3">관리자 승인 대기 중</h2>
                    <p class="text-gray-500 mb-8 text-sm leading-relaxed">
                        가입 신청이 완료되었습니다.<br>
                        보안을 위해 관리자의 승인 후 시스템을<br>이용하실 수 있습니다.
                    </p>
                    <button @click="handleLogout" class="px-6 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-lg font-medium text-sm transition-colors">
                        다른 계정으로 로그인
                    </button>
                </div>
            </div>
        </transition>

        <!-- ================= 메인 앱 콘텐츠 (인증 및 승인 완료 시 표시) ================= -->
        <template v-if="authState === 'authenticated'">
            <div v-if="isSidebarOpen" @click="toggleSidebar" class="fixed inset-0 bg-black bg-opacity-50 z-20 md:hidden"></div>

            <aside :class="['fixed md:static inset-y-0 left-0 z-30 w-72 bg-surface border-r border-gray-200 transform transition-transform duration-300 ease-in-out flex flex-col', isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0']">
                <div class="h-16 flex items-center px-6 border-b border-gray-100 flex-shrink-0">
                    <i class="fa-solid fa-building text-primary text-xl mr-3"></i>
                    <span class="text-lg font-bold text-gray-900 tracking-tight">업무 지원 포털</span>
                </div>

                <div class="overflow-y-auto overflow-x-hidden flex-grow py-4 px-3 relative">
                    <div v-for="(group, groupIdx) in menuGroups" :key="groupIdx" class="mb-6 last:mb-0 group/sector">
                        <!-- 부문(Sector) 헤더 및 추가/수정/삭제 버튼 -->
                        <div class="flex items-center justify-between px-3 mb-3 bg-gray-100 border-l-4 border-primary rounded-r-lg py-2 group/sector">
                            <h3 class="text-sm font-extrabold text-gray-900 tracking-wider flex-1">{{ group.sectorName }}</h3>
                            <div v-if="isAdminMode" class="flex gap-0.5 opacity-100 md:opacity-0 md:group-hover/sector:opacity-100 transition-opacity items-center">
                                <button @click.stop="moveCategory(group.sectorId, null, -1)" :disabled="groupIdx === 0" class="w-6 h-6 rounded flex items-center justify-center text-gray-400 hover:bg-gray-300 disabled:opacity-30"><i class="fa-solid fa-caret-up text-[12px]"></i></button>
                                <button @click.stop="moveCategory(group.sectorId, null, 1)" :disabled="groupIdx === menuGroups.length - 1" class="w-6 h-6 rounded flex items-center justify-center text-gray-400 hover:bg-gray-300 disabled:opacity-30"><i class="fa-solid fa-caret-down text-[12px]"></i></button>
                                <div class="w-px h-3 bg-gray-300 mx-1"></div>
                                <button @click.stop="openAddCategory(group.sectorId)" class="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:bg-blue-100 hover:text-blue-600" title="하위 카테고리 추가"><i class="fa-solid fa-plus text-[10px]"></i></button>
                                <button @click.stop="openEditCategory({id: group.sectorId, name: group.sectorName, parent_id: null}, 1)" class="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:bg-green-100 hover:text-green-600" title="수정"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                <button @click.stop="confirmCategoryDelete({id: group.sectorId, name: group.sectorName}, 1)" class="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:bg-red-100 hover:text-red-600" title="삭제"><i class="fa-solid fa-trash text-[10px]"></i></button>
                            </div>
                        </div>

                        <!-- 카테고리(Category) 목록 -->
                        <ul class="space-y-1">
                            <li v-for="category in group.categories" :key="category.id" class="group/cat relative">
                                <div class="flex items-center w-full">
                                    <button @click="selectCategory(category)" :class="['flex-1 flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors duration-200 min-w-0', (!category.subCategories && activeCategoryId === category.id) ? 'bg-blue-50 text-primary' : '', (category.subCategories && isCategoryActive(category)) ? 'text-primary' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900']">
                                        <i :class="['w-5 text-center flex-shrink-0', category.icon || 'fa-solid fa-folder', isCategoryActive(category) ? 'text-primary' : 'text-gray-400']"></i>
                                        <span class="truncate">{{ category.name }}</span>
                                        <i v-if="category.subCategories" :class="['ml-auto fa-solid transition-transform duration-200 text-xs flex-shrink-0', category.isOpen ? 'fa-chevron-down' : 'fa-chevron-right']"></i>
                                        <span v-else-if="category.items && category.items.length > 0" class="ml-auto inline-flex items-center justify-center px-2 py-0.5 text-xs font-medium bg-gray-100 text-gray-600 rounded-full flex-shrink-0">{{ category.items.length }}</span>
                                    </button>
                                    
                                    <!-- 카테고리 관리 버튼 -->
                                    <div v-if="isAdminMode" class="absolute right-1 flex gap-0.5 bg-white/90 shadow-sm rounded-md border border-gray-100 px-1 py-0.5 opacity-100 md:opacity-0 md:group-hover/cat:opacity-100 transition-opacity z-10">
                                        <button @click.stop="openAddSubCategory(category.id)" class="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:bg-blue-100 hover:text-blue-600" title="하위 메뉴 추가"><i class="fa-solid fa-plus text-[10px]"></i></button>
                                        <button @click.stop="openEditCategory(category, 2)" class="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:bg-green-100 hover:text-green-600" title="수정"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                        <button @click.stop="confirmCategoryDelete(category, 2)" class="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:bg-red-100 hover:text-red-600" title="삭제"><i class="fa-solid fa-trash text-[10px]"></i></button>
                                    </div>
                                </div>
                                
                                <!-- 서브 카테고리(SubCategory) 목록 -->
                                <ul v-if="category.subCategories" v-show="category.isOpen" class="mt-1 space-y-1 pl-9">
                                    <li v-for="sub in category.subCategories" :key="sub.id" class="group/sub relative flex items-center">
                                        <button @click="selectSubCategory(sub.id)" :class="['flex-1 flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200 min-w-0', activeCategoryId === sub.id ? 'bg-blue-50 text-primary' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900']">
                                            <i class="fa-solid fa-minus text-[10px] w-3 text-center flex-shrink-0" :class="activeCategoryId === sub.id ? 'text-primary' : 'text-gray-300'"></i>
                                            <span class="truncate">{{ sub.name }}</span>
                                            <span v-if="sub.items && sub.items.length > 0" class="ml-auto inline-flex items-center justify-center px-2 py-0.5 text-xs font-medium bg-gray-100 text-gray-600 rounded-full flex-shrink-0">{{ sub.items.length }}</span>
                                        </button>
                                        
                                        <!-- 서브 카테고리 관리 버튼 -->
                                        <div v-if="isAdminMode" class="absolute right-1 flex gap-0.5 bg-white/90 shadow-sm rounded-md border border-gray-100 px-1 py-0.5 opacity-100 md:opacity-0 md:group-hover/sub:opacity-100 transition-opacity z-10">
                                            <button @click.stop="openEditCategory(sub, 3)" class="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:bg-green-100 hover:text-green-600" title="수정"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                            <button @click.stop="confirmCategoryDelete(sub, 3)" class="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:bg-red-100 hover:text-red-600" title="삭제"><i class="fa-solid fa-trash text-[10px]"></i></button>
                                        </div>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                    
                    <!-- 최상위 부문 추가 버튼 -->
                    <div v-if="isAdminMode" class="mt-8 mb-4 px-2">
                        <button @click="openAddSector" class="w-full py-2.5 border-2 border-dashed border-gray-300 rounded-lg text-sm font-bold text-gray-500 hover:border-primary hover:text-primary hover:bg-blue-50 transition-colors flex justify-center items-center gap-2">
                            <i class="fa-solid fa-folder-plus"></i> 새 최상위 부문 추가
                        </button>
                    </div>
                </div>
                
                <div class="p-4 border-t border-gray-100 bg-gray-50 flex-shrink-0">
                    <div class="mb-3 px-1 flex items-center justify-between">
                        <span class="text-xs font-medium text-gray-500">DB 연결 상태</span>
                        <span v-if="isDbConnected" class="flex items-center text-xs text-emerald-600 font-bold"><span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>Supabase</span>
                        <span v-else class="flex items-center text-xs text-amber-500 font-bold"><span class="w-2 h-2 rounded-full bg-amber-400 mr-1.5"></span>Local Mode</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-9 h-9 rounded-full bg-primary text-white flex items-center justify-center font-bold text-sm">
                                {{ userProfile?.full_name ? userProfile.full_name.substring(0,2) : 'US' }}
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-medium text-gray-900 truncate">{{ userProfile?.full_name || '사용자' }} <span v-if="userProfile?.role === 'admin'" class="text-[10px] bg-red-100 text-red-600 px-1 py-0.5 rounded ml-1">Admin</span></p>
                                <p class="text-xs text-gray-500 truncate">{{ userProfile?.email || '' }}</p>
                            </div>
                        </div>
                        <button @click="handleLogout" class="text-gray-400 hover:text-red-500 p-2" title="로그아웃"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                    </div>
                </div>
            </aside>

            <main class="flex-1 flex flex-col min-w-0 bg-background overflow-hidden relative">
                <header class="h-16 bg-surface border-b border-gray-200 flex items-center justify-between px-4 sm:px-6 z-10 flex-shrink-0">
                    <div class="flex items-center flex-1">
                        <button @click="toggleSidebar" class="md:hidden mr-4 text-gray-500 hover:text-gray-700">
                            <i class="fa-solid fa-bars text-xl"></i>
                        </button>
                        <div class="relative w-full max-w-md hidden sm:block">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" v-model="searchQuery" placeholder="필요한 서류나 시스템을 검색해보세요" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-gray-50 focus:bg-white">
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <!-- 다중 선택된 항목 압축 다운로드 버튼 -->
                        <button v-if="selectedItems.length > 0" @click="downloadZip" class="flex items-center px-3 py-1.5 bg-blue-600 text-white hover:bg-blue-700 rounded text-xs font-bold transition-colors shadow-sm mr-2 animate-pulse">
                            <i class="fa-solid fa-file-zipper mr-1.5"></i> {{ selectedItems.length }}개 일괄 다운로드
                        </button>

                        <button v-if="isAdminMode && !isDbConnected" @click="seedDatabase" class="hidden lg:flex items-center px-3 py-1.5 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 border border-emerald-300 rounded text-xs font-bold transition-colors shadow-sm">
                            <i class="fa-solid fa-database mr-1.5"></i> DB 기본 세팅
                        </button>
                        
                        <button v-if="userProfile?.role === 'admin'" @click="openUserManagement" class="hidden sm:flex items-center px-3 py-1.5 bg-purple-100 text-purple-700 hover:bg-purple-200 border border-purple-300 rounded text-xs font-bold transition-colors shadow-sm">
                            <i class="fa-solid fa-users-gear mr-1.5"></i> 회원 관리
                        </button>

                        <div class="flex bg-gray-100 rounded-lg p-1 ml-2">
                            <button @click="viewMode = 'list'" :class="['px-3 py-1.5 rounded text-sm font-medium transition-colors', viewMode === 'list' ? 'bg-white shadow text-primary' : 'text-gray-500 hover:text-gray-700']"><i class="fa-solid fa-list mr-1"></i></button>
                            <button @click="viewMode = 'grid'" :class="['px-3 py-1.5 rounded text-sm font-medium transition-colors', viewMode === 'grid' ? 'bg-white shadow text-primary' : 'text-gray-500 hover:text-gray-700']"><i class="fa-solid fa-border-all mr-1"></i></button>
                        </div>

                        <div v-if="userProfile?.role === 'admin'" class="flex items-center gap-2 border-l pl-4 border-gray-200 ml-2">
                            <span class="text-xs font-bold text-gray-600">편집 모드</span>
                            <button @click="isAdminMode = !isAdminMode" :class="['relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none', isAdminMode ? 'bg-red-500' : 'bg-gray-200']">
                                <span :class="['inline-block h-4 w-4 transform rounded-full bg-white transition-transform shadow', isAdminMode ? 'translate-x-6' : 'translate-x-1']"></span>
                            </button>
                        </div>
                    </div>
                </header>

                <div class="flex-1 overflow-y-auto p-4 sm:p-8 relative">
                    <!-- ZIP 파일 생성 중 로딩 오버레이 -->
                    <div v-if="isZipping" class="absolute inset-0 z-20 bg-white/70 backdrop-blur-sm flex flex-col items-center justify-center">
                        <i class="fa-solid fa-spinner fa-spin text-5xl text-blue-600 mb-4"></i>
                        <p class="text-lg font-bold text-gray-800">ZIP 파일로 압축 중입니다...</p>
                        <p class="text-sm text-gray-500 mt-2">파일 크기에 따라 시간이 걸릴 수 있습니다.</p>
                    </div>

                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900 mb-1">{{ activeCategoryName }}</h1>
                            <p class="text-sm text-gray-500">총 {{ filteredItems.length }}개의 항목이 있습니다.</p>
                        </div>
                    </div>

                    <div v-if="filteredItems.length === 0" class="flex flex-col items-center justify-center py-20 bg-surface rounded-xl border border-gray-200 border-dashed">
                        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-400 text-2xl"><i class="fa-solid fa-folder-open"></i></div>
                        <h3 class="text-lg font-medium text-gray-900 mb-1">항목이 없습니다</h3>
                        <p class="text-sm text-gray-500">현재 카테고리에 등록된 문서나 시스템이 없습니다.</p>
                    </div>

                    <!-- 리스트 뷰 -->
                    <div v-else-if="viewMode === 'list'" class="bg-surface rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                        <ul class="divide-y divide-gray-200">
                            <li v-for="(item, index) in filteredItems" :key="item.id" class="p-4 hover:bg-gray-50 transition-colors flex items-center justify-between gap-4 group">
                                <div class="flex items-center gap-4 min-w-0">
                                    <!-- 다중 선택 체크박스 -->

                    delegatee: { name: '', id: '', dept_pos: '', phone: '', address: '' }, mandate: { purpose: '', details: '' }, period: { condition: '해당 업무 종료 시까지' }
                });

                const menuGroups = ref([]);

                const checkSession = async () => {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) { userSession.value = session; await fetchUserProfile(session.user.id); } 
                    else { authState.value = 'login'; }
                };

                const fetchUserProfile = async (userId) => {
                    try {
                        const { data, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
                        if (error) throw error;
                        userProfile.value = data;
                        if (data.status === 'pending') authState.value = 'pending';
                        else if (data.status === 'approved') { authState.value = 'authenticated'; loadData(); }
                    } catch (e) { authState.value = 'pending'; }
                };

                const handleLogin = async () => {
                    isAuthLoading.value = true;
                    try {
                        const { data, error } = await supabase.auth.signInWithPassword({ email: authForm.value.email, password: authForm.value.password });
                        if (error) throw error;
                        userSession.value = data.session;
                        await fetchUserProfile(data.user.id);
                    } catch (error) { showToast('로그인 실패', 'error'); } finally { isAuthLoading.value = false; }
                };
                const handleRegister = async () => { /* 회원가입 생략 (기존 동일) */ };
                const handleLogout = async () => { await supabase.auth.signOut(); authState.value = 'login'; showToast('로그아웃 되었습니다.'); };
                
                const openUserManagement = () => { if (userProfile.value?.role === 'admin') showUserModal.value = true; };
                const updateUserStatus = async (userId, newStatus) => { await supabase.from('profiles').update({ status: newStatus }).eq('id', userId); };

                const loadData = async () => {
                    try {
                        const { data: cats, error: catError } = await supabase.from('categories').select('*');
                        let itms = [];
                        
                        const { data: sortedItms, error: itmError } = await supabase.from('items').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: true });
                        if (itmError) {
                            const { data: fallbackItms } = await supabase.from('items').select('*').order('created_at', { ascending: true });
                            itms = fallbackItms || [];
                        } else {
                            itms = sortedItms || [];
                        }
                        
                        if (!catError && cats && cats.length > 0) {
                            isDbConnected.value = true;
                            buildMenuTree(cats, itms);
                        } else {
                            isDbConnected.value = false;
                        }
                    } catch (e) {
                        isDbConnected.value = false;
                    }
                };

                const buildMenuTree = (cats, itms) => {
                    const built = [];
                    const sectors = cats.filter(c => !c.parent_id).sort((a,b) => a.sort_order - b.sort_order);
                    
                    for (const sector of sectors) {
                        const group = { sectorName: sector.name, sectorId: sector.id, categories: [] };
                        const subCats = cats.filter(c => c.parent_id === sector.id).sort((a,b) => a.sort_order - b.sort_order);
                        
                        for (const cat of subCats) {
                            // 부모 ID 정보 보존 (수정/삭제 시 활용)
                            const category = { id: cat.id, name: cat.name, icon: cat.icon, parent_id: cat.parent_id, items: [] };
                            const deepSubs = cats.filter(c => c.parent_id === cat.id).sort((a,b) => a.sort_order - b.sort_order);
                            
                            if (deepSubs.length > 0) {
                                category.subCategories = []; category.isOpen = false;
                                for (const sub of deepSubs) {
                                    const subCategory = { id: sub.id, name: sub.name, parent_id: sub.parent_id, items: [] };
                                    subCategory.items = itms.filter(i => i.category_id === sub.id).map(i => ({ 
                                        id: i.id, name: i.name, type: i.type, desc: i.description, 
                                        file_path: i.file_path, files: i.files || [], sort_order: i.sort_order || 0 
                                    }));
                                    category.subCategories.push(subCategory);
                                }
                            } else {
                                category.items = itms.filter(i => i.category_id === cat.id).map(i => ({ 
                                    id: i.id, name: i.name, type: i.type, desc: i.description, 
                                    file_path: i.file_path, files: i.files || [], sort_order: i.sort_order || 0 
                                }));
                            }
                            group.categories.push(category);
                        }
                        built.push(group);
                    }
                    menuGroups.value = built;
                    if (!activeCategoryId.value && built.length > 0 && built[0].categories.length > 0) {
                        activeCategoryId.value = built[0].categories[0].subCategories ? built[0].categories[0].subCategories[0].id : built[0].categories[0].id;
                    }
                };

                const seedDatabase = async () => { /* ... 생략 ... */ };

                const openAddSector = () => {
                    isCategoryEditing.value = false;
                    categoryForm.value = { id: '', name: '', parent_id: null, icon: '', level: 1 };
                    showCategoryModal.value = true;
                };
                
                const openAddCategory = (sectorId) => {
                    isCategoryEditing.value = false;
                    categoryForm.value = { id: '', name: '', parent_id: sectorId, icon: 'fa-solid fa-folder', level: 2 };
                    showCategoryModal.value = true;
                };

                const openAddSubCategory = (categoryId) => {
                    isCategoryEditing.value = false;
                    categoryForm.value = { id: '', name: '', parent_id: categoryId, icon: '', level: 3 };
                    showCategoryModal.value = true;
                };

                const openEditCategory = (cat, level) => {
                    isCategoryEditing.value = true;
                    categoryForm.value = { 
                        id: cat.id, 
                        name: cat.name || cat.sectorName, 
                        parent_id: cat.parent_id || null, 
                        icon: cat.icon || '', 
                        level: level 
                    };
                    showCategoryModal.value = true;
                };

                const closeCategoryModal = () => { showCategoryModal.value = false; };

                const saveCategory = async () => {
                    if (!isDbConnected.value) return showToast('메뉴를 편집하려면 DB 연결이 필요합니다.', 'error');
                    if (!categoryForm.value.name.trim()) return showToast('메뉴명을 입력해주세요.', 'error');
                    
                    const payload = { 
                        name: categoryForm.value.name,
                        parent_id: categoryForm.value.parent_id,
                        icon: categoryForm.value.level === 2 ? categoryForm.value.icon : null
                    };

                    try {
                        if (isCategoryEditing.value) {
                            const { error } = await supabase.from('categories').update(payload).eq('id', categoryForm.value.id);
                            if (error) throw error;
                        } else {
                            // 새 카테고리 추가 시, 동일한 parent_id 형제들 중 마지막 순서(sort_order) 계산
                            let query = supabase.from('categories').select('sort_order');
                            if (categoryForm.value.parent_id) query = query.eq('parent_id', categoryForm.value.parent_id);
                            else query = query.is('parent_id', null);
                            
                            const { data: siblings } = await query;
                            let nextSort = 0;
                            if (siblings && siblings.length > 0) {
                                nextSort = Math.max(...siblings.map(s => s.sort_order || 0)) + 1;
                            }
                            payload.sort_order = nextSort;
                            
                            const { error } = await supabase.from('categories').insert(payload);
                            if (error) throw error;
                        }
                        await loadData();
                        closeCategoryModal();
                        showToast(isCategoryEditing.value ? '메뉴가 수정되었습니다.' : '새 메뉴가 추가되었습니다.');
                    } catch (e) {
                        showToast(`메뉴 저장 실패: ${e.message}`, 'error');
                    }
                };

                const confirmCategoryDelete = (cat, level) => {
                    categoryToDelete.value = { ...cat, level };
                    showCategoryDeleteModal.value = true;
                };

                const executeCategoryDelete = async () => {
                    if (!isDbConnected.value || !categoryToDelete.value) return;
                    try {
                        const { error } = await supabase.from('categories').delete().eq('id', categoryToDelete.value.id);
                        if (error) throw error;
                        await loadData();
                        showToast('메뉴가 삭제되었습니다.');
                    } catch (e) {
                        showToast(`메뉴 삭제 실패: ${e.message}`, 'error');
                    } finally {
                        showCategoryDeleteModal.value = false;
                        categoryToDelete.value = null;
                    }
                };

                const moveCategory = async (categoryId, parentId, direction) => {
                    if (!isDbConnected.value) return showToast('순서를 변경하려면 DB 연결이 필요합니다.', 'error');
                    
                    try {
                        let query = supabase.from('categories').select('*');
                        if (parentId) query = query.eq('parent_id', parentId);
                        else query = query.is('parent_id', null);
                        
                        const { data: siblings, error } = await query.order('sort_order', { ascending: true });
                        if (error || !siblings) throw error;
                        
                        const currentIndex = siblings.findIndex(s => s.id === categoryId);
                        if (currentIndex === -1) return;
                        
                        const newIndex = currentIndex + direction;
                        if (newIndex < 0 || newIndex >= siblings.length) return;
                        
                        const temp = siblings[currentIndex];
                        siblings[currentIndex] = siblings[newIndex];
                        siblings[newIndex] = temp;
                        
                        for (let i = 0; i < siblings.length; i++) siblings[i].sort_order = i;
                        
                        const updatePromises = siblings.map(s => supabase.from('categories').update({ sort_order: s.sort_order }).eq('id', s.id));
                        await Promise.all(updatePromises);
                        
                        await loadData();
                    } catch (e) {
                        showToast(`순서 변경 실패: ${e.message}`, 'error');
                    }
                };

                const activeCategoryName = computed(() => {
                    for (const group of menuGroups.value) {
                        for (const cat of group.categories) {
                            if (cat.id === activeCategoryId.value) return cat.name;
                            if (cat.subCategories) {
                                const sub = cat.subCategories.find(s => s.id === activeCategoryId.value);
                                if (sub) return `${cat.name} > ${sub.name}`;
                            }
                        }
                    } return '';
                });

                const filteredItems = computed(() => {
                    let activeCat = null;
                    for (const group of menuGroups.value) {
                        for (const cat of group.categories) {
                            if (cat.id === activeCategoryId.value) { activeCat = cat; break; }
                            if (cat.subCategories) {
                                const sub = cat.subCategories.find(s => s.id === activeCategoryId.value);
                                if (sub) { activeCat = sub; break; }
                            }
                        }
                        if (activeCat) break;
                    }
                    if (!activeCat || !activeCat.items) return [];
                    let items = [...activeCat.items].sort((a,b) => a.sort_order - b.sort_order);
                    if (!searchQuery.value) return items;
                    const query = searchQuery.value.toLowerCase();
                    return items.filter(item => item.name.toLowerCase().includes(query));
                });

                watch(activeCategoryId, () => { selectedItems.value = []; });
                const formattedDate = computed(() => { const d = new Date(); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`; });
                const toggleSidebar = () => { isSidebarOpen.value = !isSidebarOpen.value; };
                
                const selectCategory = (category) => {
                    if (category.subCategories) { category.isOpen = !category.isOpen; if (category.isOpen && category.subCategories.length > 0) activeCategoryId.value = category.subCategories[0].id; } 
                    else { activeCategoryId.value = category.id; searchQuery.value = ''; }
                };
                const selectSubCategory = (subId) => { activeCategoryId.value = subId; searchQuery.value = ''; };
                const isCategoryActive = (category) => {
                    if (activeCategoryId.value === category.id) return true;
                    if (category.subCategories && category.subCategories.some(s => s.id === activeCategoryId.value)) return true;
                    return false;
                };

                const getTargetCategory = () => {
                    for (const group of menuGroups.value) {
                        for (const cat of group.categories) {
                            if (cat.id === activeCategoryId.value) return cat;
                            if (cat.subCategories) {
                                const sub = cat.subCategories.find(s => s.id === activeCategoryId.value);
                                if (sub) return sub;
                            }
                        }
                    } return null;
                };

                const openAddModal = () => { isEditing.value = false; modalForm.value = { id: '', name: '', type: 'download', desc: '', files: [], file_path: '' }; showItemModal.value = true; };
                const openEditModal = (item) => { isEditing.value = true; modalForm.value = JSON.parse(JSON.stringify(item)); if(!modalForm.value.files) modalForm.value.files = []; showItemModal.value = true; };
                const closeModal = () => { showItemModal.value = false; isDragging.value = false; };
                
                const triggerFileInput = () => { fileInputRef.value.click(); };
                const handleFileDrop = (e) => { isDragging.value = false; if (e.dataTransfer.files.length > 0) processFiles(e.dataTransfer.files); };
                const handleFileUpload = (e) => { if (e.target.files.length > 0) processFiles(e.target.files); };
                
                const processFiles = (fileList) => {
                    for (let i = 0; i < fileList.length; i++) {
                        const file = fileList[i];
                        if (isDbConnected.value) {
                            modalForm.value.files.push({ fileObj: file, name: file.name, size: file.size, isNew: true });
                        } else {
                            const url = URL.createObjectURL(file);
                            modalForm.value.files.push({ url: url, name: file.name, size: file.size, isNew: false });
                        }
                    }
                };
                const removeFile = (idx) => { modalForm.value.files.splice(idx, 1); };

                const moveItem = async (item, currentIndex, direction) => {
                    const targetCategory = getTargetCategory();
                    if (!targetCategory || !targetCategory.items) return;
                    const items = targetCategory.items;
                    const newIndex = currentIndex + direction;
                    if (newIndex < 0 || newIndex >= items.length) return;

                    const temp = items[currentIndex];
                    items[currentIndex] = items[newIndex];
                    items[newIndex] = temp;

                    for (let i = 0; i < items.length; i++) { items[i].sort_order = i; }

                    if (isDbConnected.value) {
                        try {
                            const updatePromises = items.map(it => supabase.from('items').update({ sort_order: it.sort_order }).eq('id', it.id));
                            const results = await Promise.all(updatePromises);
                            const errorResult = results.find(res => res.error);
                            if (errorResult) throw errorResult.error;
                        } catch (e) {
                            showToast(`순서 저장 실패: ${e.message || '알 수 없는 오류'}`, 'error');
                        }
                    }
                };

                const saveItem = async () => {
                    if (!modalForm.value.name.trim()) return showToast('항목명을 입력해주세요.', 'error');
                    const targetCategory = getTargetCategory();
                    if (!targetCategory) return;
                    
                    let finalFiles = [];

                    if (isDbConnected.value) {
                        isUploading.value = true;
                        
                        if (['download', 'document'].includes(modalForm.value.type)) {
                            for (let i = 0; i < modalForm.value.files.length; i++) {
                                const fData = modalForm.value.files[i];
                                uploadProgress.value = `${i+1}/${modalForm.value.files.length}`;
                                
                                if (fData.isNew) {
                                    const fileName = `${Date.now()}_${fData.name}`;
                                    const { data, error } = await supabase.storage.from('documents').upload(fileName, fData.fileObj);
                                    if (!error) {
                                        const { data: urlData } = supabase.storage.from('documents').getPublicUrl(fileName);
                                        finalFiles.push({ name: fData.name, url: urlData.publicUrl, size: fData.size });
                                    }
                                } else { finalFiles.push(fData); }
                            }
                        }

                        const payload = { 
                            name: modalForm.value.name, type: modalForm.value.type, description: modalForm.value.desc,
                            files: finalFiles, file_path: modalForm.value.file_path
                        };

                        if (isEditing.value) {
                            await supabase.from('items').update(payload).eq('id', modalForm.value.id);
                        } else {
                            payload.category_id = targetCategory.id;
                            payload.sort_order = targetCategory.items.length;
                            await supabase.from('items').insert(payload);
                        }
                        await loadData();
                        isUploading.value = false; uploadProgress.value = '';
                    } else {
                        if (isEditing.value) {
                            const index = targetCategory.items.findIndex(i => i.id === modalForm.value.id);
                            if (index !== -1) targetCategory.items[index] = { ...modalForm.value };
                        } else { targetCategory.items.push({ ...modalForm.value, id: 'item_' + Date.now(), sort_order: targetCategory.items.length }); }
                    }
                    closeModal(); showToast(isEditing.value ? '항목이 수정되었습니다.' : '항목이 추가되었습니다.');
                };

                const confirmDelete = (item) => { itemToDelete.value = item; showDeleteModal.value = true; };
                const executeDelete = async () => {
                    if (!itemToDelete.value) return;
                    if (isDbConnected.value) {
                        const { error } = await supabase.from('items').delete().eq('id', itemToDelete.value.id);
                        if(error) { showToast(`항목 삭제 실패: ${error.message}`, 'error'); return; }
                        await loadData();
                    } else {
                        const targetCategory = getTargetCategory();
                        if (targetCategory && targetCategory.items) targetCategory.items = targetCategory.items.filter(i => i.id !== itemToDelete.value.id);
                    }
                    showToast('문서 항목이 삭제되었습니다.'); showDeleteModal.value = false; itemToDelete.value = null;
                };

                const handleAction = (item) => {
                    if (item.type === 'proxy_form') { showProxyForm.value = true; } 
                    else if (['download', 'document'].includes(item.type)) { previewItem.value = item; showPreviewModal.value = true; } 
                    else if (item.file_path) { window.open(item.file_path, '_blank'); }
                };

                const hasFiles = (item) => { return (item?.files && item.files.length > 0) || item?.file_path; };
                const getFileCount = (item) => { return item?.files?.length || (item?.file_path ? 1 : 0); };

                const downloadActualFile = async (url, customName = null) => {
                    try {
                        showToast('파일을 불러오는 중입니다...', 'success');
                        const response = await fetch(url);
                        if (!response.ok) throw new Error('Network response was not ok');
                        const blob = await response.blob();
                        const blobUrl = window.URL.createObjectURL(blob);
                        
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = blobUrl;
                        a.download = customName || url.split('/').pop().split('?')[0]; 
                        
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(blobUrl);
                        document.body.removeChild(a);
                    } catch (e) {
                        window.open(url, '_blank');
                    }
                };

                const downloadAllFiles = async (item) => {
                    if (!item.files || item.files.length === 0) return;
                    for (const f of item.files) { await downloadActualFile(f.url, f.name); }
                    showToast('모든 파일의 다운로드가 시작되었습니다.');
                };

                const downloadZip = async () => { /* ... 압축 생략 ... */ };

                const showPreviewModal = ref(false);
                const previewItem = ref(null);
                const closePreviewModal = () => { showPreviewModal.value = false; previewItem.value = null; };
                const printPreview = () => { window.print(); };
                const downloadPreviewPDF = () => {
                    const element = document.getElementById('preview-content');
                    const originalTransform = element.style.transform;
                    const originalHeight = element.style.height;
                    element.style.transform = 'scale(1)';
                    element.style.height = '296mm';
                    html2pdf().set({ margin: 0, filename: `${previewItem.value.name}_표지.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(element).save().then(() => {
                        element.style.transform = originalTransform; element.style.height = originalHeight || 'auto';
                        showToast('PDF 다운로드 완료');
                    });
                };
                
                const applyTemplate = (type) => { /* 생략 */ };
                const generatePDF = () => {
                    const element = document.getElementById('print-area');
                    const originalTransform = element.style.transform;
                    const originalHeight = element.style.height;
                    element.style.transform = 'scale(1)';
                    element.style.height = '296mm';
                    html2pdf().set({ margin: 0, filename: '위임장.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(element).save().then(() => {
                        element.style.transform = originalTransform; element.style.height = originalHeight || 'auto';
                        showToast('위임장 발급 완료');
                    });
                };
                const printForm = () => { window.print(); };
                const downloadCEOID = () => { window.open("https://zpzaiuqcoltshtsrllxx.supabase.co/storage/v1/object/sign/company_assets/Representative's%20ID%20Card.jpg...", '_blank'); };

                const getIcon = (t) => ({ download: 'fa-solid fa-file-arrow-down', document: 'fa-solid fa-file-signature', system: 'fa-solid fa-laptop-code', link: 'fa-solid fa-arrow-up-right-from-square', proxy_form: 'fa-solid fa-file-invoice' }[t] || 'fa-solid fa-file');
                const getIconClass = (t) => ({ download: 'bg-blue-50 text-blue-600', document: 'bg-emerald-50 text-emerald-600', system: 'bg-purple-50 text-purple-600', link: 'bg-amber-50 text-amber-600', proxy_form: 'bg-rose-50 text-rose-600' }[t] || 'bg-gray-50 text-gray-600');
                const getTypeName = (t) => ({ download: '양식 파일', document: '내부 기안', system: '사내 시스템', link: '외부 링크', proxy_form: '스마트 폼' }[t] || '기타');
                const getActionText = (t) => ({ download: '열람/다운로드', document: '열람/다운로드', system: '시스템 열기', link: '바로가기', proxy_form: '작성/발급' }[t] || '실행');
                const getActionIcon = (t) => ({ download: 'fa-solid fa-folder-open', document: 'fa-solid fa-folder-open', system: 'fa-solid fa-desktop', link: 'fa-solid fa-link', proxy_form: 'fa-solid fa-wand-magic-sparkles' }[t] || 'fa-solid fa-play');

                onMounted(() => {
                    const savedEmail = localStorage.getItem('savedEmail');
                    if (savedEmail) { authForm.value.email = savedEmail; rememberId.value = true; }
                    checkSession();
                });

                return {
                    authState, authForm, isAuthLoading, userProfile, handleLogin, handleRegister, handleLogout,
                    rememberId, keepLoggedIn, showUserModal, userList, openUserManagement, updateUserStatus,
                    isSidebarOpen, searchQuery, activeCategoryId, activeCategoryName, filteredItems, viewMode, menuGroups,
                    toggleSidebar, selectCategory, selectSubCategory, isCategoryActive, isAdminMode, isDbConnected, seedDatabase,
                    
                    // 우측 항목 관련
                    showItemModal, showDeleteModal, isEditing, isUploading, uploadProgress, modalForm, itemToDelete,
                    isDragging, fileInputRef, triggerFileInput, handleFileDrop, handleFileUpload, removeFile,
                    selectedItems, isZipping, downloadZip, moveItem,
                    openAddModal, openEditModal, closeModal, saveItem, confirmDelete, executeDelete, handleAction,
                    hasFiles, getFileCount, downloadActualFile, downloadAllFiles,
                    
                    // 카테고리 관리 관련
                    showCategoryModal, showCategoryDeleteModal, isCategoryEditing, categoryForm, categoryToDelete,
                    openAddSector, openAddCategory, openAddSubCategory, openEditCategory, closeCategoryModal,
                    saveCategory, confirmCategoryDelete, executeCategoryDelete, moveCategory,

                    getIcon, getIconClass, getTypeName, getActionText, getActionIcon, downloadCEOID, toast,
                    showProxyForm, proxyData, formattedDate, stampImage, applyTemplate, generatePDF, printForm,
                    showPreviewModal, previewItem, closePreviewModal, printPreview, downloadPreviewPDF
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
