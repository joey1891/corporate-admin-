<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사내 업무 지원 포털</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 캡처 및 공유를 위한 html2canvas 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1e40af', secondary: '#3b82f6', background: '#f3f4f6', surface: '#ffffff', },
                    fontFamily: { sans: ['Inter', 'Pretendard', 'sans-serif'], }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        
        /* 공지사항 HTML 렌더링 스타일 */
        .html-content h1 { font-size: 1.75rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; }
        .html-content h2 { font-size: 1.5rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; }
        .html-content p { margin-bottom: 0.75rem; line-height: 1.6; }
        .html-content strong, .html-content b { font-weight: 800; color: #111827; }
        .html-content a { color: #2563eb; text-decoration: underline; }

        /* 드래그앤드롭 및 포커스(붙여넣기) 아웃라인 방지 */
        .dropzone:focus { outline: 2px solid #3b82f6; outline-offset: 2px; }
    </style>
</head>
<body class="text-gray-800 h-screen overflow-hidden">
    <div id="app" class="flex h-full w-full relative">
        
        <!-- 로그인/회원가입 화면 -->
        <transition name="fade">
            <div v-if="authState !== 'authenticated'" class="fixed inset-0 z-[100] bg-gray-100 flex items-center justify-center p-4">
                <div v-if="authState === 'loading'" class="flex flex-col items-center">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-primary mb-4"></i>
                    <p class="text-gray-500 font-medium">시스템 접속 중...</p>
                </div>
                <div v-else-if="['login', 'register'].includes(authState)" class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                    <div class="p-8 text-center bg-gray-50 border-b border-gray-100">
                        <div class="w-16 h-16 bg-primary text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-lg">
                            <i class="fa-solid fa-building"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-900 tracking-tight mb-1">통합 업무 포털</h2>
                        <p class="text-sm text-gray-500">사내 시스템 로그인</p>
                    </div>
                    <div class="p-8">
                        <div class="flex bg-gray-100 p-1 rounded-lg mb-6">
                            <button @click="authState = 'login'" :class="['flex-1 py-2 text-sm font-bold rounded-md transition-colors', authState === 'login' ? 'bg-white shadow text-primary' : 'text-gray-500']">로그인</button>
                            <button @click="authState = 'register'" :class="['flex-1 py-2 text-sm font-bold rounded-md transition-colors', authState === 'register' ? 'bg-white shadow text-primary' : 'text-gray-500']">회원가입 신청</button>
                        </div>
                        <form @submit.prevent="authState === 'login' ? handleLogin() : handleRegister()" class="space-y-4">
                            <div v-if="authState === 'register'">
                                <label class="block text-xs font-semibold text-gray-600 mb-1">이름 (실명)</label>
                                <input type="text" v-model="authForm.name" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-primary outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">이메일 (사내 계정)</label>
                                <input type="email" v-model="authForm.email" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-primary outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">비밀번호</label>
                                <input type="password" v-model="authForm.password" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-primary outline-none">
                            </div>
                            
                            <div class="flex items-center gap-4 py-2 text-sm text-gray-600" v-if="authState === 'login'">
                                <label class="flex items-center gap-1.5 cursor-pointer">
                                    <input type="checkbox" v-model="rememberEmail" class="w-4 h-4 text-primary rounded border-gray-300"> 이메일 저장
                                </label>
                                <label class="flex items-center gap-1.5 cursor-pointer">
                                    <input type="checkbox" v-model="keepLoggedIn" class="w-4 h-4 text-primary rounded border-gray-300"> 로그인 상태 유지
                                </label>
                            </div>

                            <button type="submit" :disabled="isAuthLoading" class="w-full py-3 px-4 bg-primary text-white rounded-lg font-bold shadow-md hover:bg-blue-800 transition-all flex justify-center items-center mt-2">
                                <i v-if="isAuthLoading" class="fa-solid fa-spinner fa-spin mr-2"></i> {{ authState === 'login' ? '로그인' : '가입 신청하기' }}
                            </button>
                        </form>
                    </div>
                </div>
                <div v-else-if="authState === 'pending'" class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 text-center border-t-4 border-amber-500">
                    <div class="w-20 h-20 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6"><i class="fa-solid fa-hourglass-half"></i></div>
                    <h2 class="text-2xl font-bold text-gray-900 mb-3">관리자 승인 대기 중</h2>
                    <p class="text-gray-500 mb-8 text-sm">가입 신청이 완료되었습니다.<br>관리자의 승인 후 및 소속 회사 배정 후 이용하실 수 있습니다.</p>
                    <button @click="handleLogout" class="px-6 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-lg font-medium text-sm">다른 계정으로 로그인</button>
                </div>
            </div>
        </transition>

        <!-- 메인 포털 화면 -->
        <template v-if="authState === 'authenticated'">
            <div v-if="isSidebarOpen" @click="toggleSidebar" class="fixed inset-0 bg-black bg-opacity-50 z-20 md:hidden"></div>

            <aside :class="['fixed md:static inset-y-0 left-0 z-30 w-72 bg-surface border-r border-gray-200 transform transition-transform duration-300 flex flex-col', isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0']">
                <!-- 회사 로고 및 소속 회사 표시 -->
                <div class="flex flex-col px-6 py-4 border-b border-gray-100 flex-shrink-0 bg-gray-50">
                    <div class="flex items-center mb-3">
                        <i class="fa-solid fa-building text-primary text-xl mr-3"></i>
                        <div class="flex flex-col min-w-0">
                            <span class="text-xs text-gray-500 font-bold tracking-wider uppercase">Workspace</span>
                            <span class="text-sm font-black text-gray-900 truncate" :title="currentCompanyName">{{ currentCompanyName || '통합 포털' }}</span>
                        </div>
                    </div>
                    <!-- HYM 공식 홈페이지 링크 버튼 -->
                    <a href="https://www.hyminternational.com/" target="_blank" class="w-full py-2 bg-gray-800 text-white text-xs font-bold rounded-lg text-center shadow-sm hover:bg-gray-700 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-globe"></i> HYM 공식 홈페이지
                    </a>
                </div>

                <div class="overflow-y-auto flex-grow py-4">
                    <!-- 사이드바 메뉴 트리 -->
                    <div v-for="(group, groupIdx) in visibleMenuGroups" :key="group.sectorId" class="mb-6">
                        <!-- 부문명 강조 (파란색 테두리 및 굵은 글씨) -->
                        <div class="bg-gray-100 border-l-4 border-primary px-4 py-2 mb-2 flex items-center justify-between">
                            <h3 class="text-[15px] font-black text-gray-800 tracking-wide">{{ group.sectorName }}</h3>
                            <div v-if="isAdminMode" class="flex gap-1">
                                <button @click="moveCategory(group.sectorId, -1)" class="text-gray-400 hover:text-primary"><i class="fa-solid fa-caret-up"></i></button>
                                <button @click="moveCategory(group.sectorId, 1)" class="text-gray-400 hover:text-primary"><i class="fa-solid fa-caret-down"></i></button>
                                <button @click="openCatModal(group.sectorId, 'edit', group.sectorName)" class="ml-1 text-blue-500 hover:text-blue-700"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button @click="confirmDeleteCategory(group.sectorId, group.sectorName)" class="ml-1 text-red-500 hover:text-red-700"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </div>
                        
                        <ul class="space-y-1 px-3">
                            <li v-for="category in group.categories" :key="category.id">
                                <div :class="['flex items-center w-full rounded-lg transition-colors', activeCategoryId === category.id ? 'bg-blue-50' : 'hover:bg-gray-50']">
                                    <button @click="selectCategory(category)" class="flex-1 flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-left">
                                        <i :class="['w-5 text-center', category.icon || 'fa-solid fa-folder', activeCategoryId === category.id ? 'text-primary' : 'text-gray-400']"></i>
                                        <span :class="activeCategoryId === category.id ? 'text-primary font-bold' : 'text-gray-700'">{{ category.name }}</span>
                                    </button>
                                    <div v-if="isAdminMode" class="flex gap-1 pr-2">
                                        <button @click="moveCategory(category.id, -1)" class="text-gray-300 hover:text-primary"><i class="fa-solid fa-caret-up text-[10px]"></i></button>
                                        <button @click="moveCategory(category.id, 1)" class="text-gray-300 hover:text-primary"><i class="fa-solid fa-caret-down text-[10px]"></i></button>
                                        <button @click="openCatModal(category.id, 'edit', category.name, category.icon)" class="text-blue-400 hover:text-blue-600"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                        <button @click="confirmDeleteCategory(category.id, category.name)" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash text-[10px]"></i></button>
                                    </div>
                                </div>
                            </li>
                            <li v-if="isAdminMode" class="pt-1">
                                <button @click="openCatModal(null, 'add', '', '', group.sectorId)" class="w-full text-left px-3 py-1.5 text-sm text-blue-600 font-medium hover:bg-blue-50 rounded"><i class="fa-solid fa-plus mr-1"></i> 하위 메뉴 추가</button>
                            </li>
                        </ul>
                    </div>
                    
                    <div v-if="isAdminMode" class="px-4 mt-4">
                        <button @click="openCatModal(null, 'add_sector')" class="w-full py-2 bg-gray-100 text-gray-600 font-bold text-sm rounded-lg hover:bg-gray-200 border border-dashed border-gray-300"><i class="fa-solid fa-plus mr-1"></i> 새 부문 만들기</button>
                    </div>
                </div>
                
                <!-- 하단 프로필 영역 -->
                <div class="p-4 border-t border-gray-100 bg-gray-50 flex-shrink-0 flex items-center justify-between">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-9 h-9 rounded-full bg-primary text-white flex items-center justify-center font-bold text-sm">{{ userProfile?.full_name ? userProfile.full_name.substring(0,2) : 'US' }}</div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-medium text-gray-900 truncate">{{ userProfile?.full_name || '사용자' }}</p>
                            <p v-if="userProfile?.role === 'admin'" class="text-[10px] text-red-600 font-bold mt-0.5">최고 관리자</p>
                        </div>
                    </div>
                    <button @click="handleLogout" class="text-gray-400 hover:text-red-500 p-2"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </aside>

            <main class="flex-1 flex flex-col min-w-0 bg-background overflow-hidden relative">
                <!-- 상단 헤더 -->
                <header class="h-16 bg-surface border-b border-gray-200 flex items-center justify-between px-4 sm:px-6 z-10">
                    <div class="flex items-center flex-1 gap-4">
                        <button @click="toggleSidebar" class="md:hidden text-gray-500"><i class="fa-solid fa-bars text-xl"></i></button>
                        
                        <!-- 회사 전환 드롭다운 (관리자 전용) -->
                        <div v-if="userProfile?.role === 'admin'" class="relative flex items-center bg-gray-100 rounded-lg p-1 border border-gray-200">
                            <i class="fa-solid fa-building text-gray-400 ml-2"></i>
                            <select v-model="currentCompanyId" @change="loadData" class="bg-transparent border-none text-sm font-bold text-gray-700 focus:ring-0 py-1 pl-2 pr-8 cursor-pointer outline-none">
                                <option v-for="c in companies" :key="c.id" :value="c.id">{{ c.name }}</option>
                            </select>
                            <!-- 자회사 삭제 버튼 (편집 모드일 때, 본사가 아닐 때만 표시) -->
                            <button v-if="isAdminMode && companies.length > 0 && currentCompanyId !== companies[0].id" @click="confirmDeleteCompany" class="ml-2 w-6 h-6 flex items-center justify-center text-red-500 bg-red-50 hover:bg-red-100 rounded-md shadow-sm" title="현재 자회사 삭제">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2 md:gap-3">
                        <button v-if="selectedItems.length > 0" @click="downloadSelectedZip" class="flex items-center px-3 py-1.5 bg-blue-600 text-white rounded text-xs font-bold shadow-sm">
                            <i class="fa-solid fa-file-zipper mr-1.5"></i> 선택 다운로드 ({{ selectedItems.length }})
                        </button>

                        <!-- 관리자 전용 제어 버튼들 -->
                        <template v-if="userProfile?.role === 'admin'">
                            <button v-if="isAdminMode" @click="openAddCompanyModal" class="hidden md:flex items-center px-3 py-1.5 bg-indigo-100 text-indigo-700 border border-indigo-300 rounded text-xs font-bold hover:bg-indigo-200">
                                <i class="fa-solid fa-sitemap mr-1.5"></i> 자회사 복제(추가)
                            </button>
                            <button v-if="isAdminMode" @click="openUserManagement" class="hidden md:flex items-center px-3 py-1.5 bg-purple-100 text-purple-700 border border-purple-300 rounded text-xs font-bold hover:bg-purple-200">
                                <i class="fa-solid fa-users-gear mr-1.5"></i> 회원 관리
                            </button>

                            <div class="flex items-center gap-2 border-l pl-3 border-gray-200 ml-1">
                                <span class="text-xs font-bold text-gray-600">편집 모드</span>
                                <button @click="toggleAdminMode" :class="['relative inline-flex h-6 w-11 items-center rounded-full transition-colors', isAdminMode ? 'bg-red-500' : 'bg-gray-200']">
                                    <span :class="['inline-block h-4 w-4 transform rounded-full bg-white transition-transform', isAdminMode ? 'translate-x-6' : 'translate-x-1']"></span>
                                </button>
                            </div>
                        </template>
                    </div>
                </header>

                <!-- 본문 컨텐츠 (리스트 및 그리드) -->
                <div class="flex-1 overflow-y-auto p-4 sm:p-8">
                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900 mb-1">{{ activeCategoryName }}</h1>
                            <p class="text-sm text-gray-500">총 {{ filteredItems.length }}개의 항목이 있습니다.</p>
                        </div>
                        <div class="flex bg-gray-100 rounded-lg p-1">
                            <button @click="viewMode = 'list'" :class="['px-3 py-1.5 rounded text-sm', viewMode === 'list' ? 'bg-white shadow text-primary font-bold' : 'text-gray-500']"><i class="fa-solid fa-list"></i></button>
                            <button @click="viewMode = 'grid'" :class="['px-3 py-1.5 rounded text-sm', viewMode === 'grid' ? 'bg-white shadow text-primary font-bold' : 'text-gray-500']"><i class="fa-solid fa-border-all"></i></button>
                        </div>
                    </div>

                    <div v-if="filteredItems.length === 0" class="flex flex-col items-center justify-center py-20 bg-surface rounded-xl border border-gray-200 border-dashed">
                        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-400 text-2xl"><i class="fa-solid fa-folder-open"></i></div>
                        <h3 class="text-lg font-medium text-gray-900 mb-1">등록된 항목이 없습니다</h3>
                        <p v-if="isAdminMode" class="text-sm text-gray-500">우측 하단의 빨간 [+] 버튼을 눌러 추가해 보세요.</p>
                    </div>

                    <!-- 리스트 뷰 -->
                    <div v-else-if="viewMode === 'list'" class="bg-surface rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                        <ul class="divide-y divide-gray-200">
                            <li v-for="item in filteredItems" :key="item.id" class="p-4 hover:bg-gray-50 transition-colors flex items-center justify-between gap-4">
                                <div class="flex items-center gap-4 flex-1 min-w-0">
                                    <input type="checkbox" :value="item.id" v-model="selectedItems" class="w-4 h-4 text-primary rounded border-gray-300">
                                    <div :class="['w-10 h-10 rounded-lg flex items-center justify-center text-lg flex-shrink-0', getIconClass(item.type)]">
                                        <i :class="getIcon(item.type)"></i>
                                    </div>
                                    <div class="min-w-0 flex-1">
                                        <h3 class="text-base font-semibold text-gray-900 truncate">
                                            {{ item.name }} <i v-if="hasFiles(item)" class="fa-solid fa-paperclip text-xs text-blue-500 ml-1"></i>
                                        </h3>
                                        <div class="flex items-center gap-2 mt-0.5">
                                            <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-gray-100 text-gray-600">{{ getTypeName(item.type) }}</span>
                                            <span class="text-xs text-gray-500 truncate" v-if="item.description">{{ item.description.replace(/<[^>]*>?/gm, '').substring(0, 50) }}{{ item.description.length > 50 ? '...' : '' }}</span>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="flex items-center gap-2 flex-shrink-0">
                                    <template v-if="isAdminMode">
                                        <div class="flex flex-col mr-1">
                                            <button @click.stop="moveItem(item, -1)" class="text-gray-400 hover:text-primary"><i class="fa-solid fa-caret-up text-xs"></i></button>
                                            <button @click.stop="moveItem(item, 1)" class="text-gray-400 hover:text-primary"><i class="fa-solid fa-caret-down text-xs"></i></button>
                                        </div>
                                        <button @click.stop="openEditModal(item)" class="w-8 h-8 flex items-center justify-center text-blue-500 hover:bg-blue-50 rounded"><i class="fa-solid fa-pen"></i></button>
                                        <button @click.stop="confirmDelete(item)" class="w-8 h-8 flex items-center justify-center text-red-500 hover:bg-red-50 rounded mr-2"><i class="fa-solid fa-trash"></i></button>
                                    </template>
                                    
                                    <div class="flex gap-2">
                                        <button v-if="item.type === 'proxy_form'" class="w-[110px] py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs font-bold text-gray-700 hover:bg-gray-100 flex items-center justify-center gap-1.5"><i class="fa-solid fa-id-card text-blue-500"></i> 신분증 사본</button>
                                        <button @click="handleAction(item)" class="w-[110px] py-2 bg-white border border-gray-200 rounded-lg text-xs font-bold text-gray-700 hover:bg-gray-50 hover:text-primary hover:border-primary flex items-center justify-center gap-1.5 shadow-sm transition-colors">
                                            <i :class="getActionIcon(item.type)"></i> {{ getActionText(item.type, item) }}
                                        </button>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>

                    <!-- 그리드 뷰 -->
                    <div v-else class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
                        <div v-for="item in filteredItems" :key="item.id" :class="['bg-surface border-2 rounded-xl p-5 hover:shadow-md transition-all relative flex flex-col', getTypeBorderClass(item.type)]">
                            <div class="absolute top-3 left-3">
                                <input type="checkbox" :value="item.id" v-model="selectedItems" class="w-4 h-4 text-primary rounded border-gray-300">
                            </div>
                            <div v-if="isAdminMode" class="absolute top-2 right-2 flex gap-1 bg-white/90 rounded px-1 z-10">
                                <button @click.stop="moveItem(item, -1)" class="p-1 text-gray-400 hover:text-primary"><i class="fa-solid fa-caret-left"></i></button>
                                <button @click.stop="moveItem(item, 1)" class="p-1 text-gray-400 hover:text-primary"><i class="fa-solid fa-caret-right"></i></button>
                                <button @click.stop="openEditModal(item)" class="p-1 text-blue-500 hover:bg-blue-50 rounded"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button @click.stop="confirmDelete(item)" class="p-1 text-red-500 hover:bg-red-50 rounded"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                            
                            <div :class="['w-12 h-12 rounded-lg flex items-center justify-center text-xl mb-3 mt-2', getIconClass(item.type)]">
                                <i :class="getIcon(item.type)"></i>
                            </div>

                    </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">항목명</label>

                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">유형</label>
                            <select v-model="modalForm.type" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-primary outline-none">

                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">설명 / 내용</label>
                            <textarea v-model="modalForm.description" rows="5" placeholder="내용을 입력하세요. (HTML 태그 지원: <h1>, <b>, <a> 등)" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-primary outline-none"></textarea>
                        </div>
                        
                        <!-- 파일 업로드 영역 -->
                        <div v-if="['download', 'document', 'notice'].includes(modalForm.type)" class="pt-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">파일 첨부</label>
                            <div @dragover.prevent="dragActive = true" @dragleave.prevent="dragActive = false" @drop.prevent="handleDrop" :class="['border-2 border-dashed rounded-lg p-6 flex flex-col items-center justify-center cursor-pointer', dragActive ? 'border-primary bg-blue-50' : 'border-gray-300 hover:bg-gray-50']" @click="$refs.fileInput.click()">
                                <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 mb-2"></i>
                                <p class="text-sm text-gray-600">클릭 또는 파일 드래그 앤 드롭</p>
                                <input type="file" ref="fileInput" @change="handleFileSelect" multiple class="hidden">
                            </div>

                            <ul v-if="modalForm.files && modalForm.files.length > 0" class="space-y-2 mt-3">
                                <li v-for="(file, idx) in modalForm.files" :key="idx" class="flex items-center p-2 bg-gray-50 border border-gray-200 rounded-lg gap-2">
                                    <div class="flex flex-col gap-0.5">
                                        <button @click.prevent="moveFile(idx, -1)" class="text-[10px] text-gray-400 hover:text-primary px-1"><i class="fa-solid fa-caret-up"></i></button>
                                        <button @click.prevent="moveFile(idx, 1)" class="text-[10px] text-gray-400 hover:text-primary px-1"><i class="fa-solid fa-caret-down"></i></button>

                                    <i class="fa-solid fa-file text-gray-400"></i>
                                    <input type="text" v-model="file.name" class="flex-1 px-2 py-1 text-sm border border-gray-300 rounded focus:border-primary" placeholder="표시될 파일명 수정 가능">
                                    <button @click.prevent="removeFile(idx)" class="text-red-400 hover:text-red-600 p-1"><i class="fa-solid fa-xmark"></i></button>
                                </li>
                            </ul>
                        </div>
                        
                        <div v-if="['system', 'link'].includes(modalForm.type)">
                            <label class="block text-sm font-medium text-gray-700 mb-1">연결 주소(URL)</label>
                            <input type="text" v-model="modalForm.file_path" placeholder="https://" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-primary outline-none">
                        </div>
                    </div>
                    
                    <div class="mt-6 flex justify-end gap-2">
                        <button @click="closeModal" class="px-5 py-2.5 text-sm font-medium bg-gray-100 rounded-lg">취소</button>
                        <button @click="saveItem" :disabled="isUploading" class="px-5 py-2.5 text-sm font-bold text-white bg-primary rounded-lg flex items-center">
                            <i v-if="isUploading" class="fa-solid fa-spinner fa-spin mr-2"></i> {{ isUploading ? '저장 중...' : '저장하기' }}
                        </button>
                    </div>
                </div>
            </div>

            <!-- 자회사 추가 모달 -->
            <div v-if="showCompanyModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 relative">
                    <h3 class="text-lg font-bold text-gray-900 mb-2">새 자회사(워크스페이스) 생성</h3>
                    <p class="text-xs text-gray-500 mb-4">새 회사를 만들면 본사의 전체 메뉴 구조가 자동으로 복사(Clone)되어 기본 세팅됩니다. (첨부파일 및 링크는 비워짐)</p>
                    <input type="text" v-model="newCompanyName" placeholder="자회사 이름 (예: 주식회사 다윗)" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-primary outline-none mb-6">
                    <div class="flex justify-end gap-2">
                        <button @click="showCompanyModal = false" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">취소</button>

                </div>

                    <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-xl mx-auto mb-4"><i class="fa-solid fa-building-circle-xmark"></i></div>
                    <h3 class="text-lg font-bold text-gray-900 mb-2">자회사 삭제 확인</h3>
                    <p class="text-sm text-gray-700 mb-2">정말로 <strong>{{ currentCompanyName }}</strong>을(를) 삭제하시겠습니까?</p>
                    <p class="text-[11px] text-red-500 mb-6 font-bold bg-red-50 p-2 rounded">※ 소속된 모든 메뉴와 파일이 즉시 영구 삭제되며 복구할 수 없습니다! (소속 회원들은 미배정 상태로 변경됩니다.)</p>
                    <div class="flex justify-center gap-2">
                        <button @click="showDeleteCompanyModal = false" class="px-4 py-2 text-sm bg-gray-100 rounded-lg w-full">취소</button>
                        <button @click="executeDeleteCompany" :disabled="isDeletingCompany" class="px-4 py-2 text-sm text-white bg-red-600 rounded-lg w-full font-bold flex justify-center items-center">
                            <i v-if="isDeletingCompany" class="fa-solid fa-spinner fa-spin mr-2"></i> {{ isDeletingCompany ? '삭제 중...' : '삭제하기' }}
                        </button>
                    </div>
                </div>
            </div>

                <div class="bg-white rounded-xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden">
                    <div class="flex justify-between items-center p-5 border-b bg-gray-50">

                        <button @click="showUserModal = false" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>
                    
                    <div class="flex flex-1 overflow-hidden">
                        <!-- 좌측 회원 리스트 -->

                            <ul class="divide-y divide-gray-100">
                                <li v-for="user in usersList" :key="user.id" @click="selectUserForEdit(user)" :class="['p-4 cursor-pointer hover:bg-blue-50 transition-colors', editingUser?.id === user.id ? 'bg-blue-50 border-l-4 border-primary' : '']">
                                    <div class="flex justify-between items-start mb-1">
                                        <span class="font-bold text-sm text-gray-900">{{ user.full_name }}</span>
                                        <span v-if="user.status === 'pending'" class="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-bold">승인대기</span>
                                        <span v-else-if="user.role === 'admin'" class="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded font-bold">Admin</span>
                                    </div>
                                    <p class="text-xs text-gray-500 truncate">{{ user.email }}</p>
                                    <p class="text-[10px] text-gray-400 mt-1"><i class="fa-solid fa-building mr-1"></i>{{ getCompanyName(user.company_id) || '미배정' }}</p>
                                </li>
                            </ul>
                        </div>
                        
                        <!-- 우측 편집 패널 -->
                        <div class="w-2/3 flex flex-col bg-gray-50 relative" v-if="editingUser">

                                <h4 class="text-lg font-bold text-gray-900">{{ editingUser.full_name }} 님의 설정</h4>
                                <div class="flex gap-2">
                                    <button @click="updateUserStatus('approved')" v-if="editingUser.status === 'pending'" class="px-3 py-1.5 bg-emerald-500 text-white text-xs font-bold rounded">가입 승인</button>

                                </div>
                            </div>
                            
                            <!-- 탭 메뉴 -->
                            <div class="px-6 border-b border-gray-200 flex gap-4">
                                <button @click="adminUserTab = 'auth'" :class="['pb-2 text-sm font-bold border-b-2', adminUserTab === 'auth' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700']">권한 설정</button>
                                <button @click="adminUserTab = 'card'" :class="['pb-2 text-sm font-bold border-b-2', adminUserTab === 'card' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700']">명함 관리</button>
                            </div>

                            <div class="p-6 overflow-y-auto flex-1">
                                <!-- 탭 1: 권한 설정 -->
                                <div v-if="adminUserTab === 'auth'" class="space-y-5 bg-white p-5 rounded-lg border border-gray-200 shadow-sm relative">
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-bold text-gray-600 mb-1">계정 권한 (Role)</label>
                                            <select v-model="editingUser.role" class="w-full px-3 py-2 border border-gray-300 rounded text-sm bg-gray-50">
                                                <option value="user">일반 사용자</option>
                                                <option value="admin">최고 관리자</option>
                                            </select>

                                        <div>
                                            <label class="block text-xs font-bold text-gray-600 mb-1">소속 회사 (Workspace)</label>

                                            <i class="fa-solid fa-crown text-3xl text-amber-400 mb-2"></i>
                                            <p class="font-bold text-gray-800">최고 관리자 계정입니다.</p>
                                            <p class="text-xs text-gray-500 mt-1">최고 관리자는 모든 회사의 모든 메뉴 접근 권한을 가집니다.</p>

                                        <label class="block text-sm font-bold text-gray-800 mb-3"><i class="fa-solid fa-lock text-gray-400 mr-1"></i> 세부 메뉴별 접근 권한 설정</label>

                                        <div v-else class="space-y-3">
                                            <div v-for="group in menuGroupsForEditingUser" :key="group.sectorId" class="border border-gray-200 rounded-lg overflow-hidden">
                                                <label class="flex items-center p-3 bg-gray-50 border-b border-gray-200 cursor-pointer hover:bg-gray-100">
                                                    <input type="checkbox" v-model="editingUser.allowed_menus" :value="group.sectorId" class="w-4 h-4 text-primary rounded border-gray-300 mr-3">
                                                    <span class="text-sm font-black text-gray-800">{{ group.sectorName }}</span>
                                                </label>
                                                <div class="p-3 bg-white grid grid-cols-2 gap-2">
                                                    <label v-for="cat in group.categories" :key="cat.id" class="flex items-center cursor-pointer hover:bg-blue-50 p-1.5 rounded">
                                                        <input type="checkbox" v-model="editingUser.allowed_menus" :value="cat.id" class="w-3.5 h-3.5 text-secondary rounded border-gray-300 mr-2">
                                                        <span class="text-xs font-medium text-gray-700">{{ cat.name }}</span>
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="flex justify-end pt-4">
                                        <button @click="saveUserPermissions" class="px-6 py-2 bg-primary text-white text-sm font-bold rounded-lg shadow">변경사항 저장</button>
                                    </div>
                                </div>

                                        <i class="fa-solid fa-circle-info mr-1"></i> <strong>관리자 명함 세팅 가이드</strong><br>
                                        아래에 해당 회원의 명함 이미지를 등록해 두면, 일반 회원이 '내 명함' 메뉴를 클릭했을 때 본인의 명함만 보게 됩니다.<br>
                                        ※ 회색 영역을 클릭하거나 이미지를 <kbd class="px-1 py-0.5 bg-white border border-gray-300 rounded font-mono">드래그 앤 드롭</kbd>, 또는 클릭 후 <kbd class="px-1 py-0.5 bg-white border border-gray-300 rounded font-mono">Ctrl+V</kbd>로 즉시 붙여넣을 수 있습니다.
                                    </div>
                                    <div class="grid grid-cols-2 gap-6">
                                        <!-- 앞면 드롭존 -->

                                            <h5 class="text-sm font-bold text-gray-700 text-center">앞면</h5>

                                                    <i class="fa-solid fa-id-card-clip text-3xl text-gray-400 mb-2"></i>

                                            <button v-if="adminCardData.back" @click.stop="adminCardData.back = null; adminCardFiles.back = null;" class="text-xs text-red-500 hover:underline text-center">이미지 삭제</button>

                                    </div>
                                    
                                    <div class="flex justify-end pt-4 border-t border-gray-100">
                                        <button @click="saveAdminBusinessCard" :disabled="isAdminCardUploading" class="px-6 py-2 bg-primary text-white text-sm font-bold rounded-lg shadow flex items-center">
                                            <i v-if="isAdminCardUploading" class="fa-solid fa-spinner fa-spin mr-2"></i> {{ isAdminCardUploading ? '저장 중...' : '명함 이미지 저장' }}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div v-else class="w-2/3 flex items-center justify-center text-gray-400 bg-gray-50">

                    </div>
                </div>

                        <button @click="showPreviewModal = false" class="text-gray-400 hover:text-gray-600 bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>

                    </div>

                    <div class="p-6 bg-gray-100 flex flex-col gap-6 overflow-y-auto max-h-[70vh]">
                        <!-- 앞면 뷰어 -->
                        <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">

                        <!-- 뒷면 뷰어 -->

            <!-- 카테고리 추가/수정 모달 등 기존 모달 축소 포함 -->
            <div v-if="showCatModal" class="fixed inset-0 bg-black bg-opacity-50 z-[120] flex items-center justify-center p-4">
                <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6">

                    <div class="flex justify-end gap-2">
                        <button @click="showCatModal = false" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">취소</button>
                        <button @click="saveCategory" class="px-4 py-2 bg-primary text-white rounded-lg text-sm font-bold">저장</button>
                    </div>
                </div>
            </div>
            
            <div v-if="showDeleteModal" class="fixed inset-0 bg-black bg-opacity-50 z-[120] flex items-center justify-center p-4">
                <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 text-center">
                    <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-xl mx-auto mb-4"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    <h3 class="text-lg font-bold text-gray-900 mb-2">삭제 확인</h3>
                    <p class="text-sm text-gray-500 mb-6">정말로 삭제하시겠습니까?</p>
                    <div class="flex justify-center gap-2">
                        <button @click="showDeleteModal = false" class="px-4 py-2 text-sm bg-gray-100 rounded-lg w-full">취소</button>
                        <button @click="executeDelete" class="px-4 py-2 text-sm text-white bg-red-600 rounded-lg w-full font-bold">삭제하기</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- 알림 토스트 -->
        <div v-if="toast.show" class="fixed bottom-4 right-4 z-[200] flex items-center p-4 rounded-lg shadow-lg text-white max-w-md transition-opacity" :class="toast.type === 'error' ? 'bg-red-500' : 'bg-gray-800'">
            <i :class="['mr-3', toast.type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check']"></i>
            <div class="flex flex-col">
                <span class="text-sm font-bold">{{ toast.message }}</span>
                <span v-if="toast.subMessage" class="text-[10px] text-gray-200 mt-1 break-all bg-black/20 p-1 rounded">{{ toast.subMessage }}</span>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const supabaseUrl = 'https://zpzaiuqcoltshtsrllxx.supabase.co';
                const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwemFpdXFjb2x0c2h0c3JsbHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNjA4MTcsImV4cCI6MjEwMTczNjgxN30.zWiMJ0RDpSZlWaSBKcO1X3HvF-NBLw2YTqH6sjfRbME';
                const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

                const authState = ref('loading');
                const authForm = ref({ email: '', password: '', name: '' });
                const userProfile = ref(null);
                const isAuthLoading = ref(false);
                const rememberEmail = ref(false);
                const keepLoggedIn = ref(true);
                
                const companies = ref([]);
                const currentCompanyId = ref('');
                
                const isAdminMode = ref(false);
                const isSidebarOpen = ref(false);
                const viewMode = ref('list');
                const menuGroups = ref([]);
                const activeCategoryId = ref('');
                
                const toast = ref({ show: false, message: '', subMessage: '', type: 'success' });
                const showToast = (msg, type = 'success', sub = '') => {
                    toast.value = { show: true, message: msg, subMessage: sub, type };
                    setTimeout(() => { toast.value.show = false; }, 4000);
                };

                // 1. 인증 및 로그인 로직
                const checkSession = async () => {
                    const savedEmail = localStorage.getItem('savedEmail');
                    if (savedEmail) { authForm.value.email = savedEmail; rememberEmail.value = true; }

                    const isKeepLoggedIn = localStorage.getItem('keepLoggedIn') !== 'false';
                    const hasTempSession = sessionStorage.getItem('tempSession') === 'true';

                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        if (!isKeepLoggedIn && !hasTempSession) {
                            await supabase.auth.signOut();
                            authState.value = 'login';
                        } else {
                            sessionStorage.setItem('tempSession', 'true');
                            await fetchUserProfile(session.user.id);
                        }
                    } else {
                        authState.value = 'login';
                    }
                };

                const fetchUserProfile = async (userId) => {
                    try {
                        const { data, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
                        if (error) throw error;
                        userProfile.value = data;
                        if (data.status === 'pending') authState.value = 'pending';
                        else if (data.status === 'approved') { authState.value = 'authenticated'; await loadCompanies(); }
                    } catch (e) {
                        userProfile.value = { id: userId, full_name: '관리자', role: 'admin', status: 'approved' };
                        authState.value = 'authenticated'; await loadCompanies();
                    }
                };

                const handleLogin = async () => {
                    isAuthLoading.value = true;
                    try {
                        const { data, error } = await supabase.auth.signInWithPassword({ email: authForm.value.email, password: authForm.value.password });
                        if (error) throw error;
                        
                        if (rememberEmail.value) localStorage.setItem('savedEmail', authForm.value.email);
                        else localStorage.removeItem('savedEmail');
                        
                        localStorage.setItem('keepLoggedIn', keepLoggedIn.value);
                        sessionStorage.setItem('tempSession', 'true');
                        
                        await fetchUserProfile(data.user.id);
                    } catch(e) { showToast('로그인 실패: 이메일과 비밀번호를 확인하세요.', 'error', e.message); }
                    finally { isAuthLoading.value = false; }
                };

                const handleRegister = async () => {
                    isAuthLoading.value = true;
                    try {
                        const { data, error } = await supabase.auth.signUp({ email: authForm.value.email, password: authForm.value.password });
                        if (error) throw error;
                        if (data.user) {
                            await supabase.from('profiles').upsert({ id: data.user.id, email: authForm.value.email, full_name: authForm.value.name, role: 'user', status: 'pending' });
                            authState.value = 'pending';
                        }
                    } catch(e) { showToast('회원가입 실패', 'error', e.message); }
                    finally { isAuthLoading.value = false; }
                };

                const handleLogout = async () => {
                    await supabase.auth.signOut();
                    sessionStorage.removeItem('tempSession');
                    location.reload();
                };

                // 2. 회사 관리 로직
                const loadCompanies = async () => {
                    const { data } = await supabase.from('companies').select('*').order('created_at');
                    companies.value = data || [];
                    if (companies.value.length > 0) {
                        if (userProfile.value.role !== 'admin' && userProfile.value.company_id) currentCompanyId.value = userProfile.value.company_id;
                        else if (!currentCompanyId.value) currentCompanyId.value = companies.value[0].id;
                        await loadData();
                    }
                };
                const currentCompanyName = computed(() => { const comp = companies.value.find(c => c.id === currentCompanyId.value); return comp ? comp.name : ''; });

                const showCompanyModal = ref(false); const newCompanyName = ref(''); const isCloning = ref(false);
                const openAddCompanyModal = () => { newCompanyName.value = ''; showCompanyModal.value = true; };
                const executeAddCompany = async () => {
                    if(!newCompanyName.value) return; isCloning.value = true;
                    try {
                        const { data: newComp, error: compErr } = await supabase.from('companies').insert({name: newCompanyName.value}).select().single();
                        if (compErr) throw compErr;
                        const templateId = companies.value[0].id; 
                        const { data: oldCats } = await supabase.from('categories').select('*').eq('company_id', templateId);
                        const { data: oldItems } = await supabase.from('items').select('*');
                        
                        let idMap = {};
                        const sectors = oldCats.filter(c => !c.parent_id);
                        for (let sec of sectors) {
                            const { data: nSec } = await supabase.from('categories').insert({name: sec.name, icon: sec.icon, sort_order: sec.sort_order, company_id: newComp.id}).select().single();
                            idMap[sec.id] = nSec.id;
                            const subs = oldCats.filter(c => c.parent_id === sec.id);
                            for (let sub of subs) {
                                const { data: nSub } = await supabase.from('categories').insert({name: sub.name, icon: sub.icon, sort_order: sub.sort_order, company_id: newComp.id, parent_id: nSec.id}).select().single();
                                idMap[sub.id] = nSub.id;
                            }
                        }
                        const itemsToClone = oldItems.filter(i => idMap[i.category_id]).map(i => ({
                            category_id: idMap[i.category_id], name: i.name, type: i.type, description: i.description, 
                            file_path: null, sort_order: i.sort_order
                        }));
                        if (itemsToClone.length > 0) await supabase.from('items').insert(itemsToClone);
                        showToast(`자회사 '${newCompanyName.value}' 구성 완료!`); showCompanyModal.value = false; await loadCompanies();
                    } catch(e) { showToast('자회사 생성 실패', 'error', e.message); } finally { isCloning.value = false; }
                };

                const showDeleteCompanyModal = ref(false); const isDeletingCompany = ref(false);
                const executeDeleteCompany = async () => {
                    isDeletingCompany.value = true;
                    try {
                        await supabase.from('profiles').update({ company_id: null }).eq('company_id', currentCompanyId.value);
                        const { error } = await supabase.from('companies').delete().eq('id', currentCompanyId.value);
                        if (error) throw error;
                        showToast(`자회사가 삭제되었습니다.`); showDeleteCompanyModal.value = false;
                        currentCompanyId.value = companies.value[0].id; await loadCompanies();
                    } catch(e) { showToast('삭제 실패', 'error', e.message); } finally { isDeletingCompany.value = false; }
                };

                // 3. 데이터 로딩 및 권한 기반 필터링
                const loadData = async () => {
                    try {
                        const { data: cats } = await supabase.from('categories').select('*').eq('company_id', currentCompanyId.value).order('sort_order', {ascending: true});
                        const { data: itms } = await supabase.from('items').select('*').order('sort_order', {ascending: true});
                        const built = [];
                        const sectors = (cats||[]).filter(c => !c.parent_id).sort((a,b) => a.sort_order - b.sort_order);
                        for (const sector of sectors) {
                            const group = { sectorName: sector.name, sectorId: sector.id, categories: [] };
                            const subCats = cats.filter(c => c.parent_id === sector.id).sort((a,b) => a.sort_order - b.sort_order);
                            for (const cat of subCats) group.categories.push({ id: cat.id, name: cat.name, icon: cat.icon, items: itms.filter(i => i.category_id === cat.id) });
                            built.push(group);
                        }
                        menuGroups.value = built;
                        if (built.length > 0 && built[0].categories.length > 0) activeCategoryId.value = built[0].categories[0].id;
                    } catch(e) { console.error(e); }
                };

                const visibleMenuGroups = computed(() => {
                    if (userProfile.value?.role === 'admin') return menuGroups.value;
                    const allowed = userProfile.value?.allowed_menus || [];
                    if (allowed.length === 0) return menuGroups.value; 
                    return menuGroups.value.map(group => {
                        const isSectorChecked = allowed.includes(group.sectorId);
                        const checkedSubCats = group.categories.filter(cat => allowed.includes(cat.id));
                        if (isSectorChecked || checkedSubCats.length > 0) {
                            if (checkedSubCats.length > 0) return { ...group, categories: checkedSubCats };
                            return group;
                        }
                        return null;
                    }).filter(group => group !== null && group.categories.length > 0);
                });

                // 4. 회원 권한 및 [명함 등록] (Admin 전용)
                const showUserModal = ref(false);
                const usersList = ref([]);
                const editingUser = ref(null);
                const menuGroupsForEditingUser = ref([]);
                const adminUserTab = ref('auth'); // auth, card
                
                // 관리자용 명함 세팅 변수
                const adminCardData = ref({ front: null, back: null });
                const adminCardFiles = ref({ front: null, back: null });
                const isAdminCardUploading = ref(false);
                const dragStates = ref({ adminFront: false, adminBack: false });

                const openUserManagement = async () => {
                    const { data } = await supabase.from('profiles').select('*').order('created_at', {ascending: false});
                    usersList.value = data || []; showUserModal.value = true;
                };

                const refreshMenuGroupsForUser = async () => {
                    if (!editingUser.value || !editingUser.value.company_id) { menuGroupsForEditingUser.value = []; return; }
                    const { data: cats } = await supabase.from('categories').select('*').eq('company_id', editingUser.value.company_id).order('sort_order');
                    const built = [];
                    const sectors = (cats||[]).filter(c => !c.parent_id).sort((a,b) => a.sort_order - b.sort_order);
                    for (const sector of sectors) {
                        const group = { sectorName: sector.name, sectorId: sector.id, categories: [] };
                        const subCats = cats.filter(c => c.parent_id === sector.id).sort((a,b) => a.sort_order - b.sort_order);
                        for (const cat of subCats) group.categories.push({ id: cat.id, name: cat.name });
                        built.push(group);
                    }
                    menuGroupsForEditingUser.value = built;
                };

                const selectUserForEdit = async (user) => {
                    editingUser.value = JSON.parse(JSON.stringify(user));
                    if (!editingUser.value.allowed_menus) editingUser.value.allowed_menus = [];
                    await refreshMenuGroupsForUser();
                    
                    // 명함 데이터 로드
                    const cardData = editingUser.value.business_card_data || { front: null, back: null };
                    adminCardData.value = { ...cardData };
                    adminCardFiles.value = { front: null, back: null };
                };

                const updateUserStatus = async (status) => {
                    try {
                        await supabase.from('profiles').update({ status }).eq('id', editingUser.value.id);
                        showToast(`상태 변경 완료`); openUserManagement(); editingUser.value.status = status;
                    } catch(e) { showToast('변경 실패', 'error', e.message); }
                };

                const saveUserPermissions = async () => {
                    try {
                        const payload = { role: editingUser.value.role, company_id: editingUser.value.company_id, allowed_menus: editingUser.value.allowed_menus };
                        await supabase.from('profiles').update(payload).eq('id', editingUser.value.id);
                        showToast(`${editingUser.value.full_name} 님의 권한 저장 완료`); openUserManagement();
                    } catch(e) { showToast('저장 실패', 'error', e.message); }
                };

                const getCompanyName = (id) => { const c = companies.value.find(x => x.id === id); return c ? c.name : ''; };

                // 드래그앤드롭 / 붙여넣기 / 파일선택 공통 핸들러
                const processCardImage = (file, side, isAdmin) => {
                    if (file && file.type.startsWith('image/')) {
                        if (isAdmin) {
                            adminCardFiles.value[side] = file;
                            adminCardData.value[side] = URL.createObjectURL(file);
                        }
                    }
                };

                const handleCardFileSelect = (e, side, isAdmin = false) => { processCardImage(e.target.files[0], side, isAdmin); };
                const handleCardDrop = (e, side, isAdmin = false) => { dragStates.value[`admin${side.charAt(0).toUpperCase() + side.slice(1)}`] = false; processCardImage(e.dataTransfer.files[0], side, isAdmin); };
                const handleCardPaste = (e, side, isAdmin = false) => {
                    const items = e.clipboardData.items;
                    for (let i = 0; i < items.length; i++) {
                        if (items[i].type.indexOf('image') !== -1) { processCardImage(items[i].getAsFile(), side, isAdmin); break; }
                    }
                };

                const saveAdminBusinessCard = async () => {
                    isAdminCardUploading.value = true;
                    try {
                        const finalData = { ...adminCardData.value };
                        for (const side of ['front', 'back']) {
                            if (adminCardFiles.value[side]) {
                                const file = adminCardFiles.value[side];
                                const extMatch = file.name.match(/\.[^.]+$/);
                                const safeName = `card_${editingUser.value.id}_${side}_${Date.now()}${extMatch ? extMatch[0] : '.png'}`;
                                const { error } = await supabase.storage.from('documents').upload(safeName, file);
                                if (error) throw error;
                                const { data: urlData } = supabase.storage.from('documents').getPublicUrl(safeName);
                                finalData[side] = urlData.publicUrl;
                            }
                        }
                        await supabase.from('profiles').update({ business_card_data: finalData }).eq('id', editingUser.value.id);
                        showToast(`${editingUser.value.full_name} 님의 명함 이미지 저장 완료`);
                    } catch (err) { showToast('저장 실패', 'error', err.message); } finally { isAdminCardUploading.value = false; }
                };

                // 5. 일반 파일 및 카테고리 관리 기능들
                const selectedItems = ref([]);
                const filteredItems = computed(() => {
                    let activeCat = null;
                    for (const group of menuGroups.value) { for (const cat of group.categories) { if (cat.id === activeCategoryId.value) { activeCat = cat; break; } } }
                    return activeCat ? activeCat.items : [];
                });
                const activeCategoryName = computed(() => {
                    for (const group of menuGroups.value) { for (const cat of group.categories) { if (cat.id === activeCategoryId.value) return `${group.sectorName} > ${cat.name}`; } } return '';
                });

                const showItemModal = ref(false); const isEditing = ref(false); const isUploading = ref(false); const dragActive = ref(false);
                const modalForm = ref({ id: '', name: '', type: 'download', description: '', files: [], file_path: '' });
                
                const handleFileSelect = (e) => { const files = e.target.files; if(!files) return; for(let i=0; i<files.length; i++) modalForm.value.files.push({ fileObj: files[i], name: files[i].name, isNew: true }); dragActive.value = false; };
                const handleDrop = (e) => { dragActive.value = false; const files = e.dataTransfer.files; if(!files) return; for(let i=0; i<files.length; i++) modalForm.value.files.push({ fileObj: files[i], name: files[i].name, isNew: true }); };
                const removeFile = (idx) => modalForm.value.files.splice(idx, 1);
                const moveFile = (idx, direction) => {
                    if (idx + direction < 0 || idx + direction >= modalForm.value.files.length) return;
                    const temp = modalForm.value.files[idx]; modalForm.value.files[idx] = modalForm.value.files[idx + direction]; modalForm.value.files[idx + direction] = temp;
                };

                const saveItem = async () => {
                    isUploading.value = true;
                    try {
                        let finalFiles = [];
                        if (['download', 'document', 'notice'].includes(modalForm.value.type)) {
                            for (let fData of modalForm.value.files) {
                                if (fData.isNew) {
                                    const extMatch = fData.fileObj.name.match(/\.[^.]+$/);
                                    const safeName = `file_${Date.now()}_${Math.random().toString(36).substring(2, 9)}${extMatch ? extMatch[0] : ''}`;
                                    const { error } = await supabase.storage.from('documents').upload(safeName, fData.fileObj);
                                    if (error) throw error;
                                    const { data: urlData } = supabase.storage.from('documents').getPublicUrl(safeName);
                                    finalFiles.push({ name: fData.name, url: urlData.publicUrl });
                                } else finalFiles.push(fData);
                            }
                        }
                        const payload = { name: modalForm.value.name, type: modalForm.value.type, description: modalForm.value.description, file_path: finalFiles.length > 0 ? JSON.stringify(finalFiles) : modalForm.value.file_path };
                        if (isEditing.value) await supabase.from('items').update(payload).eq('id', modalForm.value.id);
                        else { payload.category_id = activeCategoryId.value; await supabase.from('items').insert(payload); }
                        await loadData(); showItemModal.value = false; showToast('저장되었습니다.');
                    } catch(e) { showToast('저장 실패', 'error', e.message); } finally { isUploading.value = false; }
                };

                const moveItem = async (item, direction) => {
                    try {
                        const items = filteredItems.value; const idx = items.findIndex(i => i.id === item.id);
                        if (idx < 0 || (direction === -1 && idx === 0) || (direction === 1 && idx === items.length - 1)) return;
                        const swapTarget = items[idx + direction];
                        await Promise.all([ supabase.from('items').update({sort_order: swapTarget.sort_order||0}).eq('id', item.id), supabase.from('items').update({sort_order: item.sort_order||0}).eq('id', swapTarget.id) ]);
                        await loadData();
                    } catch(e) { showToast('순서 변경 실패', 'error'); }
                };

                const moveCategory = async (id, direction) => {
                    try {
                        const { data: cats } = await supabase.from('categories').select('*').eq('company_id', currentCompanyId.value).order('sort_order');
                        const target = cats.find(c => c.id === id); if(!target) return;
                        const siblings = cats.filter(c => c.parent_id === target.parent_id).sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
                        const idx = siblings.findIndex(c => c.id === id);
                        if (idx < 0 || (direction === -1 && idx === 0) || (direction === 1 && idx === siblings.length - 1)) return;
                        const swapTarget = siblings[idx + direction];
                        await Promise.all([ supabase.from('categories').update({sort_order: swapTarget.sort_order}).eq('id', target.id), supabase.from('categories').update({sort_order: target.sort_order}).eq('id', swapTarget.id) ]);
                        await loadData();
                    } catch(e) { showToast('순서 변경 실패', 'error'); }
                };

                // 6. 명함 캡처 후 자동 공유 및 뷰어 로직
                const showBusinessCardModal = ref(false);
                const businessCardData = ref({ front: null, back: null });

                const handleAction = (item) => {
                    if (item.type === 'my_business_card') {
                        // 로그인된 유저의 프로필(DB)에서 명함 정보를 가져와 띄움
                        businessCardData.value = userProfile.value?.business_card_data || { front: null, back: null };
                        showBusinessCardModal.value = true;
                    } else if (['download', 'document', 'notice'].includes(item.type)) {
                        previewItem.value = item; previewFiles.value = hasFiles(item) ? JSON.parse(item.file_path) : []; showPreviewModal.value = true;
                    } else if (item.file_path) {
                        window.open(item.file_path, '_blank');
                    } else showToast('링크 주소가 비어있습니다.', 'error');
                };

                // html2canvas 활용 화면 캡처 및 클립보드(Ctrl+V) 복사 + 공유
                const captureAndShare = async (side) => {
                    const elId = `card-render-target-${side}`;
                    const targetEl = document.getElementById(elId);
                    if (!targetEl) return;

                    showToast('명함을 복사하는 중입니다...', 'success');
                    try {
                        // DOM을 캡처하여 Canvas로 변환 (화질 2배 적용)
                        const canvas = await html2canvas(targetEl, { useCORS: true, backgroundColor: null, scale: 2 });
                        canvas.toBlob(async (blob) => {
                            let clipboardSuccess = false;
                            
                            // 1. 클립보드에 이미지 복사 시도 (카카오톡, 슬랙 등 Ctrl+V 용도)
                            try {
                                const item = new ClipboardItem({ 'image/png': blob });
                                await navigator.clipboard.write([item]);
                                clipboardSuccess = true;
                                showToast('명함 이미지가 복사되었습니다! 채팅창에 Ctrl+V(붙여넣기) 하세요.', 'success');
                            } catch (clipErr) {
                                console.warn('클립보드 복사 실패 (브라우저/iFrame 보안 제한):', clipErr);
                            }

                            // 2. 모바일 스마트 기기 자체 '공유하기' 기능 연동
                            const file = new File([blob], `my_business_card_${side}.png`, { type: 'image/png' });
                            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                                try {
                                    await navigator.share({ title: '내 명함', text: '명함을 공유합니다.', files: [file] });
                                    return; // 스마트 기기 공유 성공 시 종료
                                } catch(e) { console.log('공유 취소됨'); }
                            } 
                            
                            // 3. 클립보드 복사도 실패하고 모바일 공유도 안되는 환경일 경우 자동 다운로드 폴백
                            if (!clipboardSuccess) {
                                saveAs(blob, `my_business_card_${side}.png`);
                                showToast('클립보드 권한이 없어 이미지 파일로 다운로드되었습니다.', 'success');
                            }
                        }, 'image/png');
                    } catch (e) {
                        showToast('명함 복사/공유 실패', 'error', e.message);
                    }
                };

                // 파일 다운로드 및 링크 복사
                const showPreviewModal = ref(false); const previewItem = ref(null); const previewFiles = ref([]);
                const hasFiles = (item) => item.file_path && item.file_path.startsWith('[');
                
                const copyDownloadLink = (url, name) => {
                    const downloadUrl = `${url}?download=${encodeURIComponent(name)}`;
                    const tempInput = document.createElement("input"); tempInput.value = downloadUrl; document.body.appendChild(tempInput);
                    tempInput.select(); document.execCommand("copy"); document.body.removeChild(tempInput);
                    showToast(`다운로드 링크가 복사되었습니다!`);
                };
                const downloadActualFile = async (url, fileName) => { saveAs(url, fileName); };
                const downloadSelectedZip = async () => {
                    if (selectedItems.value.length === 0) return; showToast('압축을 시작합니다...');
                    const zip = new JSZip();
                    for (const itemId of selectedItems.value) {
                        const item = filteredItems.value.find(i => i.id === itemId);
                        if (item && hasFiles(item)) {
                            const files = JSON.parse(item.file_path); const folder = zip.folder(item.name);
                            for (const file of files) { const response = await fetch(file.url); folder.file(file.name, await response.blob()); }
                        }
                    }
                    zip.generateAsync({type:"blob"}).then(content => saveAs(content, `다운로드_${Date.now()}.zip`));
                    selectedItems.value = [];
                };

                const showCatModal = ref(false); const catModalData = ref({});
                const openCatModal = (id, mode, name='', icon='', parentId=null) => { catModalData.value = { id, mode, name, icon, parent_id: parentId, title: mode==='add_sector'?'새 부문 생성':mode==='add'?'하위 메뉴 추가':'이름 수정' }; showCatModal.value = true; };
                const saveCategory = async () => {
                    try {
                        const { mode, id, name, icon, parent_id } = catModalData.value;
                        if(mode === 'edit') await supabase.from('categories').update({name, icon}).eq('id', id);
                        else {
                            const { data: cats } = await supabase.from('categories').select('sort_order').eq('company_id', currentCompanyId.value).order('sort_order', {ascending: false}).limit(1);
                            const newOrder = cats.length > 0 ? (cats[0].sort_order || 0) + 1 : 1;
                            await supabase.from('categories').insert({name, icon, parent_id, company_id: currentCompanyId.value, sort_order: newOrder});
                        }
                        showCatModal.value = false; await loadData();
                    } catch(e) {}
                };
                const showDeleteModal = ref(false); const deleteTarget = ref(null);
                const confirmDeleteCategory = (id, name) => { deleteTarget.value = { type: 'category', id, name }; showDeleteModal.value = true; };
                const confirmDelete = (item) => { deleteTarget.value = { type: 'item', id: item.id, name: item.name }; showDeleteModal.value = true; };
                const executeDelete = async () => {
                    try {
                        if (deleteTarget.value.type === 'category') await supabase.from('categories').delete().eq('id', deleteTarget.value.id);
                        else await supabase.from('items').delete().eq('id', deleteTarget.value.id);
                        showDeleteModal.value = false; await loadData(); showToast('삭제되었습니다.');
                    } catch(e) {}
                };

                onMounted(() => { checkSession(); });

                return {
                    authState, authForm, userProfile, isAuthLoading, rememberEmail, keepLoggedIn, handleLogin, handleRegister, handleLogout,
                    companies, currentCompanyId, currentCompanyName, loadCompanies, loadData,
                    showCompanyModal, newCompanyName, isCloning, openAddCompanyModal, executeAddCompany, showDeleteCompanyModal, isDeletingCompany, confirmDeleteCompany: () => showDeleteCompanyModal.value = true, executeDeleteCompany,
                    showUserModal, usersList, editingUser, menuGroupsForEditingUser, openUserManagement, selectUserForEdit, updateUserStatus, saveUserPermissions, getCompanyName, refreshMenuGroupsForUser,
                    adminUserTab, adminCardData, adminCardFiles, isAdminCardUploading, dragStates, handleCardFileSelect, handleCardDrop, handleCardPaste, saveAdminBusinessCard,
                    isAdminMode, toggleAdminMode: () => isAdminMode.value = !isAdminMode.value, isSidebarOpen, toggleSidebar: () => isSidebarOpen.value = !isSidebarOpen.value,
                    viewMode, menuGroups, visibleMenuGroups, activeCategoryId, activeCategoryName, filteredItems, selectCategory: (c) => { activeCategoryId.value = c.id; selectedItems.value = []; },
                    showCatModal, catModalData, openCatModal, saveCategory, moveCategory, showDeleteModal, confirmDeleteCategory, confirmDelete, executeDelete,
                    showItemModal, isEditing, isUploading, dragActive, modalForm, openAddModal: () => { isEditing.value=false; modalForm.value={type:'download', files:[]}; showItemModal.value=true; },
                    openEditModal: (i) => { isEditing.value=true; modalForm.value={...i, files: hasFiles(i) ? JSON.parse(i.file_path) : []}; showItemModal.value=true; },
                    closeModal: () => showItemModal.value=false, saveItem, moveItem, handleFileSelect, handleDrop, removeFile, moveFile,
                    showPreviewModal, previewItem, previewFiles, handleAction, copyDownloadLink, downloadActualFile, hasFiles, selectedItems, downloadSelectedZip,
                    showBusinessCardModal, businessCardData, captureAndShare,
                    toast, getIcon: (t) => ({notice:'fa-solid fa-bullhorn', download:'fa-solid fa-file-arrow-down', document:'fa-solid fa-file-signature', system:'fa-solid fa-laptop-code', link:'fa-solid fa-link', proxy_form:'fa-solid fa-id-card', my_business_card:'fa-solid fa-address-card'}[t]||'fa-solid fa-file'),
                    getIconClass: (t) => ({notice:'bg-red-50 text-red-600', download:'bg-blue-50 text-blue-600', my_business_card:'bg-indigo-50 text-indigo-600'}[t]||'bg-gray-50 text-gray-600'),
                    getTypeBorderClass: (t) => ({notice:'border-red-100', download:'border-blue-100', my_business_card:'border-indigo-100'}[t]||'border-gray-200'),
                    getTypeName: (t) => ({notice:'공지사항', download:'일반파일', document:'사내기안', system:'시스템', link:'외부링크', proxy_form:'스마트폼', my_business_card:'개인명함'}[t]||'기타'),
                    getActionText: (t,i) => t === 'my_business_card' ? '내 명함 열기' : (hasFiles(i) ? '열람/다운로드' : ({notice:'내용확인', download:'다운로드', link:'바로가기'}[t]||'실행')),
                    getActionIcon: (t) => ({notice:'fa-solid fa-book-open', link:'fa-solid fa-arrow-up-right-from-square', my_business_card:'fa-solid fa-image-portrait'}[t]||'fa-solid fa-download')
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
