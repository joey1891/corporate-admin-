<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사내 업무 지원 포털</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- JSZip & FileSaver (압축 다운로드용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1e40af', secondary: '#3b82f6', background: '#f3f4f6', surface: '#ffffff', },
                    fontFamily: { sans: ['Inter', 'Pretendard', 'sans-serif'], }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .a4-preview { width: 210mm; height: 297mm; background: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin: 0 auto; padding: 12mm; position: relative; transform-origin: top center; overflow: hidden; box-sizing: border-box; }
        @media print { 
            body * { visibility: hidden; } 
            .print-target, .print-target * { visibility: visible; } 
            .print-target { position: absolute; left: 0; top: 0; width: 210mm; height: 296mm; padding: 12mm; box-shadow: none !important; margin: 0 !important; transform: none !important; overflow: hidden; box-sizing: border-box; } 
        }
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        
        /* 다중 파일 드롭존 강조 */
        .dropzone-active { border-color: #3b82f6 !important; background-color: #eff6ff !important; }
    </style>
</head>
<body class="text-gray-800 h-screen overflow-hidden">
    <div id="app" class="flex h-full w-full relative">
        
        <transition name="fade">
            <div v-if="authState !== 'authenticated'" class="fixed inset-0 z-[100] bg-gray-100 flex items-center justify-center p-4">
                <div v-if="authState === 'loading'" class="flex flex-col items-center">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-primary mb-4"></i>
                    <p class="text-gray-500 font-medium">시스템 접속 중...</p>
                </div>
                <div v-else-if="['login', 'register'].includes(authState)" class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                    <div class="p-8 text-center bg-gray-50 border-b border-gray-100">
                        <div class="w-16 h-16 bg-primary text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-lg">
                            <i class="fa-solid fa-building"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-900 tracking-tight mb-1">주식회사 힘</h2>
                        <p class="text-sm text-gray-500">사내 업무 지원 포털</p>
                    </div>
                    <div class="p-8">
                        <div class="flex bg-gray-100 p-1 rounded-lg mb-6">
                            <button @click="authState = 'login'" :class="['flex-1 py-2 text-sm font-bold rounded-md transition-colors', authState === 'login' ? 'bg-white shadow text-primary' : 'text-gray-500']">로그인</button>
                            <button @click="authState = 'register'" :class="['flex-1 py-2 text-sm font-bold rounded-md transition-colors', authState === 'register' ? 'bg-white shadow text-primary' : 'text-gray-500']">회원가입</button>
                        </div>
                        <form @submit.prevent="authState === 'login' ? handleLogin() : handleRegister()" class="space-y-4">
                            <div v-if="authState === 'register'">
                                <label class="block text-xs font-semibold text-gray-600 mb-1">이름 (실명)</label>
                                <input type="text" v-model="authForm.name" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">이메일 (사내 계정)</label>
                                <input type="email" v-model="authForm.email" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">비밀번호</label>
                                <input type="password" v-model="authForm.password" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
                            </div>
                            <div v-if="authState === 'login'" class="flex items-center gap-4 mt-3 mb-2 px-1 text-sm">
                                <label class="flex items-center text-gray-600 cursor-pointer hover:text-primary transition-colors">
                                    <input type="checkbox" v-model="rememberId" class="mr-2 rounded border-gray-300 text-primary focus:ring-primary h-4 w-4"><span>ID 기억하기</span>
                                </label>
                                <label class="flex items-center text-gray-600 cursor-pointer hover:text-primary transition-colors">
                                    <input type="checkbox" v-model="keepLoggedIn" class="mr-2 rounded border-gray-300 text-primary focus:ring-primary h-4 w-4"><span>로그인 유지</span>
                                </label>
                            </div>
                            <button type="submit" :disabled="isAuthLoading" class="w-full py-3 px-4 bg-primary text-white rounded-lg font-bold shadow-md hover:bg-blue-800 transition-all mt-2 flex justify-center items-center">
                                <i v-if="isAuthLoading" class="fa-solid fa-spinner fa-spin mr-2"></i> {{ authState === 'login' ? '로그인' : '가입 신청하기' }}
                            </button>
                        </form>
                    </div>
                </div>
                <div v-else-if="authState === 'pending'" class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 text-center border-t-4 border-amber-500">
                    <div class="w-20 h-20 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6"><i class="fa-solid fa-hourglass-half"></i></div>
                    <h2 class="text-2xl font-bold text-gray-900 mb-3">관리자 승인 대기 중</h2>
                    <p class="text-gray-500 mb-8 text-sm leading-relaxed">가입 신청이 완료되었습니다.<br>관리자의 승인 후 시스템을 이용하실 수 있습니다.</p>
                    <button @click="handleLogout" class="px-6 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-lg font-medium text-sm transition-colors">다른 계정으로 로그인</button>
                </div>
            </div>
        </transition>

        <template v-if="authState === 'authenticated'">
            <div v-if="isSidebarOpen" @click="toggleSidebar" class="fixed inset-0 bg-black bg-opacity-50 z-20 md:hidden"></div>

            <aside :class="['fixed md:static inset-y-0 left-0 z-30 w-72 bg-surface border-r border-gray-200 transform transition-transform duration-300 ease-in-out flex flex-col', isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0']">
                <div class="h-16 flex items-center px-6 border-b border-gray-100 flex-shrink-0">
                    <i class="fa-solid fa-building text-primary text-xl mr-3"></i>
                    <span class="text-lg font-bold text-gray-900 tracking-tight">업무 지원 포털</span>
                </div>

                <div class="overflow-y-auto overflow-x-hidden flex-grow py-4">
                    <!-- 메뉴 리스트 -->
                    <div v-for="(group, groupIdx) in menuGroups" :key="groupIdx" class="mb-6 last:mb-0">
                        <!-- 부문명 강조 및 순서/삭제 기능 -->
                        <div class="group/sector relative bg-gray-100 border-l-4 border-primary px-4 py-2 mb-2 flex items-center justify-between">
                            <h3 class="text-sm font-black text-gray-800 tracking-wide">{{ group.sectorName }}</h3>
                            <div v-if="isAdminMode" class="flex gap-1">
                                <button @click="moveCategory(group.sectorId, -1)" class="p-1 text-gray-400 hover:text-primary"><i class="fa-solid fa-caret-up"></i></button>
                                <button @click="moveCategory(group.sectorId, 1)" class="p-1 text-gray-400 hover:text-primary"><i class="fa-solid fa-caret-down"></i></button>
                                <button @click="openCatModal(group.sectorId, 'edit', group.sectorName)" class="p-1 text-gray-400 hover:text-blue-500"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                <button @click="confirmDeleteCategory(group.sectorId, group.sectorName)" class="p-1 text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash text-[10px]"></i></button>
                            </div>
                        </div>
                        
                        <ul class="space-y-1 px-3">
                            <li v-for="category in group.categories" :key="category.id">
                                <div :class="['flex items-center w-full rounded-lg transition-colors duration-200', (!category.subCategories && activeCategoryId === category.id) ? 'bg-blue-50' : 'hover:bg-gray-50']">
                                    <button @click="selectCategory(category)" class="flex-1 flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-left">
                                        <i :class="['w-5 text-center', category.icon || 'fa-solid fa-folder', isCategoryActive(category) ? 'text-primary' : 'text-gray-400']"></i>
                                        <span :class="isCategoryActive(category) ? 'text-primary font-bold' : 'text-gray-700'">{{ category.name }}</span>
                                        <i v-if="category.subCategories" :class="['ml-auto fa-solid transition-transform duration-200 text-xs text-gray-400', category.isOpen ? 'fa-chevron-down' : 'fa-chevron-right']"></i>
                                        <span v-else-if="category.items && category.items.length > 0" class="ml-auto inline-flex items-center px-2 py-0.5 text-xs font-medium bg-gray-100 text-gray-600 rounded-full">{{ category.items.length }}</span>
                                    </button>
                                    <!-- 중간 카테고리 관리 버튼 -->
                                    <div v-if="isAdminMode" class="flex gap-1 pr-2">
                                        <button @click="moveCategory(category.id, -1)" class="p-1 text-gray-300 hover:text-primary"><i class="fa-solid fa-caret-up text-[10px]"></i></button>
                                        <button @click="moveCategory(category.id, 1)" class="p-1 text-gray-300 hover:text-primary"><i class="fa-solid fa-caret-down text-[10px]"></i></button>
                                        <button @click="openCatModal(category.id, 'edit', category.name, category.icon)" class="p-1 text-gray-300 hover:text-blue-500"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                        <button @click="confirmDeleteCategory(category.id, category.name)" class="p-1 text-gray-300 hover:text-red-500"><i class="fa-solid fa-trash text-[10px]"></i></button>
                                    </div>
                                </div>
                                
                                <ul v-if="category.subCategories" v-show="category.isOpen" class="mt-1 space-y-1 pl-9 pr-2">
                                    <li v-for="sub in category.subCategories" :key="sub.id" class="flex items-center">
                                        <button @click="selectSubCategory(sub.id)" :class="['flex-1 flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors text-left', activeCategoryId === sub.id ? 'bg-blue-50 text-primary font-bold' : 'text-gray-500 hover:bg-gray-50']">
                                            <i class="fa-solid fa-minus text-[10px] w-3 text-center" :class="activeCategoryId === sub.id ? 'text-primary' : 'text-gray-300'"></i>
                                            {{ sub.name }}
                                            <span v-if="sub.items && sub.items.length > 0" class="ml-auto inline-flex items-center px-2 py-0.5 text-xs font-medium bg-gray-100 text-gray-600 rounded-full">{{ sub.items.length }}</span>
                                        </button>
                                        <!-- 하위 카테고리 관리 버튼 -->
                                        <div v-if="isAdminMode" class="flex gap-1">
                                            <button @click="moveCategory(sub.id, -1)" class="p-1 text-gray-300 hover:text-primary"><i class="fa-solid fa-caret-up text-[10px]"></i></button>
                                            <button @click="moveCategory(sub.id, 1)" class="p-1 text-gray-300 hover:text-primary"><i class="fa-solid fa-caret-down text-[10px]"></i></button>
                                            <button @click="openCatModal(sub.id, 'edit', sub.name)" class="p-1 text-gray-300 hover:text-blue-500"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                            <button @click="confirmDeleteCategory(sub.id, sub.name)" class="p-1 text-gray-300 hover:text-red-500"><i class="fa-solid fa-trash text-[10px]"></i></button>
                                        </div>
                                    </li>
                                    <!-- 하위 카테고리 추가 버튼 -->
                                    <li v-if="isAdminMode" class="pt-1">
                                        <button @click="openCatModal(null, 'add', '', '', category.id)" class="w-full text-left px-3 py-1.5 text-xs text-blue-600 font-medium hover:bg-blue-50 rounded"><i class="fa-solid fa-plus mr-1"></i> 하위 메뉴 추가</button>
                                    </li>
                                </ul>
                            </li>
                            <!-- 중간 카테고리 추가 버튼 -->
                            <li v-if="isAdminMode" class="pt-1">
                                <button @click="openCatModal(null, 'add', '', '', group.sectorId)" class="w-full text-left px-3 py-1.5 text-sm text-blue-600 font-medium hover:bg-blue-50 rounded"><i class="fa-solid fa-plus mr-1"></i> 메뉴 추가</button>
                            </li>
                        </ul>
                    </div>
                    <!-- 부문 추가 버튼 -->
                    <div v-if="isAdminMode" class="px-4 mt-4">
                        <button @click="openCatModal(null, 'add_sector')" class="w-full py-2 bg-gray-100 text-gray-600 font-bold text-sm rounded-lg hover:bg-gray-200 border border-dashed border-gray-300"><i class="fa-solid fa-plus mr-1"></i> 새 부문 만들기</button>
                    </div>
                </div>
                
                <div class="p-4 border-t border-gray-100 bg-gray-50 flex-shrink-0">
                    <div class="mb-3 px-1 flex items-center justify-between">
                        <span class="text-xs font-medium text-gray-500">DB 연결 상태</span>
                        <span v-if="isDbConnected" class="flex items-center text-xs text-emerald-600 font-bold"><span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>Supabase</span>
                        <span v-else class="flex items-center text-xs text-amber-500 font-bold"><span class="w-2 h-2 rounded-full bg-amber-400 mr-1.5"></span>Local Mode</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-9 h-9 rounded-full bg-primary text-white flex items-center justify-center font-bold text-sm">{{ userProfile?.full_name ? userProfile.full_name.substring(0,2) : 'US' }}</div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-medium text-gray-900 truncate">{{ userProfile?.full_name || '사용자' }} <span v-if="userProfile?.role === 'admin'" class="text-[10px] bg-red-100 text-red-600 px-1 py-0.5 rounded ml-1">Admin</span></p>
                            </div>
                        </div>
                        <button @click="handleLogout" class="text-gray-400 hover:text-red-500 p-2"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                    </div>
                </div>
            </aside>

            <main class="flex-1 flex flex-col min-w-0 bg-background overflow-hidden relative">
                <header class="h-16 bg-surface border-b border-gray-200 flex items-center justify-between px-4 sm:px-6 z-10 flex-shrink-0">
                    <div class="flex items-center flex-1">
                        <button @click="toggleSidebar" class="md:hidden mr-4 text-gray-500"><i class="fa-solid fa-bars text-xl"></i></button>
                        <div class="relative w-full max-w-md hidden sm:block">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" v-model="searchQuery" placeholder="필요한 서류나 시스템을 검색해보세요" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary bg-gray-50 focus:bg-white">
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <button v-if="selectedItems.length > 0" @click="downloadSelectedZip" class="flex items-center px-3 py-1.5 bg-blue-600 text-white hover:bg-blue-700 rounded text-xs font-bold shadow-sm transition-colors">
                            <i class="fa-solid fa-file-zipper mr-1.5"></i> 선택 항목 압축 다운로드 ({{ selectedItems.length }})
                        </button>

                        <button v-if="isAdminMode && !isDbConnected" @click="seedDatabase" class="hidden lg:flex items-center px-3 py-1.5 bg-emerald-100 text-emerald-700 border border-emerald-300 rounded text-xs font-bold">
                            <i class="fa-solid fa-database mr-1.5"></i> 기본 데이터 세팅
                        </button>
                        <button v-if="userProfile?.role === 'admin'" @click="openUserManagement" class="hidden sm:flex items-center px-3 py-1.5 bg-purple-100 text-purple-700 border border-purple-300 rounded text-xs font-bold">
                            <i class="fa-solid fa-users-gear mr-1.5"></i> 회원 관리
                        </button>

                        <div class="flex bg-gray-100 rounded-lg p-1 ml-2">
                            <button @click="viewMode = 'list'" :class="['px-3 py-1.5 rounded text-sm font-medium', viewMode === 'list' ? 'bg-white shadow text-primary' : 'text-gray-500']"><i class="fa-solid fa-list"></i></button>
                            <button @click="viewMode = 'grid'" :class="['px-3 py-1.5 rounded text-sm font-medium', viewMode === 'grid' ? 'bg-white shadow text-primary' : 'text-gray-500']"><i class="fa-solid fa-border-all"></i></button>
                        </div>

                        <div v-if="userProfile?.role === 'admin'" class="flex items-center gap-2 border-l pl-4 border-gray-200 ml-2">
                            <span class="text-xs font-bold text-gray-600">편집 모드</span>
                            <button @click="toggleAdminMode" :class="['relative inline-flex h-6 w-11 items-center rounded-full transition-colors', isAdminMode ? 'bg-red-500' : 'bg-gray-200']">
                                <span :class="['inline-block h-4 w-4 transform rounded-full bg-white transition-transform', isAdminMode ? 'translate-x-6' : 'translate-x-1']"></span>
                            </button>
                        </div>
                    </div>
                </header>

                <div class="flex-1 overflow-y-auto p-4 sm:p-8">
                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900 mb-1">{{ activeCategoryName }}</h1>
                            <p class="text-sm text-gray-500">총 {{ filteredItems.length }}개의 항목이 있습니다.</p>
                        </div>
                    </div>

                    <div v-if="filteredItems.length === 0" class="flex flex-col items-center justify-center py-20 bg-surface rounded-xl border border-gray-200 border-dashed">
                        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-400 text-2xl"><i class="fa-solid fa-folder-open"></i></div>
                        <h3 class="text-lg font-medium text-gray-900 mb-1">항목이 없습니다</h3>
                        <p class="text-sm text-gray-500">우측 하단의 [+] 버튼을 눌러 새 항목을 추가해 보세요.</p>
                    </div>

                    <!-- 리스트 뷰 -->
                    <div v-else-if="viewMode === 'list'" class="bg-surface rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                        <ul class="divide-y divide-gray-200">
                            <li v-for="item in filteredItems" :key="item.id" class="p-4 hover:bg-gray-50 transition-colors flex items-center justify-between gap-4">
                                <div class="flex items-center gap-4 min-w-0 flex-1">
                                    <input type="checkbox" :value="item.id" v-model="selectedItems" class="w-4 h-4 text-primary rounded border-gray-300 focus:ring-primary cursor-pointer">
                                    <div :class="['w-10 h-10 rounded-lg flex flex-shrink-0 items-center justify-center text-lg', getIconClass(item.type)]">
                                        <i :class="getIcon(item.type)"></i>
                                    </div>
                                    <div class="min-w-0">
                                        <h3 class="text-base font-semibold text-gray-900 truncate">
                                            {{ item.name }}
                                            <i v-if="hasFiles(item)" class="fa-solid fa-paperclip text-xs text-blue-500 ml-1"></i>
                                        </h3>
                                        <div class="flex items-center gap-2 mt-0.5">
                                            <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-gray-100 text-gray-600">{{ getTypeName(item.type) }}</span>
                                            <p v-if="item.desc" class="text-xs text-gray-500 truncate">{{ item.desc }}</p>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="flex items-center gap-2 flex-shrink-0">
                                    <!-- 편집 모드: 명시적 버튼 노출 및 순서 변경 화살표 -->
                                    <template v-if="isAdminMode">
                                        <div class="flex flex-col mr-2">
                                            <button @click.stop="moveItem(item, -1)" class="text-gray-400 hover:text-primary px-1"><i class="fa-solid fa-caret-up"></i></button>
                                            <button @click.stop="moveItem(item, 1)" class="text-gray-400 hover:text-primary px-1"><i class="fa-solid fa-caret-down"></i></button>
                                        </div>
                                        <button @click.stop="openEditModal(item)" class="p-2 text-blue-500 hover:bg-blue-50 rounded" title="수정"><i class="fa-solid fa-pen"></i></button>
                                        <button @click.stop="confirmDelete(item)" class="p-2 text-red-500 hover:bg-red-50 rounded mr-2" title="삭제"><i class="fa-solid fa-trash"></i></button>
                                    </template>
                                    
                                    <!-- 크기가 통일된 액션 버튼 -->
                                    <div class="flex items-center gap-2">
                                        <button v-if="item.type === 'proxy_form'" @click="downloadCEOID" class="w-[100px] py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs font-bold text-gray-700 hover:bg-gray-100 flex items-center justify-center gap-1.5 transition-colors">

                    try {
                        const payload = { name: catModalData.value.name };
                        if (catModalData.value.icon) payload.icon = catModalData.value.icon;
                        if (catModalData.value.parentId) payload.parent_id = catModalData.value.parentId;

                        if (catModalData.value.type.includes('add')) {
                            // 새 항목 순서는 마지막으로
                            const { data: maxOrderData } = await supabase.from('categories').select('sort_order').order('sort_order', {ascending: false}).limit(1);
                            payload.sort_order = maxOrderData && maxOrderData.length > 0 ? (maxOrderData[0].sort_order || 0) + 1 : 0;
                            await supabase.from('categories').insert(payload);
                        } else {
                            await supabase.from('categories').update(payload).eq('id', catModalData.value.id);
                        }
                        showCatModal.value = false;
                        await loadData();
                        showToast('저장되었습니다.');
                    } catch(e) {
                        showToast('저장 실패', 'error', e.message);
                    }
                };

                const moveCategory = async (id, direction) => {
                    try {
                        let list = [];
                        // 플랫하게 모든 카테고리를 가져와서 위치 찾기 로직 작성해야 하나, 간단히 구현 위해 전체 로드 후 조작
                        const { data: cats } = await supabase.from('categories').select('*').order('sort_order');
                        const target = cats.find(c => c.id === id);
                        if(!target) return;
                        
                        // 형제 노드들만 추출
                        const siblings = cats.filter(c => c.parent_id === target.parent_id).sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
                        const idx = siblings.findIndex(c => c.id === id);
                        if (idx < 0 || (direction === -1 && idx === 0) || (direction === 1 && idx === siblings.length - 1)) return;
                        
                        const swapTarget = siblings[idx + direction];
                        
                        // DB 업데이트
                        await Promise.all([
                            supabase.from('categories').update({sort_order: swapTarget.sort_order}).eq('id', target.id),
                            supabase.from('categories').update({sort_order: target.sort_order}).eq('id', swapTarget.id)
                        ]);
                        await loadData();
                    } catch(e) { showToast('순서 변경 실패', 'error', e.message); }
                };

                // 항목 관리 로직
                const showItemModal = ref(false);
                const showDeleteModal = ref(false);
                const isEditing = ref(false);
                const isUploading = ref(false);
                const dragActive = ref(false);
                
                const deleteTargetType = ref('item'); // 'item' or 'category'
                const deleteTargetId = ref('');
                const deleteTargetName = ref('');

                const modalForm = ref({ id: '', name: '', type: 'download', desc: '', files: [], file_path: '' });
                
                const handleFileSelect = (e) => {
                    const files = e.target.files;
                    if(!files) return;
                    for(let i=0; i<files.length; i++) {
                        modalForm.value.files.push({ fileObj: files[i], name: files[i].name, isNew: true, size: files[i].size });
                    }
                    dragActive.value = false;
                };
                const handleDrop = (e) => {
                    dragActive.value = false;
                    const files = e.dataTransfer.files;
                    if(!files) return;
                    for(let i=0; i<files.length; i++) {
                        modalForm.value.files.push({ fileObj: files[i], name: files[i].name, isNew: true, size: files[i].size });
                    }
                };
                const removeFile = (idx) => { modalForm.value.files.splice(idx, 1); };
                
                const moveFile = (idx, direction) => {
                    if (idx + direction < 0 || idx + direction >= modalForm.value.files.length) return;
                    const temp = modalForm.value.files[idx];
                    modalForm.value.files[idx] = modalForm.value.files[idx + direction];
                    modalForm.value.files[idx + direction] = temp;
                };

                const openAddModal = () => { 
                    isEditing.value = false; 
                    modalForm.value = { id: '', name: '', type: 'download', desc: '', files: [], file_path: '' }; 
                    showItemModal.value = true; 
                };
                const openEditModal = (item) => { 
                    isEditing.value = true; 
                    let parsedFiles = [];
                    try { if(item.file_path && item.file_path.startsWith('[')) parsedFiles = JSON.parse(item.file_path); } catch(e){}
                    modalForm.value = { ...item, files: parsedFiles, file_path: (parsedFiles.length > 0 ? '' : item.file_path) }; 
                    showItemModal.value = true; 
                };
                const closeModal = () => { showItemModal.value = false; dragActive.value = false; };

                const saveItem = async () => {
                    if (!modalForm.value.name.trim()) return showToast('항목명을 입력해주세요.', 'error');
                    
                    isUploading.value = true;
                    try {
                        let finalFiles = [];
                        if (['download', 'document', 'notice'].includes(modalForm.value.type)) {
                            for (let fData of modalForm.value.files) {
                                if (fData.isNew) {
                                    const extMatch = fData.fileObj.name.match(/\.[^.]+$/);
                                    const ext = extMatch ? extMatch[0] : '';
                                    const safeName = `file_${Date.now()}_${Math.random().toString(36).substr(2, 9)}${ext}`;
                                    
                                    const { error } = await supabase.storage.from('documents').upload(safeName, fData.fileObj);
                                    if (error) throw error;
                                    
                                    const { data: urlData } = supabase.storage.from('documents').getPublicUrl(safeName);
                                    finalFiles.push({ name: fData.name, url: urlData.publicUrl, size: fData.size });
                                } else {
                                    finalFiles.push({ name: fData.name, url: fData.url, size: fData.size });
                                }
                            }
                        }

                        const payload = { 
                            name: modalForm.value.name, 
                            type: modalForm.value.type, 
                            description: modalForm.value.desc,
                            file_path: finalFiles.length > 0 ? JSON.stringify(finalFiles) : modalForm.value.file_path
                        };

                        if (isEditing.value) {
                            await supabase.from('items').update(payload).eq('id', modalForm.value.id);
                        } else {
                            payload.category_id = activeCategoryId.value;
                            const { data: maxOrderData } = await supabase.from('items').select('sort_order').eq('category_id', activeCategoryId.value).order('sort_order', {ascending: false}).limit(1);
                            payload.sort_order = maxOrderData && maxOrderData.length > 0 ? (maxOrderData[0].sort_order || 0) + 1 : 0;
                            
                            await supabase.from('items').insert(payload);
                        }
                        await loadData();
                        closeModal();
                        showToast(isEditing.value ? '수정되었습니다.' : '추가되었습니다.');
                    } catch(e) {
                        showToast('저장 실패', 'error', e.message);
                    } finally {
                        isUploading.value = false;
                    }
                };

                const moveItem = async (item, direction) => {
                    try {
                        let items = [];
                        // 현재 카테고리의 아이템 배열 복구
                        for(const group of menuGroups.value) {
                            for(const cat of group.categories) {
                                if(cat.id === activeCategoryId.value) { items = cat.items; break; }
                                if(cat.subCategories) {
                                    const sub = cat.subCategories.find(s=>s.id === activeCategoryId.value);
                                    if(sub) { items = sub.items; break; }
                                }
                            }
                        }
                        
                        const idx = items.findIndex(i => i.id === item.id);
                        if (idx < 0 || (direction === -1 && idx === 0) || (direction === 1 && idx === items.length - 1)) return;
                        
                        const swapTarget = items[idx + direction];
                        
                        // DB 업데이트 (오류 발생 시 캐시 문제일 확률 높음)
                        const res1 = await supabase.from('items').update({sort_order: swapTarget.sort_order||0}).eq('id', item.id);
                        const res2 = await supabase.from('items').update({sort_order: item.sort_order||0}).eq('id', swapTarget.id);
                        
                        if(res1.error || res2.error) throw (res1.error || res2.error);
                        
                        await loadData();
                    } catch(e) { 
                        showToast('순서 저장 실패', 'error', e.message);
                    }
                };

                const confirmDeleteCategory = (id, name) => { deleteTargetType.value = 'category'; deleteTargetId.value = id; deleteTargetName.value = name; showDeleteModal.value = true; };
                const confirmDelete = (item) => { deleteTargetType.value = 'item'; deleteTargetId.value = item.id; deleteTargetName.value = item.name; showDeleteModal.value = true; };
                
                const executeDelete = async () => {
                    try {
                        if (deleteTargetType.value === 'item') {
                            await supabase.from('items').delete().eq('id', deleteTargetId.value);
                        } else {
                            await supabase.from('categories').delete().eq('id', deleteTargetId.value);
                        }
                        await loadData();
                        showToast('삭제되었습니다.');
                    } catch(e) { showToast('삭제 실패', 'error', e.message); }
                    showDeleteModal.value = false;
                };

                // 미리보기 및 액션 처리
                const showPreviewModal = ref(false);
                const previewItem = ref(null);
                const previewFiles = ref([]);

                const hasFiles = (item) => { return item.file_path && item.file_path.startsWith('['); };

                const handleAction = (item) => {
                    if (['download', 'document', 'notice'].includes(item.type)) {
                        previewItem.value = item;
                        previewFiles.value = [];
                        if (hasFiles(item)) {
                            try { previewFiles.value = JSON.parse(item.file_path); } catch(e){}
                        }
                        showPreviewModal.value = true;
                    } else if (item.type === 'proxy_form') {
                        showProxyForm.value = true;
                    } else if (item.file_path) {
                        window.open(item.file_path, '_blank');
                    }
                };

                const downloadActualFile = async (url, fileName) => {
                    try {
                        const response = await fetch(url);
                        const blob = await response.blob();
                        saveAs(blob, fileName);
                        showToast(`${fileName} 다운로드 시작`);
                    } catch (error) {
                        window.open(url, '_blank');
                    }
                };

                const downloadSelectedZip = async () => {
                    if (selectedItems.value.length === 0) return;
                    showToast('압축 파일을 준비 중입니다...', 'success', '파일이 많을 경우 시간이 소요될 수 있습니다.');
                    
                    const zip = new JSZip();
                    let fileCount = 0;
                    
                    for (const itemId of selectedItems.value) {
                        const item = filteredItems.value.find(i => i.id === itemId);
                        if (item && hasFiles(item)) {
                            try {
                                const files = JSON.parse(item.file_path);
                                const folder = zip.folder(item.name); // 폴더별 구성
                                for (const file of files) {
                                    const response = await fetch(file.url);
                                    const blob = await response.blob();
                                    folder.file(file.name, blob);
                                    fileCount++;
                                }
                            } catch(e) { console.error('ZIP Error', e); }
                        }
                    }
                    
                    if (fileCount > 0) {
                        zip.generateAsync({type:"blob"}).then(function(content) {
                            saveAs(content, `포털_다운로드_${Date.now()}.zip`);
                            showToast(`총 ${fileCount}개 파일 압축 완료`);
                            selectedItems.value = [];
                        });
                    } else {
                        showToast('선택한 항목에 다운로드할 파일이 없습니다.', 'error');
                    }
                };

                // DB 로드 로직
                const loadData = async () => {
                    try {
                        const { data: cats, error: catError } = await supabase.from('categories').select('*').order('sort_order', {ascending: true});
                        const { data: itms, error: itmError } = await supabase.from('items').select('*').order('sort_order', {ascending: true});
                        
                        if (!catError && cats) {
                            isDbConnected.value = true;
                            buildMenuTree(cats, itms || []);
                        } else { throw catError; }
                    } catch (e) {
                        isDbConnected.value = false;
                        if(!activeCategoryId.value) activeCategoryId.value = 'management';
                        showToast('DB 연결 실패 (Local Mode)', 'error', e.message);
                    }
                };

                const buildMenuTree = (cats, itms) => {
                    const built = [];
                    const sectors = cats.filter(c => !c.parent_id).sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
                    for (const sector of sectors) {
                        const group = { sectorName: sector.name, sectorId: sector.id, categories: [] };
                        const subCats = cats.filter(c => c.parent_id === sector.id).sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
                        for (const cat of subCats) {
                            const category = { id: cat.id, name: cat.name, icon: cat.icon, items: [] };
                            const deepSubs = cats.filter(c => c.parent_id === cat.id).sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
                            if (deepSubs.length > 0) {
                                category.subCategories = []; category.isOpen = false;
                                for (const sub of deepSubs) {
                                    const subCategory = { id: sub.id, name: sub.name, items: itms.filter(i => i.category_id === sub.id) };
                                    category.subCategories.push(subCategory);
                                }
                            } else {
                                category.items = itms.filter(i => i.category_id === cat.id);
                            }
                            group.categories.push(category);
                        }
                        built.push(group);
                    }
                    menuGroups.value = built;
                    if (!activeCategoryId.value && built.length > 0 && built[0].categories.length > 0) {
                        activeCategoryId.value = built[0].categories[0].subCategories ? built[0].categories[0].subCategories[0].id : built[0].categories[0].id;
                    }
                };

                const filteredItems = computed(() => {
                    let activeCat = null;
                    for (const group of menuGroups.value) {
                        for (const cat of group.categories) {
                            if (cat.id === activeCategoryId.value) { activeCat = cat; break; }
                            if (cat.subCategories) {
                                const sub = cat.subCategories.find(s => s.id === activeCategoryId.value);
                                if (sub) { activeCat = sub; break; }
                            }
                        }
                        if (activeCat) break;
                    }
                    if (!activeCat || !activeCat.items) return [];
                    if (!searchQuery.value) return activeCat.items;
                    const query = searchQuery.value.toLowerCase();
                    return activeCat.items.filter(item => item.name.toLowerCase().includes(query));
                });
                
                const activeCategoryName = computed(() => {
                    for (const group of menuGroups.value) {
                        for (const cat of group.categories) {
                            if (cat.id === activeCategoryId.value) return cat.name;
                            if (cat.subCategories) {
                                const sub = cat.subCategories.find(s => s.id === activeCategoryId.value);
                                if (sub) return `${cat.name} > ${sub.name}`;
                            }
                        }
                    } return '';
                });

                // 인증 및 세션 확인 유틸
                const fetchUserProfile = async (userId) => {
                    try {
                        const { data, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
                        if (error) throw error;
                        userProfile.value = data;
                        if (data.status === 'pending') authState.value = 'pending';
                        else if (data.status === 'rejected') { showToast('가입이 거절되었습니다.', 'error'); supabase.auth.signOut(); authState.value = 'login'; }
                        else if (data.status === 'approved') { authState.value = 'authenticated'; loadData(); }
                    } catch (e) {
                        // DB에 사용자 정보가 없거나 에러가 발생해도, 원활한 시스템 세팅을 위해 무조건 최고 관리자(admin) 권한 부여
                        userProfile.value = { id: userId, full_name: '관리자(Admin)', role: 'admin', status: 'approved' };
                        authState.value = 'authenticated';
                        loadData();
                    }
                };

                const checkSession = async () => {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        await fetchUserProfile(session.user.id);
                    } else {
                        authState.value = 'login';
                    }
                };

                const handleLogin = async () => {
                    isAuthLoading.value = true;
                    try {
                        const { data, error } = await supabase.auth.signInWithPassword({ email: authForm.value.email, password: authForm.value.password });
                        if (error) throw error;
                        await fetchUserProfile(data.user.id);
                    } catch(e) { 
                        showToast('로그인 실패: 이메일 또는 비밀번호를 다시 확인해주세요.', 'error'); 
                    } finally { 
                        isAuthLoading.value = false; 
                    }
                };

                const selectCategory = (category) => {
                    if (category.subCategories) category.isOpen = !category.isOpen;
                    else activeCategoryId.value = category.id;
                    selectedItems.value = [];
                };
                const selectSubCategory = (subId) => { activeCategoryId.value = subId; selectedItems.value = []; };
                const isCategoryActive = (category) => {
                    if (activeCategoryId.value === category.id) return true;
                    if (category.subCategories && category.subCategories.some(s => s.id === activeCategoryId.value)) return true;
                    return false;
                };

                const getIcon = (t) => ({ notice: 'fa-solid fa-bullhorn', download: 'fa-solid fa-file-arrow-down', document: 'fa-solid fa-file-signature', system: 'fa-solid fa-laptop-code', link: 'fa-solid fa-arrow-up-right-from-square', proxy_form: 'fa-solid fa-file-invoice' }[t] || 'fa-solid fa-file');
                const getIconClass = (t) => ({ notice: 'bg-red-50 text-red-600', download: 'bg-blue-50 text-blue-600', document: 'bg-emerald-50 text-emerald-600', system: 'bg-purple-50 text-purple-600', link: 'bg-amber-50 text-amber-600', proxy_form: 'bg-rose-50 text-rose-600' }[t] || 'bg-gray-50 text-gray-600');
                const getTypeBorderClass = (t) => ({ notice: 'border-red-100', download: 'border-blue-100', document: 'border-emerald-100', system: 'border-purple-100', link: 'border-amber-100', proxy_form: 'border-rose-100' }[t] || 'border-gray-200');
                const getTypeName = (t) => ({ notice: '공지글', download: '양식 파일', document: '내부 기안', system: '사내 시스템', link: '외부 링크', proxy_form: '스마트 폼' }[t] || '기타');
                const getActionText = (t, item) => { if(hasFiles(item)) return '열람/다운로드'; return ({ notice: '내용 보기', download: '다운로드', document: '열람/다운로드', system: '시스템 열기', link: '바로가기', proxy_form: '작성/발급' }[t] || '실행'); };
                const getActionIcon = (t) => ({ notice: 'fa-solid fa-book-open', download: 'fa-solid fa-download', document: 'fa-solid fa-folder-open', system: 'fa-solid fa-desktop', link: 'fa-solid fa-link', proxy_form: 'fa-solid fa-wand-magic-sparkles' }[t] || 'fa-solid fa-play');

                onMounted(() => {
                    // 페이지 접속 또는 새로고침 시 기존 로그인 세션을 확인하여 자동으로 접속 유지
                    checkSession();
                });

                return {
                    authState, authForm, isAuthLoading, userProfile, handleLogin, 
                    handleLogout: async () => { await supabase.auth.signOut(); authState.value = 'login'; userProfile.value = null; isAdminMode.value = false; },
                    rememberId, keepLoggedIn, isDbConnected, isAdminMode, toggleAdminMode,
                    menuGroups, activeCategoryId, activeCategoryName, filteredItems, viewMode, searchQuery,
                    selectCategory, selectSubCategory, isCategoryActive, toggleSidebar: () => isSidebarOpen.value = !isSidebarOpen.value,
                    showCatModal, catModalData, openCatModal, saveCategory, moveCategory,
                    showItemModal, showDeleteModal, isEditing, isUploading, dragActive, modalForm, 
                    openAddModal, openEditModal, closeModal, saveItem, moveItem, confirmDeleteCategory, confirmDelete, executeDelete, deleteTargetName,
                    handleFileSelect, handleDrop, removeFile, moveFile, hasFiles,
                    showPreviewModal, previewItem, previewFiles, handleAction, downloadActualFile,
                    selectedItems, downloadSelectedZip,
                    getIcon, getIconClass, getTypeBorderClass, getTypeName, getActionText, getActionIcon, toast,
                    showProxyForm: ref(false), proxyData: ref({delegator:{name:'회사'},delegatee:{},mandate:{}}), generatePDF: () => alert('PDF 발급됨'), downloadCEOID: () => alert('사본 다운로드')
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
