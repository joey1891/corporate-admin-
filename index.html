<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사내 업무 지원 포털</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- JSZip (다중 파일 압축 다운로드용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1e40af', secondary: '#3b82f6', background: '#f3f4f6', surface: '#ffffff', },
                    fontFamily: { sans: ['Inter', 'Pretendard', 'sans-serif'], }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .a4-preview { width: 210mm; height: 297mm; background: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin: 0 auto; padding: 12mm; position: relative; transform-origin: top center; overflow: hidden; box-sizing: border-box; }
        @media print { 
            body * { visibility: hidden; } 
            .print-target, .print-target * { visibility: visible; } 
            .print-target { position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; padding: 12mm; box-shadow: none !important; margin: 0 !important; transform: none !important; overflow: hidden; box-sizing: border-box; } 
        }
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        /* 드래그 앤 드롭 영역 스타일 */
        .drop-zone { border: 2px dashed #cbd5e1; border-radius: 0.5rem; padding: 1.5rem; text-align: center; transition: all 0.2s ease; background-color: #f8fafc; cursor: pointer; }
        .drop-zone.dragover { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="text-gray-800 h-screen overflow-hidden">
    <div id="app" class="flex h-full w-full relative">
        
        <!-- ================= 인증 (로그인/회원가입) 오버레이 ================= -->
        <transition name="fade">
            <div v-if="authState !== 'authenticated'" class="fixed inset-0 z-[100] bg-gray-100 flex items-center justify-center p-4">
                
                <div v-if="authState === 'loading'" class="flex flex-col items-center">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-primary mb-4"></i>
                    <p class="text-gray-500 font-medium">시스템 접속 중...</p>
                </div>

                <div v-else-if="['login', 'register'].includes(authState)" class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                    <div class="p-8 text-center bg-gray-50 border-b border-gray-100">
                        <div class="w-16 h-16 bg-primary text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-lg">
                            <i class="fa-solid fa-building"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-900 tracking-tight mb-1">주식회사 힘</h2>
                        <p class="text-sm text-gray-500">사내 업무 지원 포털</p>
                    </div>
                    
                    <div class="p-8">
                        <div class="flex bg-gray-100 p-1 rounded-lg mb-6">
                            <button @click="authState = 'login'" :class="['flex-1 py-2 text-sm font-bold rounded-md transition-colors', authState === 'login' ? 'bg-white shadow text-primary' : 'text-gray-500']">로그인</button>
                            <button @click="authState = 'register'" :class="['flex-1 py-2 text-sm font-bold rounded-md transition-colors', authState === 'register' ? 'bg-white shadow text-primary' : 'text-gray-500']">회원가입</button>
                        </div>

                        <form @submit.prevent="authState === 'login' ? handleLogin() : handleRegister()" class="space-y-4">
                            <div v-if="authState === 'register'">
                                <label class="block text-xs font-semibold text-gray-600 mb-1">이름 (실명)</label>
                                <input type="text" v-model="authForm.name" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">이메일 (사내 계정)</label>
                                <input type="email" v-model="authForm.email" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">비밀번호</label>
                                <input type="password" v-model="authForm.password" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
                            </div>
                            
                            <div v-if="authState === 'login'" class="flex items-center gap-4 mt-3 mb-2 px-1 text-sm">
                                <label class="flex items-center text-gray-600 cursor-pointer hover:text-primary transition-colors">
                                    <input type="checkbox" v-model="rememberId" class="mr-2 rounded border-gray-300 text-primary focus:ring-primary h-4 w-4">
                                    <span>ID 기억하기</span>
                                </label>
                                <label class="flex items-center text-gray-600 cursor-pointer hover:text-primary transition-colors">
                                    <input type="checkbox" v-model="keepLoggedIn" class="mr-2 rounded border-gray-300 text-primary focus:ring-primary h-4 w-4">
                                    <span>로그인 유지</span>
                                </label>
                            </div>
                            
                            <button type="submit" :disabled="isAuthLoading" class="w-full py-3 px-4 bg-primary text-white rounded-lg font-bold shadow-md hover:bg-blue-800 focus:ring-4 focus:ring-blue-500/50 transition-all disabled:opacity-50 mt-2 flex justify-center items-center">
                                <i v-if="isAuthLoading" class="fa-solid fa-spinner fa-spin mr-2"></i>
                                {{ authState === 'login' ? '로그인' : '가입 신청하기' }}
                            </button>
                        </form>
                    </div>
                </div>

                <div v-else-if="authState === 'pending'" class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 text-center border-t-4 border-amber-500">
                    <div class="w-20 h-20 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6">
                        <i class="fa-solid fa-hourglass-half"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-900 mb-3">관리자 승인 대기 중</h2>
                    <p class="text-gray-500 mb-8 text-sm leading-relaxed">
                        가입 신청이 완료되었습니다.<br>
                        보안을 위해 관리자의 승인 후 시스템을<br>이용하실 수 있습니다.
                    </p>
                    <button @click="handleLogout" class="px-6 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-lg font-medium text-sm transition-colors">
                        다른 계정으로 로그인
                    </button>
                </div>
            </div>
        </transition>

        <!-- ================= 메인 앱 콘텐츠 (인증 및 승인 완료 시 표시) ================= -->
        <template v-if="authState === 'authenticated'">
            <div v-if="isSidebarOpen" @click="toggleSidebar" class="fixed inset-0 bg-black bg-opacity-50 z-20 md:hidden"></div>

            <!-- 사이드바 -->
            <aside :class="['fixed md:static inset-y-0 left-0 z-30 w-64 bg-surface border-r border-gray-200 transform transition-transform duration-300 ease-in-out flex flex-col', isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0']">
                <div class="h-16 flex items-center px-6 border-b border-gray-100 flex-shrink-0">
                    <i class="fa-solid fa-building text-primary text-xl mr-3"></i>
                    <span class="text-lg font-bold text-gray-900 tracking-tight">업무 지원 포털</span>
                </div>

                <div class="overflow-y-auto overflow-x-hidden flex-grow py-4 px-3">
                    <div v-for="(group, groupIdx) in menuGroups" :key="groupIdx" class="mb-6 last:mb-0">
                        <h3 class="px-3 text-xs font-bold text-gray-400 mb-2 tracking-wider">{{ group.sectorName }}</h3>
                        <ul class="space-y-1">
                            <li v-for="category in group.categories" :key="category.id">
                                <button @click="selectCategory(category)" :class="['w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors duration-200', (!category.subCategories && activeCategoryId === category.id) ? 'bg-blue-50 text-primary' : '', (category.subCategories && isCategoryActive(category)) ? 'text-primary' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900']">
                                    <i :class="['w-5 text-center', category.icon || 'fa-solid fa-folder', isCategoryActive(category) ? 'text-primary' : 'text-gray-400']"></i>
                                    {{ category.name }}
                                    <i v-if="category.subCategories" :class="['ml-auto fa-solid transition-transform duration-200 text-xs', category.isOpen ? 'fa-chevron-down' : 'fa-chevron-right']"></i>
                                    <span v-else-if="category.items && category.items.length > 0" class="ml-auto inline-flex items-center justify-center px-2 py-0.5 text-xs font-medium bg-gray-100 text-gray-600 rounded-full">{{ category.items.length }}</span>
                                </button>
                                <ul v-if="category.subCategories" v-show="category.isOpen" class="mt-1 space-y-1 pl-9">
                                    <li v-for="sub in category.subCategories" :key="sub.id">
                                        <button @click="selectSubCategory(sub.id)" :class="['w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200', activeCategoryId === sub.id ? 'bg-blue-50 text-primary' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900']">
                                            <i class="fa-solid fa-minus text-[10px] w-3 text-center" :class="activeCategoryId === sub.id ? 'text-primary' : 'text-gray-300'"></i>
                                            {{ sub.name }}
                                            <span v-if="sub.items && sub.items.length > 0" class="ml-auto inline-flex items-center justify-center px-2 py-0.5 text-xs font-medium bg-gray-100 text-gray-600 rounded-full">{{ sub.items.length }}</span>
                                        </button>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </div>
                
                <div class="p-4 border-t border-gray-100 bg-gray-50 flex-shrink-0">
                    <div class="mb-3 px-1 flex items-center justify-between">
                        <span class="text-xs font-medium text-gray-500">DB 연결 상태</span>
                        <span v-if="isDbConnected" class="flex items-center text-xs text-emerald-600 font-bold"><span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>Supabase</span>
                        <span v-else class="flex items-center text-xs text-amber-500 font-bold"><span class="w-2 h-2 rounded-full bg-amber-400 mr-1.5"></span>Local Mode</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-9 h-9 rounded-full bg-primary text-white flex items-center justify-center font-bold text-sm">
                                {{ userProfile?.full_name ? userProfile.full_name.substring(0,2) : 'US' }}
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-medium text-gray-900 truncate">{{ userProfile?.full_name || '사용자' }} <span v-if="userProfile?.role === 'admin'" class="text-[10px] bg-red-100 text-red-600 px-1 py-0.5 rounded ml-1">Admin</span></p>
                                <p class="text-xs text-gray-500 truncate">{{ userProfile?.email || '' }}</p>
                            </div>
                        </div>
                        <button @click="handleLogout" class="text-gray-400 hover:text-red-500 p-2" title="로그아웃"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                    </div>
                </div>
            </aside>

            <main class="flex-1 flex flex-col min-w-0 bg-background overflow-hidden relative">
                <header class="h-16 bg-surface border-b border-gray-200 flex items-center justify-between px-4 sm:px-6 z-10 flex-shrink-0">
                    <div class="flex items-center flex-1">
                        <button @click="toggleSidebar" class="md:hidden mr-4 text-gray-500 hover:text-gray-700">
                            <i class="fa-solid fa-bars text-xl"></i>
                        </button>
                        <div class="relative w-full max-w-md hidden sm:block">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" v-model="searchQuery" placeholder="필요한 서류나 시스템을 검색해보세요" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-gray-50 focus:bg-white">
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <!-- 다중 선택된 항목 압축 다운로드 버튼 -->
                        <button v-if="selectedItems.length > 0" @click="downloadZip" class="flex items-center px-3 py-1.5 bg-blue-600 text-white hover:bg-blue-700 rounded text-xs font-bold transition-colors shadow-sm mr-2 animate-pulse">
                            <i class="fa-solid fa-file-zipper mr-1.5"></i> {{ selectedItems.length }}개 일괄 다운로드
                        </button>

                        <button v-if="isAdminMode && !isDbConnected" @click="seedDatabase" class="hidden lg:flex items-center px-3 py-1.5 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 border border-emerald-300 rounded text-xs font-bold transition-colors shadow-sm">
                            <i class="fa-solid fa-database mr-1.5"></i> DB에 기본 데이터 세팅
                        </button>
                        
                        <button v-if="userProfile?.role === 'admin'" @click="openUserManagement" class="hidden sm:flex items-center px-3 py-1.5 bg-purple-100 text-purple-700 hover:bg-purple-200 border border-purple-300 rounded text-xs font-bold transition-colors shadow-sm">
                            <i class="fa-solid fa-users-gear mr-1.5"></i> 회원 관리
                        </button>

                        <div class="flex bg-gray-100 rounded-lg p-1 ml-2">
                            <button @click="viewMode = 'list'" :class="['px-3 py-1.5 rounded text-sm font-medium transition-colors', viewMode === 'list' ? 'bg-white shadow text-primary' : 'text-gray-500 hover:text-gray-700']"><i class="fa-solid fa-list mr-1"></i></button>
                            <button @click="viewMode = 'grid'" :class="['px-3 py-1.5 rounded text-sm font-medium transition-colors', viewMode === 'grid' ? 'bg-white shadow text-primary' : 'text-gray-500 hover:text-gray-700']"><i class="fa-solid fa-border-all mr-1"></i></button>
                        </div>

                        <div v-if="userProfile?.role === 'admin'" class="flex items-center gap-2 border-l pl-4 border-gray-200 ml-2">
                            <span class="text-xs font-bold text-gray-600">편집 모드</span>
                            <button @click="isAdminMode = !isAdminMode" :class="['relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none', isAdminMode ? 'bg-red-500' : 'bg-gray-200']">
                                <span :class="['inline-block h-4 w-4 transform rounded-full bg-white transition-transform shadow', isAdminMode ? 'translate-x-6' : 'translate-x-1']"></span>
                            </button>
                        </div>
                    </div>
                </header>

                <div class="flex-1 overflow-y-auto p-4 sm:p-8 relative">
                    <!-- ZIP 파일 생성 중 로딩 오버레이 -->
                    <div v-if="isZipping" class="absolute inset-0 z-20 bg-white/70 backdrop-blur-sm flex flex-col items-center justify-center">
                        <i class="fa-solid fa-spinner fa-spin text-5xl text-blue-600 mb-4"></i>
                        <p class="text-lg font-bold text-gray-800">ZIP 파일로 압축 중입니다...</p>
                        <p class="text-sm text-gray-500 mt-2">파일 크기에 따라 시간이 걸릴 수 있습니다.</p>
                    </div>

                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900 mb-1">{{ activeCategoryName }}</h1>
                            <p class="text-sm text-gray-500">총 {{ filteredItems.length }}개의 항목이 있습니다.</p>
                        </div>
                    </div>

                    <div v-if="filteredItems.length === 0" class="flex flex-col items-center justify-center py-20 bg-surface rounded-xl border border-gray-200 border-dashed">
                        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-400 text-2xl"><i class="fa-solid fa-folder-open"></i></div>
                        <h3 class="text-lg font-medium text-gray-900 mb-1">항목이 없습니다</h3>
                        <p class="text-sm text-gray-500">현재 카테고리에 등록된 문서나 시스템이 없습니다.</p>
                    </div>

                    <!-- 리스트 뷰 -->
                    <div v-else-if="viewMode === 'list'" class="bg-surface rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                        <ul class="divide-y divide-gray-200">
                            <li v-for="(item, index) in filteredItems" :key="item.id" class="p-4 hover:bg-gray-50 transition-colors flex items-center justify-between gap-4 group">
                                <div class="flex items-center gap-4 min-w-0">
                                    <!-- 다중 선택 체크박스 -->
                                    <input type="checkbox" v-model="selectedItems" :value="item" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
                                    
                                    <div :class="['w-10 h-10 rounded-lg flex flex-shrink-0 items-center justify-center text-lg', getIconClass(item.type)]">
                                        <i :class="getIcon(item.type)"></i>
                                    </div>
                                    <div class="min-w-0">
                                        <h3 class="text-base font-semibold text-gray-900 truncate">
                                            {{ item.name }}
                                            <i v-if="hasFiles(item)" class="fa-solid fa-paperclip text-xs text-blue-500 ml-1" title="첨부파일 있음"></i>
                                            <span v-if="getFileCount(item) > 1" class="ml-1 text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full">{{ getFileCount(item) }}</span>
                                        </h3>
                                        <div class="flex items-center gap-2 mt-0.5">
                                            <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-gray-100 text-gray-600">{{ getTypeName(item.type) }}</span>
                                            <p v-if="item.desc" class="text-xs text-gray-500 truncate">{{ item.desc }}</p>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="flex items-center gap-2 flex-shrink-0">
                                    <!-- 편집 모드: 순서 변경 및 수정/삭제 -->
                                    <template v-if="isAdminMode && !searchQuery">
                                        <div class="flex flex-col border-r border-gray-200 pr-2 mr-1">
                                            <button @click.stop="moveItem(item, index, -1)" :disabled="index === 0" class="text-gray-400 hover:text-blue-600 disabled:opacity-30 disabled:cursor-not-allowed"><i class="fa-solid fa-caret-up"></i></button>
                                            <button @click.stop="moveItem(item, index, 1)" :disabled="index === filteredItems.length - 1" class="text-gray-400 hover:text-blue-600 disabled:opacity-30 disabled:cursor-not-allowed"><i class="fa-solid fa-caret-down"></i></button>
                                        </div>
                                        <button @click.stop="openEditModal(item)" class="p-2 text-gray-400 hover:text-primary transition-colors opacity-0 group-hover:opacity-100"><i class="fa-solid fa-pen"></i></button>
                                        <button @click.stop="confirmDelete(item)" class="p-2 text-gray-400 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100"><i class="fa-solid fa-trash"></i></button>
                                    </template>
                                    <div class="flex items-center gap-2">
                                        <button v-if="item.type === 'proxy_form'" @click="downloadCEOID" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 hover:text-blue-600 flex items-center gap-1.5" title="대표자 신분증 사본 다운로드">
                                            <i class="fa-solid fa-id-card text-blue-500"></i><span class="hidden md:inline">신분증 사본</span>
                                        </button>
                                        <button @click="handleAction(item)" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-primary hover:border-primary flex items-center gap-2 shadow-sm">
                                            <i :class="getActionIcon(item.type)"></i><span class="hidden sm:inline">{{ getActionText(item.type) }}</span>
                                        </button>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>

                    <!-- 그리드 뷰 -->
                    <div v-else class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        <div v-for="(item, index) in filteredItems" :key="item.id" class="bg-surface border border-gray-200 rounded-xl p-5 hover:shadow-md transition-shadow relative group">
                            <!-- 다중 선택 체크박스 -->
                            <div class="absolute top-3 left-3 z-10">
                                <input type="checkbox" v-model="selectedItems" :value="item" class="w-4 h-4 text-blue-600 bg-white border-gray-300 rounded focus:ring-blue-500 cursor-pointer shadow-sm">
                            </div>

                            <div v-if="isAdminMode" class="absolute top-3 right-3 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity z-10 bg-white/90 rounded-md px-1">
                                <template v-if="!searchQuery">
                                    <button @click.stop="moveItem(item, index, -1)" :disabled="index === 0" class="p-1 text-gray-400 hover:text-blue-600 disabled:opacity-30"><i class="fa-solid fa-arrow-left"></i></button>
                                    <button @click.stop="moveItem(item, index, 1)" :disabled="index === filteredItems.length - 1" class="p-1 text-gray-400 hover:text-blue-600 disabled:opacity-30"><i class="fa-solid fa-arrow-right"></i></button>
                                    <span class="border-r border-gray-200 mx-1"></span>
                                </template>

                                    file_path: i.file_path, files: i.files || [], sort_order: i.sort_order || 0

                            if (cat.id === activeCategoryId.value) return cat;
                            if (cat.subCategories) {
                                const sub = cat.subCategories.find(s => s.id === activeCategoryId.value);
                                if (sub) return sub;
                            }
                        }
                    } return null;
                };

                const openAddModal = () => { isEditing.value = false; modalForm.value = { id: '', name: '', type: 'download', desc: '', files: [], file_path: '' }; showItemModal.value = true; };
                const openEditModal = (item) => { isEditing.value = true; modalForm.value = JSON.parse(JSON.stringify(item)); if(!modalForm.value.files) modalForm.value.files = []; showItemModal.value = true; };
                const closeModal = () => { showItemModal.value = false; isDragging.value = false; };
                
                const triggerFileInput = () => { fileInputRef.value.click(); };
                const handleFileDrop = (e) => { isDragging.value = false; if (e.dataTransfer.files.length > 0) processFiles(e.dataTransfer.files); };
                const handleFileUpload = (e) => { if (e.target.files.length > 0) processFiles(e.target.files); };
                
                const processFiles = (fileList) => {
                    for (let i = 0; i < fileList.length; i++) {
                        const file = fileList[i];
                        if (isDbConnected.value) {
                            modalForm.value.files.push({ fileObj: file, name: file.name, size: file.size, isNew: true });
                        } else {
                            const url = URL.createObjectURL(file);
                            modalForm.value.files.push({ url: url, name: file.name, size: file.size, isNew: false });
                        }
                    }
                };

                const removeFile = (idx) => { modalForm.value.files.splice(idx, 1); };

                const moveItem = async (item, currentIndex, direction) => {
                    const targetCategory = getTargetCategory();
                    if (!targetCategory || !targetCategory.items) return;
                    const items = targetCategory.items;
                    const newIndex = currentIndex + direction;
                    if (newIndex < 0 || newIndex >= items.length) return;

                    const temp = items[currentIndex];
                    items[currentIndex] = items[newIndex];
                    items[newIndex] = temp;

                    // 프론트엔드 순서 재배열 (sort_order 재할당)
                    for (let i = 0; i < items.length; i++) { items[i].sort_order = i; }

                    if (isDbConnected.value) {
                        try {
                            // upsert 대신 update를 Promise.all로 묶어 필수값 누락 에러(NOT NULL constraint) 방지
                            const updatePromises = items.map(it => 
                                supabase.from('items').update({ sort_order: it.sort_order }).eq('id', it.id)
                            );
                            
                            const results = await Promise.all(updatePromises);
                            
                            // 통신 결과 중 에러가 있는지 체크
                            const errorResult = results.find(res => res.error);
                            if (errorResult) {
                                console.error('순서 저장 상세 에러:', errorResult.error);
                                throw errorResult.error;
                            }
                        } catch (e) {
                            console.error('순서 저장 실패:', e);
                            // (수정됨) 에러의 진짜 원인을 화면에 직접 띄우도록 변경
                            showToast(`저장 실패: ${e.message || '알 수 없는 오류'}`, 'error');
                        }
                    }
                };

                const saveItem = async () => {
                    if (!modalForm.value.name.trim()) return showToast('항목명을 입력해주세요.', 'error');
                    const targetCategory = getTargetCategory();
                    if (!targetCategory) return;
                    
                    let finalFiles = [];

                    if (isDbConnected.value) {
                        isUploading.value = true;
                        
                        if (['download', 'document'].includes(modalForm.value.type)) {
                            for (let i = 0; i < modalForm.value.files.length; i++) {
                                const fData = modalForm.value.files[i];
                                uploadProgress.value = `${i+1}/${modalForm.value.files.length}`;
                                
                                if (fData.isNew) {
                                    const fileName = `${Date.now()}_${fData.name}`;
                                    const { data, error } = await supabase.storage.from('documents').upload(fileName, fData.fileObj);
                                    if (!error) {
                                        const { data: urlData } = supabase.storage.from('documents').getPublicUrl(fileName);
                                        finalFiles.push({ name: fData.name, url: urlData.publicUrl, size: fData.size });
                                    }
                                } else { finalFiles.push(fData); }
                            }
                        }

                        const payload = { 
                            name: modalForm.value.name, type: modalForm.value.type, description: modalForm.value.desc,
                            files: finalFiles, file_path: modalForm.value.file_path
                        };

                        if (isEditing.value) {
                            await supabase.from('items').update(payload).eq('id', modalForm.value.id);
                        } else {
                            payload.category_id = targetCategory.id;
                            payload.sort_order = targetCategory.items.length; // 맨 끝에 추가
                            await supabase.from('items').insert(payload);
                        }
                        await loadData();
                        isUploading.value = false;
                        uploadProgress.value = '';
                    } else {
                        // Local Mode
                        if (isEditing.value) {
                            const index = targetCategory.items.findIndex(i => i.id === modalForm.value.id);
                            if (index !== -1) targetCategory.items[index] = { ...modalForm.value };
                        } else { 
                            targetCategory.items.push({ ...modalForm.value, id: 'item_' + Date.now(), sort_order: targetCategory.items.length }); 
                        }
                    }
                    closeModal(); showToast(isEditing.value ? '수정되었습니다.' : '추가되었습니다.');
                };

                const confirmDelete = (item) => { itemToDelete.value = item; showDeleteModal.value = true; };
                const executeDelete = async () => { /* 생략 (기존과 동일) */ showDeleteModal.value = false; };

                const handleAction = (item) => {
                    if (item.type === 'proxy_form') {
                        showProxyForm.value = true;
                    } else if (['download', 'document'].includes(item.type)) {
                        previewItem.value = item;
                        showPreviewModal.value = true;
                    } else if (item.file_path) {
                        window.open(item.file_path, '_blank');
                    }
                };

                const hasFiles = (item) => { return (item?.files && item.files.length > 0) || item?.file_path; };
                const getFileCount = (item) => { return item?.files?.length || (item?.file_path ? 1 : 0); };

                const downloadActualFile = async (url, customName = null) => {
                    try {
                        showToast('파일을 불러오는 중입니다...', 'success');
                        const response = await fetch(url);
                        if (!response.ok) throw new Error('Network response was not ok');
                        const blob = await response.blob();
                        const blobUrl = window.URL.createObjectURL(blob);
                        
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = blobUrl;
                        a.download = customName || url.split('/').pop().split('?')[0]; // URL에서 파일명 추출
                        
                        document.body.appendChild(a);
                        a.click();
                        
                        window.URL.revokeObjectURL(blobUrl);
                        document.body.removeChild(a);
                    } catch (e) {
                        console.error('Download failed, opening in new tab instead.', e);
                        window.open(url, '_blank');
                    }
                };

                const downloadAllFiles = async (item) => {
                    if (!item.files || item.files.length === 0) return;
                    for (const f of item.files) {
                        await downloadActualFile(f.url, f.name);
                    }
                    showToast('모든 파일의 다운로드가 시작되었습니다.');
                };

                // ZIP 파일 생성 기능
                const downloadZip = async () => {
                    if (selectedItems.value.length === 0) return;
                    isZipping.value = true;
                    
                    try {
                        const zip = new JSZip();
                        let hasContent = false;

                        for (const item of selectedItems.value) {
                            if (item.files && item.files.length > 0) {
                                const folder = zip.folder(item.name); // 각 항목명으로 폴더 생성
                                for (const fileObj of item.files) {
                                    try {
                                        const response = await fetch(fileObj.url);
                                        const blob = await response.blob();
                                        folder.file(fileObj.name || '다운로드파일', blob);
                                        hasContent = true;
                                    } catch (e) { console.error('ZIP 압축 중 파일 다운로드 실패:', e); }
                                }
                            } else if (item.file_path && ['download', 'document'].includes(item.type)) {
                                try {
                                    const response = await fetch(item.file_path);
                                    const blob = await response.blob();
                                    const filename = item.file_path.split('/').pop().split('?')[0] || item.name;
                                    zip.file(`${item.name}_${filename}`, blob);
                                    hasContent = true;
                                } catch (e) {}
                            }
                        }

                        if (!hasContent) {
                            showToast('압축할 수 있는 실제 첨부파일이 없습니다.', 'error');
                            isZipping.value = false;
                            return;
                        }

                        const content = await zip.generateAsync({ type: 'blob' });
                        const url = window.URL.createObjectURL(content);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `업무포털_일괄다운로드_${Date.now()}.zip`;
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(url);
                        document.body.removeChild(a);
                        
                        showToast('ZIP 압축 다운로드가 완료되었습니다.');
                        selectedItems.value = []; // 선택 초기화
                    } catch (error) {
                        showToast('압축 과정에서 오류가 발생했습니다.', 'error');
                        console.error(error);
                    } finally {
                        isZipping.value = false;
                    }
                };

                const showPreviewModal = ref(false);
                const previewItem = ref(null);
                const closePreviewModal = () => { showPreviewModal.value = false; previewItem.value = null; };
                const printPreview = () => { window.print(); };
                
                const downloadPreviewPDF = () => {
                    const element = document.getElementById('preview-content');
                    // 높이를 살짝 줄이고 scale을 1로 강제하여 1페이지만 출력되도록 픽셀 오차 방지
                    const originalTransform = element.style.transform;
                    const originalHeight = element.style.height;
                    
                    element.style.transform = 'scale(1)';
                    element.style.height = '296mm'; // 297mm에서 1mm 축소
                    
                    html2pdf().set({ margin: 0, filename: `${previewItem.value.name}_표지.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(element).save().then(() => {
                        element.style.transform = originalTransform;
                        element.style.height = originalHeight || 'auto';
                        showToast('PDF 표지 다운로드 완료');
                    });
                };
                
                const applyTemplate = (type) => { /* 생략 (기존과 동일) */ };
                const generatePDF = () => { /* PDF 발급 로직 */ };
                const printForm = () => { window.print(); };
                const downloadCEOID = () => { window.open("https://zpzaiuqcoltshtsrllxx.supabase.co/storage/v1/object/sign/company_assets/Representative's%20ID%20Card.jpg...", '_blank'); };

                const getIcon = (t) => ({ download: 'fa-solid fa-file-arrow-down', document: 'fa-solid fa-file-signature', system: 'fa-solid fa-laptop-code', link: 'fa-solid fa-arrow-up-right-from-square', proxy_form: 'fa-solid fa-file-invoice' }[t] || 'fa-solid fa-file');
                const getIconClass = (t) => ({ download: 'bg-blue-50 text-blue-600', document: 'bg-emerald-50 text-emerald-600', system: 'bg-purple-50 text-purple-600', link: 'bg-amber-50 text-amber-600', proxy_form: 'bg-rose-50 text-rose-600' }[t] || 'bg-gray-50 text-gray-600');
                const getTypeName = (t) => ({ download: '양식 파일', document: '내부 기안', system: '사내 시스템', link: '외부 링크', proxy_form: '스마트 폼' }[t] || '기타');
                const getActionText = (t) => ({ download: '열람/다운로드', document: '열람/다운로드', system: '시스템 열기', link: '바로가기', proxy_form: '작성/발급' }[t] || '실행');
                const getActionIcon = (t) => ({ download: 'fa-solid fa-folder-open', document: 'fa-solid fa-folder-open', system: 'fa-solid fa-desktop', link: 'fa-solid fa-link', proxy_form: 'fa-solid fa-wand-magic-sparkles' }[t] || 'fa-solid fa-play');

                onMounted(() => {
                    const savedEmail = localStorage.getItem('savedEmail');
                    if (savedEmail) { authForm.value.email = savedEmail; rememberId.value = true; }
                    checkSession();
                });

                return {
                    authState, authForm, isAuthLoading, userProfile, handleLogin, handleRegister, handleLogout,
                    rememberId, keepLoggedIn, showUserModal, userList, openUserManagement, updateUserStatus,
                    isSidebarOpen, searchQuery, activeCategoryId, activeCategoryName, filteredItems, viewMode, menuGroups,
                    toggleSidebar, selectCategory, selectSubCategory, isCategoryActive, isAdminMode, isDbConnected, seedDatabase,
                    showItemModal, showDeleteModal, isEditing, isUploading, uploadProgress, modalForm, itemToDelete,
                    isDragging, fileInputRef, triggerFileInput, handleFileDrop, handleFileUpload, removeFile,
                    selectedItems, isZipping, downloadZip, moveItem,
                    openAddModal, openEditModal, closeModal, saveItem, confirmDelete, executeDelete, handleAction,
                    hasFiles, getFileCount, downloadActualFile, downloadAllFiles,
                    getIcon, getIconClass, getTypeName, getActionText, getActionIcon, downloadCEOID, toast,
                    showProxyForm, proxyData, formattedDate, stampImage, applyTemplate, generatePDF, printForm,
                    showPreviewModal, previewItem, closePreviewModal, printPreview, downloadPreviewPDF
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
