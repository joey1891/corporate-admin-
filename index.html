<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사내 업무 지원 포털</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- html2pdf, html2canvas, JSZip, FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1e40af', secondary: '#3b82f6', background: '#f3f4f6', surface: '#ffffff', },
                    fontFamily: { sans: ['Inter', 'Pretendard', 'sans-serif'], }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .html-content h1 { font-size: 1.75rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; }
        .html-content p { margin-bottom: 0.75rem; line-height: 1.6; }
        .html-content a { color: #2563eb; text-decoration: underline; }
        
        .a4-preview { width: 210mm; height: 297mm; background: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin: 0 auto; padding: 12mm; position: relative; transform-origin: top center; overflow: hidden; box-sizing: border-box; }
        @media print { 
            body * { visibility: hidden; } 
            .print-target, .print-target * { visibility: visible; } 
            .print-target { position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; padding: 12mm; box-shadow: none !important; margin: 0 !important; transform: none !important; overflow: hidden; box-sizing: border-box; } 
        }
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        .slide-fade-enter-active { transition: all 0.3s ease-out; }
        .slide-fade-leave-active { transition: all 0.2s cubic-bezier(1, 0.5, 0.8, 1); }
        .slide-fade-enter-from, .slide-fade-leave-to { transform: translateY(-10px); opacity: 0; }
    </style>
</head>
<body class="text-gray-800 h-screen overflow-hidden">
    <div id="app" class="flex h-full w-full relative">
        
        <transition name="fade">
            <div v-if="authState !== 'authenticated'" class="fixed inset-0 z-[100] bg-gray-100 flex items-center justify-center p-4">
                <div v-if="authState === 'loading'" class="flex flex-col items-center">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-primary mb-4"></i>
                    <p class="text-gray-500 font-medium">시스템 접속 중...</p>
                </div>
                
                <div v-else-if="['login', 'register'].includes(authState)" class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                    <div class="p-8 text-center bg-gray-50 border-b border-gray-100">
                        <div class="w-16 h-16 bg-primary text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-lg"><i class="fa-solid fa-building"></i></div>
                        <h2 class="text-2xl font-bold text-gray-900 tracking-tight mb-1">통합 업무 포털</h2>
                        <p class="text-sm text-gray-500">사내 시스템 접속</p>
                    </div>
                    <div class="p-8">
                        <div class="flex bg-gray-100 p-1 rounded-lg mb-6">
                            <button @click="authState = 'login'" :class="['flex-1 py-2 text-sm font-bold rounded-md transition-colors', authState === 'login' ? 'bg-white shadow text-primary' : 'text-gray-500']">로그인</button>
                            <button @click="authState = 'register'" :class="['flex-1 py-2 text-sm font-bold rounded-md transition-colors', authState === 'register' ? 'bg-white shadow text-primary' : 'text-gray-500']">회원가입</button>
                        </div>
                        <form @submit.prevent="authState === 'login' ? handleLogin() : handleRegister()" class="space-y-4">
                            <div v-if="authState === 'register'">
                                <label class="block text-xs font-semibold text-gray-600 mb-1">이름 (실명)</label>
                                <input type="text" v-model="authForm.name" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-primary outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">이메일 (사내 계정)</label>
                                <input type="email" v-model="authForm.email" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-primary outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">비밀번호</label>
                                <input type="password" v-model="authForm.password" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-primary outline-none">
                            </div>
                            
                            <div v-if="authState === 'login'" class="flex items-center gap-4 mt-3 mb-2 px-1 text-sm">
                                <label class="flex items-center text-gray-600 cursor-pointer hover:text-primary transition-colors">
                                    <input type="checkbox" v-model="rememberId" class="mr-2 rounded border-gray-300 text-primary focus:ring-primary h-4 w-4"> <span>ID 기억하기</span>
                                </label>
                                <label class="flex items-center text-gray-600 cursor-pointer hover:text-primary transition-colors">
                                    <input type="checkbox" v-model="keepLoggedIn" class="mr-2 rounded border-gray-300 text-primary focus:ring-primary h-4 w-4"> <span>로그인 유지</span>
                                </label>
                            </div>
                            
                            <button type="submit" :disabled="isAuthLoading" class="w-full py-3 px-4 bg-primary text-white rounded-lg font-bold shadow-md hover:bg-blue-800 transition-all flex justify-center items-center">
                                <i v-if="isAuthLoading" class="fa-solid fa-spinner fa-spin mr-2"></i> {{ authState === 'login' ? '로그인' : '가입 신청하기' }}
                            </button>
                        </form>
                    </div>
                </div>

                <div v-else-if="authState === 'pending'" class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 text-center border-t-4 border-amber-500">
                    <div class="w-20 h-20 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6"><i class="fa-solid fa-hourglass-half"></i></div>
                    <h2 class="text-2xl font-bold text-gray-900 mb-3">관리자 승인 대기 중</h2>
                    <p class="text-gray-500 mb-8 text-sm">가입 신청이 완료되었습니다.<br>관리자의 승인 및 소속 배정 후 이용하실 수 있습니다.</p>
                    <button @click="handleLogout" class="px-6 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-lg font-medium text-sm">다른 계정으로 로그인</button>
                </div>
            </div>
        </transition>

        <template v-if="authState === 'authenticated'">
            <div v-if="isSidebarOpen" @click="toggleSidebar" class="fixed inset-0 bg-black bg-opacity-50 z-20 md:hidden"></div>

            <aside :class="['fixed md:static inset-y-0 left-0 z-30 w-72 bg-surface border-r border-gray-200 transform transition-transform duration-300 flex flex-col', isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0']">
                <div class="px-6 py-4 border-b border-gray-100 flex-shrink-0 bg-gray-50">
                    <div class="flex items-center mb-3">
                        <i class="fa-solid fa-building text-primary text-xl mr-3"></i>
                        <div class="flex flex-col min-w-0">
                            <span class="text-xs text-gray-500 font-bold tracking-wider uppercase">Workspace</span>
                            <span class="text-sm font-black text-gray-900 truncate">{{ currentCompanyName || '통합 포털' }}</span>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <a href="https://www.hyminternational.com/" target="_blank" class="w-full py-1.5 px-3 bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold rounded flex items-center justify-center transition-all shadow-sm">
                            <i class="fa-solid fa-globe mr-1.5"></i> HYM 공식 홈페이지
                        </a>
                        <a href="https://joey1891.github.io/corporate-admin-/e-Approval%20System.html" target="_blank" class="w-full py-1.5 px-3 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded flex items-center justify-center transition-all shadow-sm">
                            <i class="fa-solid fa-file-signature mr-1.5"></i> 전자결재시스템 (e-Approval)
                        </a>
                        <div class="flex gap-1.5">
                            <a href="https://www.exov.store/" target="_blank" class="flex-1 py-1.5 px-2 bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold rounded flex items-center justify-center transition-all shadow-sm">
                                <i class="fa-solid fa-cart-shopping mr-1"></i> 글로벌몰 (EXOV)
                            </a>
                            <a href="https://smartstore.naver.com/exov" target="_blank" class="flex-1 py-1.5 px-2 bg-emerald-500 hover:bg-emerald-600 text-white text-[11px] font-bold rounded flex items-center justify-center transition-all shadow-sm">
                                <i class="fa-solid fa-store mr-1"></i> 국내 스마트스토어
                            </a>
                        </div>
                    </div>
                </div>

                <div class="overflow-y-auto flex-grow py-4">
                    <div v-for="group in visibleMenuGroups" :key="group.sectorId" class="mb-4">
                        <div class="bg-gray-100 border-l-4 border-primary px-4 py-2 mb-1 flex items-center justify-between cursor-pointer hover:bg-gray-200 transition-colors" @click="toggleSector(group)">
                            <div class="flex items-center gap-2 flex-1">
                                <i :class="['text-xs text-gray-500 transition-transform duration-200', group.isOpen ? 'fa-solid fa-chevron-down' : 'fa-solid fa-chevron-right']"></i>
                                <h3 class="text-[15px] font-black text-gray-800 tracking-wide select-none">{{ group.sectorName }}</h3>
                            </div>
                            <div v-if="isAdminMode" class="flex gap-1" @click.stop>
                                <button @click="moveCategory(group.sectorId, -1)" class="text-gray-400 hover:text-primary"><i class="fa-solid fa-caret-up"></i></button>
                                <button @click="moveCategory(group.sectorId, 1)" class="text-gray-400 hover:text-primary"><i class="fa-solid fa-caret-down"></i></button>
                                <button @click="openCatModal(group.sectorId, 'edit', group.sectorName)" class="ml-1 text-blue-500 hover:text-blue-700"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button @click="confirmDeleteCategory(group.sectorId, group.sectorName)" class="ml-1 text-red-500 hover:text-red-700"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </div>
                        
                        <ul v-show="group.isOpen" class="space-y-1 px-3 mt-1 pb-2">
                            <li v-for="category in group.categories" :key="category.id"
                                @dragover.prevent="isAdminMode && dragItem ? dragOverCategory = category.id : null"
                                @dragleave="dragOverCategory = null"
                                @drop="dragDropToCategory($event, category.id)">
                                <div :class="['flex items-center w-full rounded-lg transition-colors', activeCategoryId === category.id ? 'bg-blue-50' : 'hover:bg-gray-50', dragOverCategory === category.id ? 'bg-blue-100 ring-2 ring-primary border-dashed' : '']">
                                    <button @click="selectCategory(category)" class="flex-1 flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-left">
                                        <i :class="['w-5 text-center', category.icon || 'fa-solid fa-folder', activeCategoryId === category.id ? 'text-primary' : 'text-gray-400']"></i>
                                        <span :class="activeCategoryId === category.id ? 'text-primary font-bold' : 'text-gray-700'">{{ category.name }}</span>
                                    </button>
                                    <div v-if="isAdminMode" class="flex gap-1 pr-2">
                                        <button @click="moveCategory(category.id, -1)" class="text-gray-300 hover:text-primary"><i class="fa-solid fa-caret-up text-[10px]"></i></button>
                                        <button @click="moveCategory(category.id, 1)" class="text-gray-300 hover:text-primary"><i class="fa-solid fa-caret-down text-[10px]"></i></button>
                                        <button @click="openCatModal(category.id, 'edit', category.name, category.icon)" class="text-blue-400 hover:text-blue-600"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                        <button @click="confirmDeleteCategory(category.id, category.name)" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash text-[10px]"></i></button>
                                    </div>
                                </div>
                            </li>
                            <li v-if="isAdminMode" class="pt-1">
                                <button @click="openCatModal(null, 'add', '', '', group.sectorId)" class="w-full text-left px-3 py-1.5 text-sm text-blue-600 font-medium hover:bg-blue-50 rounded"><i class="fa-solid fa-plus mr-1"></i> 하위 메뉴 추가</button>
                            </li>
                        </ul>
                    </div>
                    
                    <div v-if="isAdminMode" class="px-4 mt-4">
                        <button @click="openCatModal(null, 'add_sector')" class="w-full py-2 bg-gray-100 text-gray-600 font-bold text-sm rounded-lg hover:bg-gray-200 border border-dashed border-gray-300"><i class="fa-solid fa-plus mr-1"></i> 새 부문 만들기</button>
                    </div>
                </div>
                
                <div class="p-4 border-t border-gray-100 bg-gray-50 flex-shrink-0 flex items-center justify-between">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-9 h-9 rounded-full bg-primary text-white flex items-center justify-center font-bold text-sm">{{ userProfile?.full_name ? userProfile.full_name.substring(0,2) : 'US' }}</div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-medium text-gray-900 truncate">{{ userProfile?.full_name || '사용자' }}</p>
                            <p v-if="userProfile?.role === 'admin'" class="text-[10px] text-red-600 font-bold mt-0.5">최고 관리자</p>
                        </div>
                    </div>
                    <button @click="handleLogout" class="text-gray-400 hover:text-red-500 p-2"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </aside>

            <main class="flex-1 flex flex-col min-w-0 bg-background overflow-hidden relative">
                <header class="h-16 bg-surface border-b border-gray-200 flex items-center justify-between px-4 sm:px-6 z-10">
                    <div class="flex items-center flex-1 gap-4">
                        <button @click="toggleSidebar" class="md:hidden text-gray-500"><i class="fa-solid fa-bars text-xl"></i></button>
                        
                        <div v-if="userProfile?.role === 'admin'" class="relative flex items-center bg-gray-100 rounded-lg p-1 border border-gray-200">
                            <i class="fa-solid fa-building text-gray-400 ml-2"></i>
                            <select v-model="currentCompanyId" @change="loadData" class="bg-transparent border-none text-sm font-bold text-gray-700 focus:ring-0 py-1 pl-2 pr-8 cursor-pointer outline-none">
                                <option v-for="c in companies" :key="c.id" :value="c.id">{{ c.name }}</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2 md:gap-3">
                        <button v-if="selectedItems.length > 0" @click="downloadSelectedZip" class="flex items-center px-3 py-1.5 bg-blue-600 text-white rounded text-xs font-bold shadow-sm">
                            <i class="fa-solid fa-file-zipper mr-1.5"></i> 선택 다운로드 ({{ selectedItems.length }})
                        </button>

                        <template v-if="userProfile?.role === 'admin'">
                            <div class="flex items-center gap-2 border-l pl-3 border-gray-200 ml-1">
                                <span class="text-xs font-bold text-gray-600">편집 모드</span>
                                <button @click="toggleAdminMode" :class="['relative inline-flex h-6 w-11 items-center rounded-full transition-colors', isAdminMode ? 'bg-red-500' : 'bg-gray-200']">
                                    <span :class="['inline-block h-4 w-4 transform rounded-full bg-white transition-transform', isAdminMode ? 'translate-x-6' : 'translate-x-1']"></span>
                                </button>
                            </div>
                            
                            <button v-if="isAdminMode" @click="openAddCompanyModal" class="hidden md:flex items-center px-3 py-1.5 ml-2 bg-indigo-100 text-indigo-700 border border-indigo-300 rounded text-xs font-bold hover:bg-indigo-200">
                                <i class="fa-solid fa-sitemap mr-1.5"></i> 자회사 세팅
                            </button>
                            <button v-if="isAdminMode" @click="openUserManagement" class="hidden md:flex items-center px-3 py-1.5 bg-purple-100 text-purple-700 border border-purple-300 rounded text-xs font-bold hover:bg-purple-200">
                                <i class="fa-solid fa-users-gear mr-1.5"></i> 회원/명함 관리
                            </button>
                        </template>
                    </div>
                </header>

                <div class="flex-1 overflow-y-auto p-4 sm:p-8 relative">
                    <div class="mb-5 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900 mb-1 flex items-center gap-2">
                                {{ activeCategoryName.split(' > ').pop() }}
                            </h1>
                            <p class="text-sm text-gray-500 pl-1">이 카테고리에 총 {{ displayItems.length }}개의 항목이 있습니다.</p>
                        </div>
                        <div class="flex bg-gray-100 rounded-lg p-1">
                            <button @click="viewMode = 'list'" :class="['px-3 py-1.5 rounded text-sm', viewMode === 'list' ? 'bg-white shadow text-primary font-bold' : 'text-gray-500']"><i class="fa-solid fa-list"></i></button>
                            <button @click="viewMode = 'grid'" :class="['px-3 py-1.5 rounded text-sm', viewMode === 'grid' ? 'bg-white shadow text-primary font-bold' : 'text-gray-500']"><i class="fa-solid fa-border-all"></i></button>
                        </div>
                    </div>

                    <div v-if="displayItems.length === 0" class="flex flex-col items-center justify-center py-20 bg-surface rounded-xl border border-gray-200 border-dashed">
                        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-400 text-2xl"><i class="fa-solid fa-folder-open"></i></div>
                        <h3 class="text-lg font-medium text-gray-900 mb-1">등록된 항목이 없습니다</h3>
                        <p v-if="isAdminMode" class="text-sm text-gray-500">우측 하단의 빨간 [+] 버튼을 눌러 새 항목이나 폴더를 추가해 보세요.</p>
                    </div>

                    <!-- 리스트 뷰 영역 -->
                    <div v-else-if="viewMode === 'list'" class="bg-surface rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                        <ul class="flex flex-col">
                            <li v-for="item in displayItems" :key="item.id" 
                                :class="['flex flex-col border-b last:border-b-0 border-gray-100 transition-colors relative', dragTargetFolderId === item.id + '_inside' ? 'bg-blue-50 ring-2 ring-inset ring-blue-400 border-dashed z-10' : 'hover:bg-gray-50', dragTargetFolderId === item.id + '_before' ? 'shadow-[inset_0_3px_0_0_#3b82f6] z-10' : '', dragTargetFolderId === item.id + '_after' ? 'shadow-[inset_0_-3px_0_0_#3b82f6] z-10' : '']"
                                :draggable="isAdminMode" 
                                @dragstart="dragStart($event, item)" 
                                @dragover.prevent="dragOverItem($event, item)" 
                                @dragleave="dragLeaveItem($event)" 
                                @drop="dragDrop($event, item)" 
                                @dragend="dragEnd">
                                <div class="p-4 flex items-center justify-between gap-4 cursor-pointer relative" @click="handleItemClick(item, $event)">
                                    <div class="flex items-center gap-4 flex-1 min-w-0" :style="{ paddingLeft: (item._depth * 1.5) + 'rem' }">
                                        <i v-if="item._depth > 0" class="fa-solid fa-turn-up fa-rotate-90 text-gray-300 absolute" :style="{ left: `calc(1.2rem + ${(item._depth - 1) * 1.5}rem)` }"></i>
                                        
                                        <i v-if="isAdminMode" class="fa-solid fa-grip-vertical text-gray-300 hover:text-gray-500" @mousedown.stop></i>
                                        <input type="checkbox" :value="item.id" v-model="selectedItems" @click.stop class="w-4 h-4 text-primary rounded border-gray-300">
                                        <div :class="['w-10 h-10 rounded-lg flex items-center justify-center text-lg flex-shrink-0 transition-transform', getIconClass(item.type)]">
                                            <i :class="getIcon(item.type, item.id)"></i>
                                        </div>
                                        <div class="min-w-0 flex-1">
                                            <h3 class="text-base font-semibold text-gray-900 truncate flex items-center gap-2">
                                                {{ item.name }} 
                                                <span v-if="hasFiles(item)" class="flex gap-1">
                                                    <i v-if="item._hasFile" class="fa-solid fa-paperclip text-xs text-blue-500" title="첨부파일 있음"></i>
                                                    <i v-if="item._hasLink" class="fa-solid fa-arrow-up-right-from-square text-xs text-emerald-500" title="외부링크 있음"></i>
                                                </span>
                                            </h3>
                                            <div class="flex items-center gap-2 mt-0.5">
                                                <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-gray-100 text-gray-600">{{ getTypeName(item.type) }}</span>
                                                <span v-if="item.description" @click.stop="toggleDescription(item)" class="text-xs text-gray-400 hover:text-primary transition-colors cursor-pointer flex items-center gap-1 z-10 relative px-1">
                                                    <i :class="['fa-solid transition-transform', expandedItemIds.includes(item.id) ? 'fa-chevron-up text-primary' : 'fa-chevron-down']"></i> 
                                                    {{ expandedItemIds.includes(item.id) ? '설명 접기' : '설명 보기' }}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="flex items-center gap-2 flex-shrink-0">
                                        <template v-if="isAdminMode">
                                            <button @click.stop="openEditModal(item)" class="w-8 h-8 flex items-center justify-center text-blue-500 hover:bg-blue-50 rounded"><i class="fa-solid fa-pen"></i></button>

                                    <tr><th class="border border-black bg-gray-50 p-2 text-center font-medium">연 락 처</th><td colspan="3" class="border border-black p-2">{{ proxyData.delegatee.phone }}</td></tr>
                                    <tr><th class="border border-black bg-gray-50 p-2 text-center font-medium">주 소</th><td colspan="3" class="border border-black p-2">{{ proxyData.delegatee.address }}</td></tr>

                            </div>
                            <div class="mt-auto pt-6 pb-4 flex flex-col items-center justify-center relative">
                                <div class="text-xl font-bold text-black mb-8">{{ formattedDate }}</div>
                                <div class="text-xl font-bold text-black flex items-center relative pr-4">

                                    <img v-if="stampImage" :src="stampImage" crossorigin="anonymous" class="absolute right-0 top-1/2 w-16 h-16 object-contain transform -translate-y-1/2 opacity-95 mix-blend-multiply" alt="직인">
                                </div>

                    </div>
                </div>
            </div>

        </template>

        <!-- 공통 토스트 알림 -->
        <div v-if="toast.show" class="fixed bottom-4 right-4 z-[200] flex items-center p-4 rounded-lg shadow-lg text-white max-w-md transition-opacity" :class="toast.type === 'error' ? 'bg-red-500' : 'bg-gray-800'">
            <i :class="['mr-3', toast.type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check']"></i>
            <div class="flex flex-col">
                <span class="text-sm font-bold">{{ toast.message }}</span>
                <span v-if="toast.subMessage" class="text-[10px] text-gray-200 mt-1 break-all bg-black/20 p-1 rounded">{{ toast.subMessage }}</span>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;

        createApp({
            setup() {
                const supabaseUrl = 'https://zpzaiuqcoltshtsrllxx.supabase.co';
                const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwemFpdXFjb2x0c2h0c3JsbHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNjA4MTcsImV4cCI6MjEwMTczNjgxN30.zWiMJ0RDpSZlWaSBKcO1X3HvF-NBLw2YTqH6sjfRbME';
                const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

                const authState = ref('loading');
                const authForm = ref({ email: '', password: '', name: '' });
                const userProfile = ref(null);
                const isAuthLoading = ref(false);
                const rememberId = ref(false);
                const keepLoggedIn = ref(false);
                
                const companies = ref([]);
                const currentCompanyId = ref('');
                
                const isAdminMode = ref(false);
                const isSidebarOpen = ref(false);
                const viewMode = ref('list');
                const menuGroups = ref([]);
                const activeCategoryId = ref('');
                const openFolderIds = ref([]);
                const expandedItemIds = ref([]);
                
                const toast = ref({ show: false, message: '', subMessage: '', type: 'success' });
                const showToast = (msg, type = 'success', sub = '') => {
                    toast.value = { show: true, message: msg, subMessage: sub, type };
                    setTimeout(() => { toast.value.show = false; }, 4000);
                };

                const checkSession = async () => {
                    if (localStorage.getItem('keepLoggedIn') === 'false') {
                        await supabase.auth.signOut();
                        localStorage.removeItem('keepLoggedIn');
                    }
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) await fetchUserProfile(session.user.id);
                    else authState.value = 'login';
                };

                const fetchUserProfile = async (userId) => {
                    try {
                        const { data, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
                        if (error) throw error;
                        userProfile.value = data;
                        if (data.status === 'pending') authState.value = 'pending';
                        else if (data.status === 'approved') { authState.value = 'authenticated'; await loadCompanies(); }
                    } catch (e) {
                        userProfile.value = { id: userId, full_name: '관리자', role: 'admin', status: 'approved' };
                        authState.value = 'authenticated'; await loadCompanies();
                    }
                };

                const handleLogin = async () => {
                    isAuthLoading.value = true;
                    try {
                        const { data, error } = await supabase.auth.signInWithPassword({ email: authForm.value.email, password: authForm.value.password });
                        if (error) throw error;
                        if (rememberId.value) localStorage.setItem('savedEmail', authForm.value.email);
                        else localStorage.removeItem('savedEmail');
                        localStorage.setItem('keepLoggedIn', keepLoggedIn.value ? 'true' : 'false');
                        await fetchUserProfile(data.user.id);
                    } catch(e) { showToast('로그인 실패: 이메일과 비밀번호를 확인하세요.', 'error', e.message); }
                    finally { isAuthLoading.value = false; }
                };

                const handleRegister = async () => {
                    isAuthLoading.value = true;
                    try {
                        const { data, error } = await supabase.auth.signUp({ email: authForm.value.email, password: authForm.value.password });
                        if (error) throw error;
                        if (data.user) {
                            await supabase.from('profiles').upsert({ id: data.user.id, email: authForm.value.email, full_name: authForm.value.name, role: 'user', status: 'pending' });
                            authState.value = 'pending';
                        }
                    } catch(e) { showToast('회원가입 실패', 'error', e.message); }
                    finally { isAuthLoading.value = false; }
                };
                
                const handleLogout = async () => { await supabase.auth.signOut(); localStorage.removeItem('keepLoggedIn'); location.reload(); };

                const loadCompanies = async () => {
                    const { data } = await supabase.from('companies').select('*').order('created_at');
                    companies.value = data || [];
                    if (companies.value.length > 0) {
                        if (userProfile.value.role !== 'admin' && userProfile.value.company_id) currentCompanyId.value = userProfile.value.company_id;
                        else if (!currentCompanyId.value) currentCompanyId.value = companies.value[0].id;
                        await loadData();
                    }
                };
                const currentCompanyName = computed(() => { const comp = companies.value.find(c => c.id === currentCompanyId.value); return comp ? comp.name : ''; });

                const showCompanyModal = ref(false);
                const newCompanyName = ref('');
                const isCloning = ref(false);
                const openAddCompanyModal = () => { newCompanyName.value = ''; showCompanyModal.value = true; };
                const executeAddCompany = async () => { 
                    if(!newCompanyName.value) return;
                    isCloning.value = true;
                    try {
                        const { data: newComp, error: compErr } = await supabase.from('companies').insert({name: newCompanyName.value}).select().single();
                        if (compErr) throw compErr;
                        const templateId = companies.value[0].id; 
                        const { data: oldCats } = await supabase.from('categories').select('*').eq('company_id', templateId);
                        const { data: oldItems } = await supabase.from('items').select('*');
                        let idMap = {};
                        const sectors = oldCats.filter(c => !c.parent_id);
                        for (let sec of sectors) {
                            const { data: nSec } = await supabase.from('categories').insert({name: sec.name, icon: sec.icon, sort_order: sec.sort_order, company_id: newComp.id}).select().single();
                            idMap[sec.id] = nSec.id;
                            const subs = oldCats.filter(c => c.parent_id === sec.id);
                            for (let sub of subs) {
                                const { data: nSub } = await supabase.from('categories').insert({name: sub.name, icon: sub.icon, sort_order: sub.sort_order, company_id: newComp.id, parent_id: nSec.id}).select().single();
                                idMap[sub.id] = nSub.id;
                            }
                        }
                        const itemsToClone = oldItems.filter(i => idMap[i.category_id]).map(i => ({
                            category_id: idMap[i.category_id], parent_id: i.parent_id, name: i.name, type: i.type, description: i.description, file_path: i.file_path, sort_order: i.sort_order
                        }));
                        if (itemsToClone.length > 0) await supabase.from('items').insert(itemsToClone);
                        showToast(`자회사 구성 완료!`); showCompanyModal.value = false; await loadCompanies();
                    } catch(e) { showToast('생성 실패', 'error', e.message); } finally { isCloning.value = false; }
                };

                // DB의 JSON 데이터를 파싱하면서 파일과 링크 종류를 구분해주는 헬퍼
                const parseItemData = (item) => {
                    let files = []; let links = [];
                    if (item.file_path && item.file_path.startsWith('[')) {
                        const parsed = JSON.parse(item.file_path);
                        const isLegacyLinkType = ['system', 'link'].includes(item.type);
                        
                        parsed.forEach(p => {
                            if (p.kind === 'file' || (!p.kind && !isLegacyLinkType)) files.push({ ...p, kind: 'file' });
                            else if (p.kind === 'link' || (!p.kind && isLegacyLinkType)) links.push({ ...p, kind: 'link' });
                        });
                    } else if (item.file_path && !item.file_path.startsWith('[')) {
                        if (['system', 'link'].includes(item.type)) links.push({ name: item.name || '바로가기', url: item.file_path, kind: 'link' });
                    }
                    return { files, links };
                };

                const loadData = async () => {
                    try {
                        const { data: cats } = await supabase.from('categories').select('*').eq('company_id', currentCompanyId.value).order('sort_order', {ascending: true});
                        const { data: itms } = await supabase.from('items').select('*').order('sort_order', {ascending: true});
                        
                        // 로드 시 추가 메타데이터 부여
                        const enrichedItms = itms.map(item => {
                            const parsed = parseItemData(item);
                            return {
                                ...item,
                                _hasFile: parsed.files.length > 0,
                                _hasLink: parsed.links.length > 0
                            };
                        });

                        const built = [];
                        const sectors = (cats||[]).filter(c => !c.parent_id).sort((a,b) => a.sort_order - b.sort_order);
                        for (const sector of sectors) {
                            const existingGroup = menuGroups.value.find(g => g.sectorId === sector.id);
                            const isOpen = existingGroup !== undefined ? existingGroup.isOpen : false;
                            const group = { sectorName: sector.name, sectorId: sector.id, categories: [], isOpen };
                            const subCats = cats.filter(c => c.parent_id === sector.id).sort((a,b) => a.sort_order - b.sort_order);
                            for (const cat of subCats) {
                                group.categories.push({ id: cat.id, name: cat.name, icon: cat.icon, items: enrichedItms.filter(i => i.category_id === cat.id).sort((a,b) => a.sort_order - b.sort_order) });
                            }
                            built.push(group);
                        }
                        menuGroups.value = built;
                        let currentStillExists = false;
                        for (const group of built) { if (group.categories.some(c => c.id === activeCategoryId.value)) { currentStillExists = true; break; } }
                        if (!currentStillExists && built.length > 0 && built[0].categories.length > 0) { 
                            activeCategoryId.value = built[0].categories[0].id; 
                            openFolderIds.value = []; expandedItemIds.value = [];
                        }
                    } catch(e) { console.error(e); }
                };

                const visibleMenuGroups = computed(() => {
                    if (userProfile.value?.role === 'admin') return menuGroups.value;
                    const allowed = userProfile.value?.allowed_menus || [];
                    if (allowed.length === 0) return menuGroups.value;
                    return menuGroups.value.map(group => {
                        const checkedSubCats = group.categories.filter(cat => allowed.includes(cat.id));
                        if (checkedSubCats.length > 0) return { ...group, categories: checkedSubCats };
                        return null;
                    }).filter(group => group !== null && group.categories.length > 0);
                });

                const showUserModal = ref(false);
                const usersList = ref([]);
                const editingUser = ref(null);
                const menuGroupsForEditingUser = ref([]);
                const openUserManagement = async () => {
                    const { data } = await supabase.from('profiles').select('*').order('created_at', {ascending: false});
                    usersList.value = data || []; showUserModal.value = true;
                };
                const selectUserForEdit = async (user) => {
                    editingUser.value = JSON.parse(JSON.stringify(user));
                    if (!editingUser.value.allowed_menus) editingUser.value.allowed_menus = [];
                    await loadMenuGroupsForEditingUser();
                };
                const loadMenuGroupsForEditingUser = async () => {
                    if(!editingUser.value) return;
                    let targetCompId = editingUser.value.company_id || companies.value[0]?.id;
                    const { data: cats } = await supabase.from('categories').select('*').eq('company_id', targetCompId).order('sort_order');
                    const built = [];
                    const sectors = (cats||[]).filter(c => !c.parent_id).sort((a,b) => a.sort_order - b.sort_order);
                    for (const sector of sectors) {
                        const subCats = cats.filter(c => c.parent_id === sector.id).sort((a,b) => a.sort_order - b.sort_order);
                        if(subCats.length > 0) built.push({ sectorId: sector.id, sectorName: sector.name, categories: subCats });
                    }
                    menuGroupsForEditingUser.value = built;
                };
                const isSectorFullyChecked = (group) => { return group.categories.every(cat => editingUser.value.allowed_menus.includes(cat.id)); };
                const toggleSectorPermission = (group, isChecked) => {
                    const catIds = group.categories.map(c => c.id);
                    if (isChecked) { catIds.forEach(id => { if(!editingUser.value.allowed_menus.includes(id)) editingUser.value.allowed_menus.push(id); }); } 
                    else { editingUser.value.allowed_menus = editingUser.value.allowed_menus.filter(id => !catIds.includes(id)); }
                };
                const updateUserStatus = async (status) => { await supabase.from('profiles').update({ status }).eq('id', editingUser.value.id); showToast(`승인 상태 변경됨`); openUserManagement(); };
                const saveUserPermissions = async () => { await supabase.from('profiles').update({ role: editingUser.value.role, company_id: editingUser.value.company_id, allowed_menus: editingUser.value.allowed_menus }).eq('id', editingUser.value.id); showToast(`저장 완료`); openUserManagement(); };
                const getCompanyName = (id) => { const c = companies.value.find(x => x.id === id); return c ? c.name : ''; };

                const showCatModal = ref(false);
                const catModalData = ref({ id: null, name: '', parent_id: null, mode: 'add', title: '' });
                const openCatModal = (id, mode, name = '', icon = '', parent_id = null) => {
                    catModalData.value = { id, name, parent_id, mode, title: mode === 'edit' ? '이름 수정' : (mode === 'add_sector' ? '새 부문 만들기' : '하위 메뉴 추가') }; showCatModal.value = true;
                };
                const saveCategory = async () => {
                    if (!catModalData.value.name) return;
                    if (catModalData.value.mode === 'edit') { await supabase.from('categories').update({ name: catModalData.value.name }).eq('id', catModalData.value.id); } 
                    else {
                        const { data: cats } = await supabase.from('categories').select('sort_order').eq('company_id', currentCompanyId.value);
                        const maxSort = cats.length > 0 ? Math.max(...cats.map(c => c.sort_order || 0)) : 0;
                        await supabase.from('categories').insert({ name: catModalData.value.name, company_id: currentCompanyId.value, parent_id: catModalData.value.mode === 'add' ? catModalData.value.parent_id : null, sort_order: maxSort + 1 });
                    }
                    showToast('저장됨'); showCatModal.value = false; await loadData();
                };
                const moveCategory = async (id, direction) => {
                    const { data: cats } = await supabase.from('categories').select('*').eq('company_id', currentCompanyId.value).order('sort_order');
                    const target = cats.find(c => c.id === id);
                    if(!target) return;
                    const siblings = cats.filter(c => c.parent_id === target.parent_id).sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
                    const idx = siblings.findIndex(c => c.id === id);
                    if (idx < 0 || (direction === -1 && idx === 0) || (direction === 1 && idx === siblings.length - 1)) return;
                    const temp = siblings[idx]; siblings[idx] = siblings[idx + direction]; siblings[idx + direction] = temp;
                    const updates = siblings.map((c, index) => supabase.from('categories').update({sort_order: index + 1}).eq('id', c.id));
                    await Promise.all(updates); await loadData();
                };
                
                const showDeleteModal = ref(false);
                const deleteTarget = ref({ type: '', id: '', name: '' });
                const confirmDeleteCategory = (id, name) => { deleteTarget.value = { type: 'category', id, name }; showDeleteModal.value = true; };
                const confirmDelete = (item) => { deleteTarget.value = { type: 'item', id: item.id, name: item.name }; showDeleteModal.value = true; };
                const executeDelete = async () => {
                    if (deleteTarget.value.type === 'category') await supabase.from('categories').delete().eq('id', deleteTarget.value.id);
                    else await supabase.from('items').delete().eq('id', deleteTarget.value.id);
                    showToast('삭제됨'); showDeleteModal.value = false; await loadData();
                };

                const showItemModal = ref(false);
                const isEditing = ref(false);
                const isUploading = ref(false);
                const dragActive = ref(false);
                const dragOverCategory = ref(null);
                
                const modalForm = ref({ id: '', name: '', type: 'download', description: '', files: [], links: [{name: '', url: ''}], sector_id: '', category_id: '', original_category_id: '' });
                
                const modalAvailableCategories = computed(() => {
                    const group = menuGroups.value.find(g => g.sectorId === modalForm.value.sector_id);
                    return group ? group.categories : [];
                });

                const handleModalSectorChange = () => {
                    const cats = modalAvailableCategories.value;
                    if (cats.length > 0) modalForm.value.category_id = cats[0].id;
                    else modalForm.value.category_id = '';
                };
                
                const openAddModal = () => { 
                    isEditing.value = false; 
                    let currentSectorId = '';
                    for (const g of menuGroups.value) { if (g.categories.some(c => c.id === activeCategoryId.value)) { currentSectorId = g.sectorId; break; } }
                    modalForm.value = { type: 'download', name: '', description: '', files: [], links: [{name: '', url: ''}], sector_id: currentSectorId, category_id: activeCategoryId.value, original_category_id: activeCategoryId.value }; 
                    showItemModal.value = true; 
                };
                
                const openEditModal = (i) => {
                    isEditing.value = true; 
                    
                    const parsed = parseItemData(i);
                    let initialLinks = parsed.links;
                    if (initialLinks.length === 0) initialLinks = [{name: '', url: ''}];

                    let itemSectorId = '';
                    for (const g of menuGroups.value) { if (g.categories.some(c => c.id === i.category_id)) { itemSectorId = g.sectorId; break; } }

                    modalForm.value={
                        ...i, 
                        files: parsed.files, 
                        links: initialLinks,
                        sector_id: itemSectorId,
                        category_id: i.category_id,
                        original_category_id: i.category_id
                    }; 
                    showItemModal.value = true; 
                };
                
                const closeModal = () => showItemModal.value = false;
                const addLinkField = () => modalForm.value.links.push({name: '', url: ''});
                const removeLinkField = (idx) => { if(modalForm.value.links.length > 1) modalForm.value.links.splice(idx, 1); };
                const handleFileSelect = (e) => { const files = e.target.files; if(!files) return; for(let i=0; i<files.length; i++) modalForm.value.files.push({ fileObj: files[i], name: files[i].name, isNew: true }); dragActive.value = false; };
                const handleDrop = (e) => { dragActive.value = false; const files = e.dataTransfer.files; if(!files) return; for(let i=0; i<files.length; i++) modalForm.value.files.push({ fileObj: files[i], name: files[i].name, isNew: true }); };
                const removeFile = (idx) => modalForm.value.files.splice(idx, 1);
                
                const saveItem = async () => {
                    isUploading.value = true;
                    try {
                        let finalCombinedData = [];
                        
                        if (!['folder', 'proxy_form', 'my_business_card'].includes(modalForm.value.type)) {
                            // 1. 파일 업로드 및 데이터 생성
                            for (let fData of modalForm.value.files) {
                                if (fData.isNew) {
                                    const extMatch = fData.fileObj.name.match(/\.[^.]+$/);
                                    const safeName = `file_${Date.now()}_${Math.random().toString(36).substr(2, 9)}${extMatch ? extMatch[0] : ''}`;
                                    await supabase.storage.from('documents').upload(safeName, fData.fileObj);
                                    const { data: urlData } = supabase.storage.from('documents').getPublicUrl(safeName);
                                    finalCombinedData.push({ name: fData.name, url: urlData.publicUrl, kind: 'file' });
                                } else { 
                                    finalCombinedData.push({ name: fData.name, url: fData.url, kind: 'file' }); 
                                }
                            }
                            
                            // 2. 링크 데이터 추가
                            const validLinks = modalForm.value.links.filter(l => l.url.trim() !== '');
                            for (let lData of validLinks) {
                                finalCombinedData.push({ name: lData.name, url: lData.url, kind: 'link' });
                            }
                        }
                        
                        const finalDataStr = finalCombinedData.length > 0 ? JSON.stringify(finalCombinedData) : null;
                        const payload = { name: modalForm.value.name, type: modalForm.value.type, description: modalForm.value.description, file_path: finalDataStr, category_id: modalForm.value.category_id };
                        
                        if (isEditing.value) {
                            if (modalForm.value.original_category_id !== modalForm.value.category_id) {
                                payload.parent_id = null; // 다른 카테고리로 이동 시 최상위로 빠짐
                                const group = menuGroups.value.find(g => g.sectorId === modalForm.value.sector_id);
                                const cat = group?.categories.find(c => c.id === modalForm.value.category_id);
                                const maxSort = (cat && cat.items.length > 0) ? Math.max(...cat.items.map(x => x.sort_order || 0)) : 0;
                                payload.sort_order = maxSort + 1;
                            }

                    getTypeName: (t) => ({notice:'공지사항', download:'일반파일', document:'사내기안', system:'시스템', link:'외부링크', proxy_form:'스마트폼', my_business_card:'개인명함', folder:'폴더'}[t]||'일반항목'),
                    getActionText: (t,i, isAdmin) => t === 'folder' ? '열람' : (t === 'my_business_card' ? (isAdmin ? '명함 일괄등록' : '내 명함 열기') : (t === 'proxy_form' ? '스마트폼 작성' : (hasFiles(i) || i.description ? '상세보기' : '실행'))),
                    getActionIcon: (t, isAdmin) => t === 'folder' ? 'fa-solid fa-folder-open' : (t === 'my_business_card' ? (isAdmin ? 'fa-solid fa-users-gear' : 'fa-solid fa-image-portrait') : (t === 'proxy_form' ? 'fa-solid fa-pen-to-square' : 'fa-solid fa-up-right-and-down-left-from-center'))
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
